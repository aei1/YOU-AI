function newDraftJournal(){ return { title:'', content:'', tags:[] }; }

function openNewJournalForm(){
  draftJournal = newDraftJournal();
  editingJournalId = null; journalState = {mode:'form'};
  journalFormSnapshot = JSON.stringify(draftJournal);
  renderJournal();
}
function openEditJournalForm(id){
  const j = journal.find(x=>x.id===id); if(!j) return;
  draftJournal = { title:j.title, content:j.content||'', tags: itemTags(j).slice() };
  editingJournalId = id; journalState = {mode:'form'};
  journalFormSnapshot = JSON.stringify(draftJournal);
  renderJournal();
}
function cancelJournalForm(){ journalFormSnapshot = null; journalState = editingJournalId ? {mode:'detail', id:editingJournalId} : {mode:'list'}; renderJournal(); }
function setDraftJournalTags(value){ draftJournal.tags = parseTags(value); }

function renderJournalForm(){
  const el = document.getElementById('view-journal');
  el.innerHTML = `
    <button class="back-link" onclick="cancelJournalForm()">‹ กลับ</button>
    <div class="form-block">
      <div class="field">
        <label>หัวข้อ</label>
        <input type="text" id="journal-title-input" placeholder="เช่น สูตรตี Boss, ไอเดียใหม่" value="${escapeHtml(draftJournal.title)}" oninput="draftJournal.title=this.value">
      </div>
      <div class="field">
        <label>แท็ก / หมวดหมู่ (คั่นด้วยเว้นวรรคหรือจุลภาค)</label>
        <input type="text" id="tag-input-journal" placeholder="เช่น เกม สูตรอาหาร ไอเดีย"
               value="${escapeHtml((draftJournal.tags||[]).join(' '))}"
               oninput="setDraftJournalTags(this.value)">
      </div>
      <div class="field">
        <label>เนื้อหา</label>
        <textarea id="journal-content-input" placeholder="เขียนโน้ตของคุณที่นี่ เช่น # หัวข้อใหญ่ ## หัวข้อย่อย แล้วตามด้วยเนื้อหา" oninput="draftJournal.content=this.value">${escapeHtml(draftJournal.content)}</textarea>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary" onclick="saveJournalForm()">บันทึกไว้</button>
      <button class="btn btn-ghost" onclick="cancelJournalForm()">ยกเลิก</button>
    </div>`;
}

function saveJournalForm(){
  const title = (draftJournal.title||'').trim() || 'ไม่มีหัวข้อ';
  if(!draftJournal.content.trim()){ showToast('กรุณาใส่เนื้อหาก่อนบันทึก'); return; }
  const tags = parseTags((draftJournal.tags||[]).join(' '));
  let savedId;
  if(editingJournalId){
    const j = journal.find(x=>x.id===editingJournalId);
    Object.assign(j, { title, content:draftJournal.content, tags, updatedAt:new Date().toISOString() });
    savedId = editingJournalId;
  }else{
    savedId = uid();
    journal.push({ id:savedId, title, content:draftJournal.content, tags, updatedAt:new Date().toISOString() });
  }
  saveJournal();
  journalFormSnapshot = null;
  editingJournalId = null;
  journalState = { mode:'detail', id: savedId };
  renderJournal();
  showToast('บันทึกโน้ตแล้ว');
}

function confirmDeleteJournal(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบโน้ตนี้'; } }, 3000);
    return;
  }
  const idx = journal.findIndex(j=>j.id===id);
  if(idx===-1) return;
  const removed = journal[idx];
  journal.splice(idx,1);
  saveJournal();
  journalState = {mode:'list'};
  renderJournal();
  showToast('ลบโน้ตแล้ว', ()=>{
    journal.splice(idx,0,removed);
    saveJournal();
    journalState = {mode:'detail', id};
    renderJournal();
  });
}

function journalMatchesSearch(j, q){
  const { tags, text } = splitQuery(q);
  if(tags.length && !tags.every(k=> hasTag(j, k))) return false;
  if(!text) return true;
  if((j.title||'').toLowerCase().includes(text)) return true;
  if(itemTags(j).some(t=> normTag(t).includes(text))) return true;
  return (j.content||'').toLowerCase().includes(text);
}
function setSearchJournal(value){
  journalSearch = value;
  renderJournal();
  const input = document.getElementById('journal-search-input');
  if(input){ input.focus(); const p = input.value.length; input.setSelectionRange(p,p); }
}
function filterJournalByTag(key){
  journalSearch = '#' + key;
  journalState = {mode:'list'};
  renderJournal();
  switchTab('journal');
}

function renderJournal(){ renderJournalImpl(); pushHistoryState(); }
function renderJournalImpl(){
  const el = document.getElementById('view-journal');

  if(journalState.mode === 'form'){ renderJournalForm(); return; }

  if(journalState.mode === 'detail'){
    const j = journal.find(x=>x.id===journalState.id);
    if(!j){ journalState={mode:'list'}; renderJournal(); return; }
    el.innerHTML = `
      <button class="back-link" onclick="journalState={mode:'list'}; renderJournal();">‹ กลับ</button>
      <h2 class="detail-title">${escapeHtml(j.title)}</h2>
      <p class="detail-meta">แก้ไขล่าสุด ${fmtShortDate(j.updatedAt)}</p>
      ${tagChipsHtml(itemTags(j), 'filterJournalByTag')}
      <div class="detail-content">${mdToHtml(j.content)}</div>
      <div class="row-actions" style="margin-top:16px;">
        <button class="btn btn-ghost" onclick="openEditJournalForm('${j.id}')">แก้ไข</button>
        <button class="btn btn-danger" id="del-journal-btn" onclick="confirmDeleteJournal('${j.id}', this)">ลบโน้ตนี้</button>
      </div>`;
    return;
  }

  // Unread notifications surface here too, not just on the home board.
  const unread = unreadCount();
  const strip = unread ? `
    <div class="notif-strip">
      <span>มีแจ้งเตือนใหม่ ${unread} รายการ</span>
      <button class="btn btn-ghost btn-sm" onclick="switchTab('home')">ดูบอร์ด</button>
    </div>` : '';

  if(journal.length === 0){
    el.innerHTML = strip + `
      <div class="empty">
        <div class="doodle">🗒️</div>
        <p>ยังไม่มีโน้ตในห้องนี้ เก็บโน้ตเกม สูตรอาหาร หรือไอเดียต่างๆ ไว้ที่นี่ได้เลย</p>
        <button class="btn btn-primary" onclick="openNewJournalForm()">+ เพิ่มโน้ตแรก</button>
      </div>`;
    return;
  }
  const filtered = journal.filter(j=> journalMatchesSearch(j, journalSearch));
  const sorted = [...filtered].sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt));
  el.innerHTML = strip + `
    <div class="list-head">
      <h2>โน้ตทั้งหมด (${journal.length})</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewJournalForm()">+ เพิ่มโน้ตใหม่</button>
    </div>
    <input type="text" class="search-input" id="journal-search-input" placeholder="ค้นหาโน้ต..." value="${escapeHtml(journalSearch)}" oninput="setSearchJournal(this.value)">
    ${sorted.length===0 ? `<div class="empty"><p>ไม่พบโน้ตที่ตรงกับที่ค้นหา</p></div>` : `
    <div class="cards">
      ${sorted.map(j=>{
        const snippet = stripMd(j.content).slice(0,80);
        return `
        <div class="card" onclick="journalState={mode:'detail', id:'${j.id}'}; renderJournal();">
          <div class="card-top">
            <p class="card-title">${escapeHtml(j.title || 'ไม่มีหัวข้อ')}</p>
          </div>
          <p class="card-snippet">${escapeHtml(snippet)}</p>
          <p class="card-meta">${fmtShortDate(j.updatedAt)}${itemTags(j).length ? ' · ' + itemTags(j).map(t=>'#'+escapeHtml(String(t).replace(/^#+/,''))).join(' ') : ''}</p>
        </div>`;
      }).join('')}
    </div>`}`;
}

/* =========================================================
   NOTEBOOK — log an activity, earn points
   ========================================================= */
const ACTIVITY_KINDS = [
  { key:'read',     label:'อ่านหนังสือ' },
  { key:'exercise', label:'ออกกำลังกาย' },
  { key:'work',     label:'งาน' },
  { key:'study',    label:'เรียน' },
  { key:'other',    label:'อื่นๆ' },
];
function kindLabel(k){ const f = ACTIVITY_KINDS.find(x=>x.key===k); return f ? f.label : 'อื่นๆ'; }
function todayInputValue(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function newDraftActivity(){ return { title:'', kind:'read', points:10, date:todayInputValue() }; }

function openNewActivityForm(){
  draftActivity = newDraftActivity();
  editingActivityId = null; notebookState = {mode:'form'};
  notebookFormSnapshot = JSON.stringify(draftActivity);
  renderNotebook();
}
function openEditActivityForm(id){
  const a = wallet.activities.find(x=>x.id===id); if(!a) return;
  draftActivity = { title:a.title, kind:a.kind||'other', points:a.points, date:a.date };
  editingActivityId = id; notebookState = {mode:'form'};
  notebookFormSnapshot = JSON.stringify(draftActivity);
  renderNotebook();
}
function cancelActivityForm(){
  notebookFormSnapshot = null; editingActivityId = null;
  notebookState = {mode:'list'}; renderNotebook();
}
function setDraftActivityKind(k){ draftActivity.kind = k; renderNotebookForm(); }

function saveActivityForm(){
  const title = (draftActivity.title||'').trim();
  if(!title){ showToast('ใส่ชื่อกิจกรรมก่อนบันทึก'); return; }
  const points = Math.max(0, Math.round(Number(draftActivity.points) || 0));
  if(!points){ showToast('ใส่คะแนนที่ได้ให้มากกว่า 0'); return; }

  if(editingActivityId){
    // Editing re-balances by the difference so the ledger stays truthful.
    const a = wallet.activities.find(x=>x.id===editingActivityId);
    const diff = points - a.points;
    if(diff > 0) addPoints(diff, 'แก้ไขกิจกรรม: ' + title, 'notebook');
    else if(diff < 0){
      if(!spendPoints(-diff, 'แก้ไขกิจกรรม: ' + title, 'notebook')){
        showToast('ลดคะแนนไม่ได้ เพราะคะแนนคงเหลือไม่พอ'); return;
      }
    }
    Object.assign(a, { title, kind:draftActivity.kind, points, date:draftActivity.date });
    saveWallet();
    showToast('แก้ไขกิจกรรมแล้ว');
  }else{
    wallet.activities.push({ id:uid(), title, kind:draftActivity.kind, points, date:draftActivity.date, createdAt:new Date().toISOString() });
    addPoints(points, title, 'notebook');
    pushNotification('points', '+' + fmtPoints(points) + ' แต้ม', title + ' · คงเหลือ ' + fmtPoints(wallet.balance) + ' แต้ม');
    showToast('บันทึกแล้ว +' + fmtPoints(points) + ' แต้ม');
  }
  notebookFormSnapshot = null; editingActivityId = null;
  notebookState = {mode:'list'};
  renderNotebook(); renderHome();
}

function confirmDeleteActivity(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบ'; } }, 3000);
    return;
  }
  const idx = wallet.activities.findIndex(a=>a.id===id);
  if(idx===-1) return;
  const a = wallet.activities[idx];
  if(!spendPoints(a.points, 'ลบกิจกรรม: ' + a.title, 'notebook')){
    showToast('ลบไม่ได้ เพราะคะแนนคงเหลือไม่พอจะหักคืน'); return;
  }
  wallet.activities.splice(idx,1);
  saveWallet();
  renderNotebook(); renderHome();
  showToast('ลบกิจกรรมแล้ว -' + fmtPoints(a.points) + ' แต้ม');
}

function balanceCardHtml(sub){
  return `
    <div class="balance-card">
      <p class="balance-label">คะแนนสะสมคงเหลือ</p>
      <p class="balance-value">${fmtPoints(wallet.balance)}<span class="balance-unit">แต้ม</span></p>
      ${sub ? `<p class="balance-sub">${sub}</p>` : ''}
    </div>`;
}

function renderNotebookForm(){
  const el = document.getElementById('view-notebook');
  el.innerHTML = `
    <button class="back-link" onclick="cancelActivityForm()">‹ กลับ</button>
    <div class="form-block">
      <div class="field">
        <label>ชื่อกิจกรรม</label>
        <input type="text" id="activity-title-input" placeholder="เช่น อ่านหนังสือ 30 หน้า" value="${escapeHtml(draftActivity.title)}" oninput="draftActivity.title=this.value">
      </div>
      <div class="field">
        <label>ประเภท</label>
        <div class="toggle-group">
          ${ACTIVITY_KINDS.map(k=>`<button type="button" class="toggle-btn ${draftActivity.kind===k.key?'active':''}" onclick="setDraftActivityKind('${k.key}')">${k.label}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>คะแนนที่ได้</label>
        <input type="number" min="1" step="1" inputmode="numeric" value="${escapeHtml(String(draftActivity.points))}" oninput="draftActivity.points=this.value">
      </div>
      <div class="field">
        <label>วันที่</label>
        <input type="date" value="${escapeHtml(draftActivity.date)}" oninput="draftActivity.date=this.value">
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary" onclick="saveActivityForm()">บันทึกไว้</button>
      <button class="btn btn-ghost" onclick="cancelActivityForm()">ยกเลิก</button>
    </div>`;
}

function renderNotebook(){ renderNotebookImpl(); pushHistoryState(); }
function renderNotebookImpl(){
  const el = document.getElementById('view-notebook');
  if(!el || !wallet) return;

  if(notebookState.mode === 'form'){ renderNotebookForm(); return; }

  const acts = [...wallet.activities].sort((a,b)=> String(b.date).localeCompare(String(a.date)) || String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const earned = wallet.ledger.filter(l=>l.amount>0).reduce((s,l)=>s+l.amount,0);

  el.innerHTML = `
    ${balanceCardHtml(`ได้มาแล้วทั้งหมด ${fmtPoints(earned)} แต้ม จาก ${wallet.activities.length} กิจกรรม`)}
    <div class="list-head">
      <h2>กิจกรรมที่ได้คะแนน</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewActivityForm()">+ บันทึกกิจกรรม</button>
    </div>
    ${acts.length===0 ? `
      <div class="empty">
        <div class="doodle">📓</div>
        <p>ยังไม่มีกิจกรรม บันทึกสิ่งที่ทำวันนี้เพื่อสะสมแต้มไว้ใช้ในหน้ามาร์เก็ตได้เลย</p>
        <button class="btn btn-primary" onclick="openNewActivityForm()">+ บันทึกกิจกรรมแรก</button>
      </div>` : `
      <div class="cards">
        ${acts.map(a=>`
          <div class="card">
            <div class="card-top">
              <p class="card-title">${escapeHtml(a.title)}<span class="kind-chip">${kindLabel(a.kind)}</span></p>
              <span class="points-badge plus">+${fmtPoints(a.points)}</span>
            </div>
            <p class="card-meta">${escapeHtml(a.date||'')}</p>
            <div class="row-actions" style="margin-top:8px;">
              <button class="btn btn-ghost btn-sm" onclick="openEditActivityForm('${a.id}')">แก้ไข</button>
              <button class="btn btn-danger btn-sm" onclick="confirmDeleteActivity('${a.id}', this)">ลบ</button>
            </div>
          </div>`).join('')}
      </div>`}`;
}

/* =========================================================
   MARKET — spend points on real-life rewards
   ========================================================= */
function newDraftItem(){ return { name:'', desc:'', price:100 }; }

function openNewItemForm(){
  draftItem = newDraftItem();
  editingItemId = null; marketState = {mode:'form'};
  marketFormSnapshot = JSON.stringify(draftItem);
  renderMarket();
}
function openEditItemForm(id){
  const it = wallet.marketItems.find(x=>x.id===id); if(!it) return;
  draftItem = { name:it.name, desc:it.desc||'', price:it.price };
  editingItemId = id; marketState = {mode:'form'};
  marketFormSnapshot = JSON.stringify(draftItem);
  renderMarket();
}
function cancelItemForm(){
  marketFormSnapshot = null; editingItemId = null;
  marketState = {mode:'list'}; renderMarket();
}
function saveItemForm(){
  const name = (draftItem.name||'').trim();
  if(!name){ showToast('ใส่ชื่อไอเทมก่อนบันทึก'); return; }
  const price = Math.max(1, Math.round(Number(draftItem.price) || 0));
  if(editingItemId){
    const it = wallet.marketItems.find(x=>x.id===editingItemId);
    Object.assign(it, { name, desc:(draftItem.desc||'').trim(), price });
  }else{
    wallet.marketItems.push({ id:uid(), name, desc:(draftItem.desc||'').trim(), price, createdAt:new Date().toISOString() });
  }
  saveWallet();
  marketFormSnapshot = null; editingItemId = null;
  marketState = {mode:'list'};
  renderMarket();
  showToast('บันทึกไอเทมแล้ว');
}
function confirmDeleteItem(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบ'; } }, 3000);
    return;
  }
  const idx = wallet.marketItems.findIndex(x=>x.id===id);
  if(idx===-1) return;
  wallet.marketItems.splice(idx,1);
  saveWallet();
  renderMarket();
  showToast('ลบไอเทมแล้ว');
}
function redeemItem(id){
  const it = wallet.marketItems.find(x=>x.id===id); if(!it) return;
  if(!spendPoints(it.price, 'แลก: ' + it.name, 'market')){
    showToast('คะแนนไม่พอ ต้องมีอีก ' + fmtPoints(it.price - wallet.balance) + ' แต้ม');
    return;
  }
  wallet.redemptions.push({ id:uid(), itemId:it.id, name:it.name, price:it.price, redeemedAt:new Date().toISOString() });
  saveWallet();
  pushNotification('market', 'แลก ' + it.name + ' สำเร็จ', '-' + fmtPoints(it.price) + ' แต้ม · คงเหลือ ' + fmtPoints(wallet.balance) + ' แต้ม');
  renderMarket(); renderHome();
  showToast('แลก "' + it.name + '" แล้ว -' + fmtPoints(it.price) + ' แต้ม');
}

function renderMarketForm(){
  const el = document.getElementById('view-market');
  el.innerHTML = `
    <button class="back-link" onclick="cancelItemForm()">‹ กลับ</button>
    <div class="form-block">
      <div class="field">
        <label>ชื่อไอเทม</label>
        <input type="text" id="item-name-input" placeholder="เช่น ใบลาหยุด 1 วัน" value="${escapeHtml(draftItem.name)}" oninput="draftItem.name=this.value">
      </div>
      <div class="field">
        <label>คำอธิบาย (ถ้ามี)</label>
        <input type="text" placeholder="เช่น ใช้ขอลาหยุดได้ 1 วันโดยไม่รู้สึกผิด" value="${escapeHtml(draftItem.desc)}" oninput="draftItem.desc=this.value">
      </div>
      <div class="field">
        <label>ราคา (แต้ม)</label>
        <input type="number" min="1" step="1" inputmode="numeric" value="${escapeHtml(String(draftItem.price))}" oninput="draftItem.price=this.value">
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary" onclick="saveItemForm()">บันทึกไว้</button>
      <button class="btn btn-ghost" onclick="cancelItemForm()">ยกเลิก</button>
    </div>`;
}

function renderMarket(){ renderMarketImpl(); pushHistoryState(); }
function renderMarketImpl(){
  const el = document.getElementById('view-market');
  if(!el || !wallet) return;

  if(marketState.mode === 'form'){ renderMarketForm(); return; }

  const items = [...wallet.marketItems].sort((a,b)=> a.price - b.price);
  const recent = [...wallet.redemptions].sort((a,b)=> new Date(b.redeemedAt) - new Date(a.redeemedAt)).slice(0,5);

  el.innerHTML = `
    ${balanceCardHtml('ใช้แต้มแลกสิ่งที่อยากได้ในชีวิตจริง')}
    <div class="list-head">
      <h2>ไอเทมในร้าน</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewItemForm()">+ เพิ่มไอเทม</button>
    </div>
    ${items.length===0 ? `
      <div class="empty">
        <div class="doodle">🎁</div>
        <p>ยังไม่มีไอเทม ลองตั้งรางวัลให้ตัวเอง เช่น ใบลาหยุด 1 วัน หรือของที่อยากซื้อ</p>
        <button class="btn btn-primary" onclick="openNewItemForm()">+ เพิ่มไอเทมแรก</button>
      </div>` : `
      <div class="cards">
        ${items.map(it=>{
          const affordable = wallet.balance >= it.price;
          return `
          <div class="card">
            <div class="card-top">
              <p class="card-title">${escapeHtml(it.name)}</p>
              <span class="price-tag">${fmtPoints(it.price)} แต้ม</span>
            </div>
            ${it.desc ? `<p class="card-snippet">${escapeHtml(it.desc)}</p>` : ''}
            <div class="item-card-foot">
              <button class="btn ${affordable?'btn-primary':'btn-ghost'} btn-sm" onclick="redeemItem('${it.id}')" ${affordable?'':'title="คะแนนยังไม่พอ"'}>
                ${affordable ? 'แลกเลย' : 'ยังขาด ' + fmtPoints(it.price - wallet.balance) + ' แต้ม'}
              </button>
              <span class="row-actions">
                <button class="btn btn-ghost btn-sm" onclick="openEditItemForm('${it.id}')">แก้ไข</button>
                <button class="btn btn-danger btn-sm" onclick="confirmDeleteItem('${it.id}', this)">ลบ</button>
              </span>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    ${recent.length ? `
      <p class="mini-label">แลกไปแล้วล่าสุด</p>
      <div class="cards">
        ${recent.map(r=>`
          <div class="ledger-row">
            <div>
              <p class="ledger-reason">${escapeHtml(r.name)}</p>
              <p class="ledger-time">${fmtShortDate(r.redeemedAt)}</p>
            </div>
            <span class="points-badge minus">-${fmtPoints(r.price)}</span>
          </div>`).join('')}
      </div>` : ''}`;
}

/* ---------------- Init ----------------
   loadAll() is kicked off by the PIN gate's unlock(), not here, so the
   Google sign-in popup never opens behind the lock screen. */
setDateLine();
</script>
