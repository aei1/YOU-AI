<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เว็บเรียนของฉัน</title>
<link rel="icon" type="image/jpeg" href="logo.jpg?v=2">
<link rel="apple-touch-icon" href="logo.jpg?v=2">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Sarabun:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#24352B;
    --cover-dark:#17231C;
    --cover-ring:#3E5A47;
    --paper:#F6F1E4;
    --paper-shade:#ECE4CF;
    --paper-line:#D9D2BC;
    --ink:#1F2A3D;
    --ink-soft:#5B6577;
    --red-pen:#B23A2E;
    --red-pen-dark:#8F2C22;
    --highlighter:#E3B23C;
    --highlighter-soft:#F1D28C;
    --green-check:#3F6B4F;
    --lang-en:#2E5F86;
    --lang-zh:#8F4A1C;
    --lang-gen:#6B6357;
    --ink-faint:#6B665C;
    /* Text sitting on the always-dark green header/spine — never flips with theme. */
    --cover-text:#F6F1E4;
    /* Text sitting on top of a saturated accent fill (red-pen / green-check). */
    --on-accent:#FFFFFF;
    /* Action link inside the toast (toast bg is --ink, so this must contrast with it). */
    --toast-accent:#E3B23C;
    --font-display:'Charmonman',cursive;
    --font-body:'Sarabun',sans-serif;
    --font-mono:'Chakra Petch',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#231F1A;
      --paper-shade:#2D2820;
      --paper-line:#473F33;
      --ink:#EDE7D8;
      --ink-soft:#B0A996;
      --ink-faint:#958E7F;
      --highlighter-soft:#4A3D22;
      --green-check:#6DAC7E;
      --red-pen:#D9776A;
      --red-pen-dark:#B85C50;
      --lang-en:#6FA0D6;
      --lang-zh:#D08A57;
      /* Accents get lighter in dark mode, so text on them must go dark. */
      --on-accent:#221E19;
      /* Toast bg is light in dark mode, so the action link needs a deep amber. */
      --toast-accent:#7A5310;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:radial-gradient(ellipse at top left, #2E4234 0%, var(--cover-dark) 70%);
    color:var(--ink);
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:24px 14px;
  }
  .app{
    width:100%; max-width:820px; background:var(--paper); border-radius:14px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.04) inset;
    overflow:hidden; display:flex; flex-direction:column; min-height:640px;
  }
  button, .card, .activity-item{ touch-action:manipulation; }
  .ring-strip{
    height:16px; flex:0 0 16px; background:var(--cover-dark);
    background-image:radial-gradient(circle, var(--cover-ring) 0 4px, transparent 5px);
    background-size:34px 100%; background-position:center; background-repeat:repeat-x;
  }
  .app-header{ background:linear-gradient(180deg,var(--cover),#1E2E25); padding:22px 30px 16px; }
  .brand{ font-family:var(--font-display); font-size:32px; line-height:1; margin:0 0 6px; color:var(--cover-text); }
  .sub{margin:0 0 6px; color:rgba(246,241,228,.78); font-size:13.5px;}
  .date-line{margin:0; font-family:var(--font-mono); font-size:11px; letter-spacing:.4px; color:rgba(246,241,228,.62);}

  .tabbar{ background:var(--paper-shade); border-bottom:1.5px solid var(--paper-line); padding:0 30px; position:sticky; top:0; z-index:10; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabbar-inner{position:relative; display:flex; gap:26px; width:max-content; min-width:100%;}
  .tab-btn{
    background:none; border:none; cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:14.5px;
    padding:14px 2px 12px; color:var(--ink-soft); transition:color .15s ease; white-space:nowrap; flex:none;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink);}
  .tab-indicator{
    position:absolute; bottom:0; height:3px; border-radius:3px; background:var(--highlighter);
    transition:left .25s cubic-bezier(.4,0,.2,1), width .25s cubic-bezier(.4,0,.2,1);
  }

  .content{padding:22px 30px 32px; flex:1;}
  .view{min-height:0;}
  .hidden{display:none !important;}

  .search-input{
    width:100%; font-family:var(--font-body); font-size:14.5px; padding:9px 12px;
    border:1.5px solid var(--paper-line); border-radius:8px; background:var(--paper-shade); color:var(--ink);
    margin-bottom:12px;
  }
  .search-input:focus-visible{outline:2px solid var(--highlighter); border-color:var(--highlighter);}
  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .lang-chip{
    padding:5px 13px; border-radius:20px; font-family:var(--font-mono); font-size:12px; font-weight:600;
    border:1.5px solid var(--paper-line); background:none; color:var(--ink-soft); cursor:pointer; transition:all .15s ease;
  }
  .lang-chip.all.active{border-color:var(--ink); color:var(--ink);}
  .lang-chip.en.active{border-color:var(--lang-en); color:var(--lang-en);}
  .lang-chip.zh.active{border-color:var(--lang-zh); color:var(--lang-zh);}
  .lang-badge{
    display:inline-block; font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    padding:2px 9px; border-radius:10px; border:1.5px solid currentColor; vertical-align:middle; margin-left:6px;
  }
  .lang-badge.en{color:var(--lang-en);}
  .lang-badge.zh{color:var(--lang-zh);}
  .check-mark{color:var(--green-check); font-weight:700; margin-left:6px;}

  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px;}
  .tag-chip{
    font-family:var(--font-mono); font-size:12px; font-weight:600; cursor:pointer;
    padding:4px 11px; border-radius:20px; border:1.5px solid var(--lang-en);
    background:none; color:var(--lang-en); transition:background .15s ease, color .15s ease;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tag-chip:hover{background:var(--lang-en); color:var(--on-accent);}
  .tag-chip.ghost{border-color:var(--paper-line); color:var(--ink-soft);}
  .tag-chip.ghost:hover{border-color:var(--ink-soft); background:none; color:var(--ink);}
  .tag-count{
    font-size:10.5px; padding:1px 6px; border-radius:9px;
    background:var(--paper-shade); color:var(--ink-soft);
  }
  .tag-chip:hover .tag-count{background:var(--paper); color:var(--ink-soft);}
  .tag-suggest{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px;}
  .tag-suggest-label{font-size:12px; color:var(--ink-soft);}

  .btn{font-family:var(--font-body); font-weight:600; font-size:14.5px; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{box-shadow:0 4px 10px rgba(31,42,61,.3);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--paper-line);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn-danger{background:transparent; color:var(--red-pen); border:1.5px solid var(--red-pen);}
  .btn-danger:hover{background:var(--red-pen); color:var(--on-accent);}
  .btn-highlight{background:var(--highlighter); color:#3A2A0A;}
  .btn-highlight:hover{box-shadow:0 4px 10px rgba(227,178,58,.4);}
  .btn-complete{background:transparent; color:var(--green-check); border:1.5px solid var(--green-check);}
  .btn-complete.is-done{background:var(--green-check); color:var(--on-accent);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:6px 10px; font-size:13px; border-radius:6px;}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .empty{text-align:center; padding:50px 16px; color:var(--ink-soft);}
  .empty p{margin:0 0 16px; font-size:15px;}
  .empty .doodle{font-size:34px; margin-bottom:10px; opacity:.7;}

  .section-title{font-size:19px; font-weight:700; margin:0 0 4px; color:var(--ink);}
  .section-sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 18px;}
  .mini-label{font-size:13px; font-weight:600; color:var(--ink-soft); margin:20px 0 10px;}

  /* Points wallet */
  .balance-card{
    background:linear-gradient(135deg,var(--cover),#1E2E25); border-radius:12px;
    padding:18px 20px; margin-bottom:18px; text-align:center;
    box-shadow:0 8px 20px -12px rgba(0,0,0,.55);
  }
  .balance-label{font-size:12.5px; color:rgba(246,241,228,.75); margin:0 0 4px;}
  .balance-value{font-family:var(--font-mono); font-size:34px; font-weight:600; line-height:1.1; color:var(--highlighter); margin:0;}
  .balance-unit{font-size:14px; color:rgba(246,241,228,.75); margin-left:4px;}
  .balance-sub{font-size:12px; color:rgba(246,241,228,.6); margin:6px 0 0;}
  .points-badge{
    font-family:var(--font-mono); font-size:12.5px; font-weight:600; border-radius:20px;
    padding:2px 9px; white-space:nowrap;
  }
  .points-badge.plus{ background:rgba(63,107,79,.16); color:var(--green-check); }
  .points-badge.minus{ background:rgba(178,58,46,.14); color:var(--red-pen); }
  .price-tag{font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--highlighter);}
  .item-card-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .kind-chip{
    display:inline-block; font-size:11.5px; border-radius:20px; padding:2px 9px; margin-left:6px;
    background:var(--paper-shade); border:1px solid var(--paper-line); color:var(--ink-soft);
  }
  /* Sticky-note notification board */
  .sticky-board{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; margin-bottom:6px; }
  .sticky{
    position:relative; padding:14px 12px 12px; border-radius:3px; min-height:104px;
    display:flex; flex-direction:column; gap:5px;
    box-shadow:0 6px 14px -8px rgba(0,0,0,.5);
    transform:rotate(var(--tilt,-1deg)); transform-origin:center top;
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .sticky::before{
    content:''; position:absolute; top:-7px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:52px; height:15px; border-radius:2px;
    background:rgba(246,241,228,.55); box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .sticky:hover{ transform:rotate(0deg) translateY(-2px); box-shadow:0 10px 20px -8px rgba(0,0,0,.55); }
  .sticky.n-points{ background:#F1D9A0; }
  .sticky.n-market{ background:#EFC0B4; }
  .sticky.n-nudge{ background:#C9DCC4; }
  .sticky.n-note{ background:#CBD8E8; }
  .sticky.is-read{ opacity:.55; }
  .sticky-title{ font-weight:700; font-size:14px; color:#2A2620; margin:0; line-height:1.35; }
  .sticky-body{ font-size:12.5px; color:#4A443A; margin:0; line-height:1.45; flex:1; }
  .sticky-time{ font-family:var(--font-mono); font-size:10.5px; color:#6B6357; margin:0; }
  .sticky-close{
    position:absolute; top:5px; right:6px; width:20px; height:20px; line-height:1;
    border:none; border-radius:50%; cursor:pointer; font-size:13px;
    background:rgba(0,0,0,.06); color:#4A443A;
  }
  .sticky-close:active{ background:rgba(0,0,0,.14); }
  .board-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 12px; }
  .board-head .mini-label{ margin:0; }
  .unread-dot{
    display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:9px;
    background:var(--red-pen); color:var(--on-accent);
    font-family:var(--font-mono); font-size:11px; line-height:18px; text-align:center; margin-left:6px;
  }
  .notif-strip{
    display:flex; align-items:center; gap:10px; justify-content:space-between;
    background:var(--highlighter-soft); border:1px solid var(--paper-line);
    border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:13.5px; color:var(--ink);
  }

  .ledger-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--paper-line);
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-reason{font-size:14px; color:var(--ink); margin:0;}
  .ledger-time{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin:2px 0 0;}

  .list-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .list-head h2{font-size:19px; margin:0; color:var(--ink);}
  .cards{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--paper-shade); border-radius:8px; padding:12px 14px; cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.05); border-left:4px solid var(--cover-ring);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:nth-child(odd){transform:rotate(-.4deg);}
  .card:nth-child(even){transform:rotate(.4deg);}
  .card:hover{transform:rotate(0deg) translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.12);}
  .card-title{font-weight:600; font-size:15.5px; margin:0 0 4px; color:var(--ink);}
  .card-snippet{font-size:13.5px; color:var(--ink-soft); margin:0 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-meta{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); opacity:.75;}
  .quiz-card{border-left-color:var(--red-pen);}
  .card-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .stamp-badge{
    display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:11.5px;
    color:var(--red-pen); border:2px solid var(--red-pen); border-radius:50%; width:38px; height:38px; transform:rotate(-8deg); flex:0 0 auto;
  }

  .form-block{background:var(--paper-shade); border-radius:10px; padding:18px; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field textarea, .field select{
    width:100%; font-family:var(--font-body); font-size:14.5px; padding:9px 11px;
    border:1.5px solid var(--paper-line); border-radius:7px; background:var(--paper); color:var(--ink); resize:vertical;
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--highlighter); border-color:var(--highlighter);}
  .field textarea{min-height:140px; line-height:1.7;}
  .toggle-group{display:flex; gap:8px; flex-wrap:wrap;}
  .toggle-btn{
    padding:7px 15px; border-radius:20px; border:1.5px solid var(--paper-line); background:var(--paper);
    font-family:var(--font-body); font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .toggle-btn.active{border-color:var(--ink); color:var(--paper); background:var(--ink);}

  .back-link{background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:13.5px; margin-bottom:14px; padding:0;}
  .back-link:hover{color:var(--ink);}
  .detail-title{font-size:22px; font-weight:700; margin:0 0 6px; color:var(--ink);}
  .detail-meta{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  .detail-content{ line-height:1.85; font-size:15px; padding:2px 2px 10px; }
  .detail-content p{margin:0 0 12px;}
  .detail-content h3{font-size:19px; font-weight:700; margin:18px 0 8px; color:var(--ink);}
  .detail-content h4{font-size:16.5px; font-weight:700; margin:16px 0 6px; color:var(--ink);}
  .detail-content h5{font-size:14.5px; font-weight:700; margin:14px 0 6px; color:var(--ink);}
  .detail-content h3:first-child, .detail-content h4:first-child, .detail-content h5:first-child{margin-top:0;}
  .detail-content ul.md-list, .detail-content ol.md-list{margin:0 0 12px; padding-left:22px;}
  .detail-content li{margin-bottom:4px;}
  .detail-content strong{color:var(--ink);}

  .vocab-block{background:var(--paper); border:1.5px dashed var(--paper-line); border-radius:8px; padding:12px 14px; margin-bottom:12px;}
  .q-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .q-block-head span{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); font-weight:600;}
  .vocab-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .vocab-block input[type=text]{
    width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px;
    border:1.5px solid var(--paper-line); border-radius:6px; background:var(--paper); color:var(--ink); margin-top:8px;
  }
  .vocab-grid input[type=text]{margin-top:0;}
  .opt-remove{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; padding:2px 4px;}
  .opt-remove:hover{color:var(--red-pen);}

  .vocab-card{background:var(--paper-shade); border-radius:8px; padding:12px 14px; margin-bottom:10px; border-left:4px solid var(--cover-ring);}
  .vocab-word{font-size:19px; font-weight:700; color:var(--ink);}
  .vocab-reading{font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); margin-left:8px;}
  .vocab-meaning{font-size:14.5px; margin:4px 0;}
  .vocab-example{font-size:13px; color:var(--ink-soft); font-style:italic; border-left:2px solid var(--paper-line); padding-left:8px; margin-top:4px;}

  .flash-progress{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:12px;}
  .flashcard{
    background:var(--paper-shade); border:1.5px dashed var(--paper-line); border-radius:12px;
    padding:44px 20px; text-align:center; cursor:pointer; min-height:170px;
    display:flex; align-items:center; justify-content:center; margin-bottom:8px;
  }
  .flashcard-word{font-size:28px; font-weight:700; color:var(--ink);}
  .flashcard-back{display:none;}
  .flashcard.is-flipped .flashcard-word{display:none;}
  .flashcard.is-flipped .flashcard-back{display:block;}
  .flashcard-hint{font-size:12px; color:var(--ink-faint); text-align:center; margin:0 0 18px;}

  .q-block{background:var(--paper); border:1.5px dashed var(--paper-line); border-radius:8px; padding:12px 14px; margin-bottom:12px;}
  .opt-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .opt-row input[type=text]{flex:1;}
  .opt-row input[type=radio]{accent-color:var(--red-pen); width:16px; height:16px; flex:0 0 auto;}

  .take-q{margin-bottom:20px;}
  .take-q .qtext{font-weight:600; font-size:15.5px; margin-bottom:10px;}
  .take-opt{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:7px; margin-bottom:6px; background:var(--paper-shade); cursor:pointer;}
  .take-opt:hover{background:var(--highlighter-soft);}
  .take-opt input{accent-color:var(--ink); width:16px; height:16px;}
  .hint-msg{font-size:12.5px; color:var(--red-pen); margin-top:6px; min-height:16px;}

  .result-wrap{display:flex; flex-direction:column; align-items:center; padding:20px 8px 8px; text-align:center;}
  .stamp{position:relative; width:150px; height:150px; margin-bottom:6px;}
  .stamp svg{width:100%; height:100%; transform:rotate(-6deg);}
  .stamp path{
    fill:none; stroke:var(--red-pen); stroke-width:6; stroke-linecap:round;
    stroke-dasharray:640; stroke-dashoffset:640; animation:draw-stamp .7s ease-out forwards .1s;
  }
  @keyframes draw-stamp{to{stroke-dashoffset:0;}}
  .stamp-text{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--font-mono); color:var(--red-pen); transform:rotate(-6deg); opacity:0;
    animation:fade-in .4s ease-out forwards .6s;
  }
  @keyframes fade-in{to{opacity:1;}}
  .stamp-text .score{font-size:26px; font-weight:700; line-height:1;}
  .stamp-text .pct{font-size:12px; margin-top:2px;}
  .result-note{font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;}
  .review-list{width:100%; text-align:left; margin-top:8px;}
  .review-item{padding:10px 12px; border-radius:7px; margin-bottom:8px; background:var(--paper-shade);}
  .review-item .rq{font-weight:600; font-size:14px; margin-bottom:4px; display:flex; gap:8px; align-items:flex-start;}
  .mark{flex:0 0 auto; font-weight:700;}

<script>
/* ---------------- PIN gate ----------------
   A phone-style keypad instead of a typed password. The check is still a
   plain client-side comparison, exactly as the old password field was:
   this keeps casual eyes out, it is not real security.
------------------------------------------- */
(function(){
  // Change this to your own PIN.
  var PIN = "2004";
  var SESSION_KEY = "lang-notes-unlocked";

  function unlock(){
    sessionStorage.setItem(SESSION_KEY, "yes");
    document.body.classList.remove("locked");
    document.getElementById("gate").classList.add("hidden");
    loadAll();   // only reach for Drive once the PIN screen is out of the way
  }

  if(sessionStorage.getItem(SESSION_KEY) === "yes"){ unlock(); return; }

  var entry = "";
  var locked = false;               // brief lock-out while the wrong-PIN shake plays
  var dotsEl = document.getElementById("pin-dots");
  var padEl = document.getElementById("pin-pad");
  var errEl = document.getElementById("gate-error");
  var cardEl = document.querySelector("#gate .gate-card");

  function renderDots(){
    var html = "";
    for(var i = 0; i < PIN.length; i++){
      html += '<span class="pin-dot' + (i < entry.length ? ' filled' : '') + '"></span>';
    }
    dotsEl.innerHTML = html;
  }

  function reject(){
    locked = true;
    errEl.textContent = "รหัสไม่ถูกต้อง";
    cardEl.classList.add("shake");
    setTimeout(function(){
      cardEl.classList.remove("shake");
      entry = "";
      locked = false;
      renderDots();
    }, 420);
  }

  function press(digit){
    if(locked || entry.length >= PIN.length) return;
    entry += digit;
    errEl.textContent = "";
    renderDots();
    if(entry.length === PIN.length){
      if(entry === PIN) unlock();
      else reject();
    }
  }

  function backspace(){
    if(locked || !entry.length) return;
    entry = entry.slice(0, -1);
    errEl.textContent = "";
    renderDots();
  }

  var keys = ["1","2","3","4","5","6","7","8","9","blank","0","back"];
  padEl.innerHTML = keys.map(function(k){
    if(k === "blank") return '<div class="pin-key blank"></div>';
    if(k === "back")  return '<button type="button" class="pin-key ghost" data-key="back" aria-label="ลบ">⌫</button>';
    return '<button type="button" class="pin-key" data-key="' + k + '">' + k + '</button>';
  }).join("");

  padEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-key]");
    if(!btn) return;
    if(btn.dataset.key === "back") backspace();
    else press(btn.dataset.key);
  });

  // Physical keyboard still works on desktop.
  document.addEventListener("keydown", function(e){
    if(document.body.classList.contains("locked") === false) return;
    if(e.key >= "0" && e.key <= "9") press(e.key);
    else if(e.key === "Backspace"){ e.preventDefault(); backspace(); }
  });

  renderDots();
})();

/* ---------------- Language meta ---------------- */
const LANGS = { en:{label:'อังกฤษ', cls:'en'}, zh:{label:'จีน', cls:'zh'} };
function langBadge(lang){ const l = LANGS[lang] || LANGS.en; return `<span class="lang-badge ${l.cls}">${l.label}</span>`; }
function langChipsRow(current, fn){
  const items = [{key:'all',label:'ทั้งหมด'},{key:'en',label:'อังกฤษ'},{key:'zh',label:'จีน'}];
  return `<div class="filters">${items.map(it=>`<button class="lang-chip ${it.key} ${current===it.key?'active':''}" onclick="${fn}('${it.key}')">${it.label}</button>`).join('')}</div>`;
}

/* ---------------- State ---------------- */
let notes = [];
let quizzes = [];
let notesState = { mode:'list' };
let notesFilter = 'all';
let notesSearch = '';
let quizzesState = { mode:'list' };
let quizzesFilter = 'all';
let quizzesSearch = '';
let journal = [];
let journalState = { mode:'list' };
let journalSearch = '';
let wallet = null;                     // points wallet — see WALLET section
let notifications = [];                // sticky-note board on the home tab
let notebookState = { mode:'list' };
let marketState = { mode:'list' };
let draftActivity = null, editingActivityId = null;
let draftItem = null, editingItemId = null;
let notebookFormSnapshot = null, marketFormSnapshot = null;
let draftNote = null, editingNoteId = null;
let draftQuiz = null, editingQuizId = null;
let draftJournal = null, editingJournalId = null;
let noteFormSnapshot = null, quizFormSnapshot = null, journalFormSnapshot = null;
let flashState = null;
let activeTabName = 'home';
let historyReady = false, isRestoringHistory = false, lastPushedHistoryKey = null;
let currentAttempt = null;
let lastResult = null;

/* ---------------- Utils ---------------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mdInline(s){ return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>'); }
function stripMd(s){
  return String(s||'')
    .replace(/^#{1,3}\s+/gm,'')
    .replace(/^[-*]\s+/gm,'')
    .replace(/^\d+\.\s+/gm,'')
    .replace(/[*_`]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
/* ---------------- Tags ----------------
   Tags are the cross-cutting link between data: a tag says which topic /
   branch an item belongs to, and the same tag can sit on both notes and
   quizzes, so one topic can be pulled up across both types.
   Matching is case-insensitive; the display spelling of whichever tag was
   saved first wins, so "HSK3" and "hsk3" never split into two tags.
--------------------------------------- */
function normTag(t){ return String(t||'').trim().replace(/^#+/,'').trim().toLowerCase(); }
function itemTags(x){ return Array.isArray(x && x.tags) ? x.tags : []; }
function tagRegistry(){
  // key -> display spelling already in use somewhere
  const reg = new Map();
  [...notes, ...quizzes].forEach(x=>{
    itemTags(x).forEach(t=>{
      const k = normTag(t);
      if(k && !reg.has(k)) reg.set(k, String(t).replace(/^#+/,'').trim());
    });
  });
  return reg;
}
function parseTags(str){
  const reg = tagRegistry();
  const out = [], seen = new Set();
  String(str||'').split(/[,\n]+|\s+/).forEach(raw=>{
    const k = normTag(raw);
    if(!k || seen.has(k)) return;
    seen.add(k);
    out.push(reg.get(k) || String(raw).replace(/^#+/,'').trim());
  });
  return out;
}
function allTags(){
  const map = new Map();
  function add(x, kind){
    itemTags(x).forEach(t=>{
      const k = normTag(t); if(!k) return;
      if(!map.has(k)) map.set(k, { key:k, tag:String(t).replace(/^#+/,'').trim(), notes:0, quizzes:0 });
      map.get(k)[kind]++;
    });
  }
  notes.forEach(n=>add(n,'notes'));
  quizzes.forEach(q=>add(q,'quizzes'));
  return [...map.values()].sort((a,b)=> (b.notes+b.quizzes)-(a.notes+a.quizzes) || a.tag.localeCompare(b.tag));
}
function hasTag(x, key){ return itemTags(x).some(t=> normTag(t)===key); }
/* Split a search string into #tag requirements and leftover free text. */
function splitQuery(q){
  const tags = [], words = [];
  String(q||'').split(/\s+/).forEach(tok=>{
    if(!tok) return;
    if(tok.startsWith('#')){ const k = normTag(tok); if(k) tags.push(k); }
    else words.push(tok);
  });
  return { tags, text: words.join(' ').trim().toLowerCase() };
}
function tagChipsHtml(tags, onClickFn){
  if(!tags || !tags.length) return '';
  return `<div class="tag-row">${tags.map(t=>{
    const k = normTag(t);
    return `<button type="button" class="tag-chip" onclick="${onClickFn}('${escapeHtml(k).replace(/'/g,"\\'")}')">#${escapeHtml(String(t).replace(/^#+/,''))}</button>`;
  }).join('')}</div>`;
}
/* Everything (notes + quizzes) sharing any tag with this item, minus itself. */
function relatedByTag(item, kind){
  const keys = itemTags(item).map(normTag).filter(Boolean);
  if(!keys.length) return [];
  const out = [];
  notes.forEach(n=>{
    if(kind==='note' && n.id===item.id) return;
    if(keys.some(k=>hasTag(n,k))) out.push({ type:'note', id:n.id, title:n.title, lang:n.lang||'en' });
  });
  quizzes.forEach(q=>{
    if(kind==='quiz' && q.id===item.id) return;
    if(keys.some(k=>hasTag(q,k))) out.push({ type:'quiz', id:q.id, title:q.title, lang:q.lang||'en', bestScore:q.bestScore, bestTotal:q.bestTotal });
  });
  return out;
}
function relatedHtml(item, kind){
  const rel = relatedByTag(item, kind);
  if(!rel.length) return '';
  return `
    <p class="mini-label">อื่น ๆ ในหมวดเดียวกัน (${rel.length})</p>
    <div class="cards">
      ${rel.map(r=> r.type==='note'
        ? `<div class="activity-item" onclick="notesState={mode:'detail',id:'${r.id}'}; renderNotes(); switchTab('notes');">
             <div class="activity-left"><p class="activity-title">${escapeHtml(r.title||'ไม่มีหัวข้อ')}${langBadge(r.lang)}</p></div>
             <span class="activity-type">บทเรียน</span>
           </div>`
        : `<div class="activity-item" onclick="quizzesState={mode:'detail',id:'${r.id}'}; renderQuizzes(); switchTab('quizzes');">
             <div class="activity-left"><p class="activity-title">${escapeHtml(r.title||'ไม่มีหัวข้อ')}${langBadge(r.lang)}</p>
             ${r.bestScore!=null?`<p class="activity-meta">คะแนนดีที่สุด ${r.bestScore}/${r.bestTotal}</p>`:''}</div>
             <span class="activity-type">แบบทดสอบ</span>
           </div>`).join('')}
    </div>`;
}
/* Tag input field shared by both forms. */
function tagFieldHtml(draftKey){
  const current = (draftKey==='note' ? draftNote.tags : draftQuiz.tags) || [];
  const used = current.map(normTag);
  const available = allTags().filter(t=> !used.includes(t.key)).slice(0, 12);
  return `
    <div class="field">
      <label>แท็ก / หมวดหมู่ (คั่นด้วยเว้นวรรคหรือจุลภาค)</label>
      <input type="text" id="tag-input-${draftKey}" placeholder="เช่น บทที่3 HSK3 ธุรกิจ"
             value="${escapeHtml(current.join(' '))}"
             oninput="setDraftTags('${draftKey}', this.value)">
      ${available.length ? `
        <div class="tag-suggest">
          <span class="tag-suggest-label">เคยใช้:</span>
          ${available.map(t=>`<button type="button" class="tag-chip ghost" onclick="addDraftTag('${draftKey}','${escapeHtml(t.tag).replace(/'/g,"\\'")}')">#${escapeHtml(t.tag)}</button>`).join('')}
        </div>` : ''}
    </div>`;
}
function setDraftTags(which, value){
  const parsed = parseTags(value);
  if(which==='note') draftNote.tags = parsed; else draftQuiz.tags = parsed;
}
function addDraftTag(which, tag){
  const draft = which==='note' ? draftNote : draftQuiz;

function mdToHtml(md){
  const lines = escapeHtml(md).split('\n');
  let html = '', inList = null, para = [];
  function flushPara(){ if(para.length){ html += `<p>${para.join('<br>')}</p>`; para = []; } }
  function closeList(){ if(inList){ html += `</${inList}>`; inList = null; } }
  lines.forEach(raw=>{
    const line = raw.trim();
    if(line===''){ flushPara(); closeList(); return; }
    let m;
    if((m = line.match(/^(#{1,3})\s+(.*)$/))){
      flushPara(); closeList();
      const tag = 'h' + (m[1].length + 2);
      html += `<${tag}>${mdInline(m[2])}</${tag}>`;
      return;
    }
    if((m = line.match(/^[-*]\s+(.*)$/))){
      flushPara();
      if(inList!=='ul'){ closeList(); html += '<ul class="md-list">'; inList = 'ul'; }
      html += `<li>${mdInline(m[1])}</li>`;
      return;
    }
    if((m = line.match(/^\d+\.\s+(.*)$/))){
      flushPara();
      if(inList!=='ol'){ closeList(); html += '<ol class="md-list">'; inList = 'ol'; }
      html += `<li>${mdInline(m[1])}</li>`;
      return;
    }
    closeList();
    para.push(mdInline(line));
  });
  flushPara(); closeList();
  return html || '<p></p>';
}
function showToast(msg, onUndo){
  const t = document.getElementById('toast');
  if(onUndo){
    t.innerHTML = '';
    t.append(document.createTextNode(msg + ' '));
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'toast-undo'; btn.textContent = 'เลิกทำ';
    btn.addEventListener('click', ()=>{
      clearTimeout(showToast._h);
      t.classList.remove('show');
      onUndo();
    });
    t.appendChild(btn);
  } else {
    t.textContent = msg;
  }
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), onUndo ? 5000 : 2400);
}

   created itself — nothing else in the user's Drive is visible to it.
--------------------------------------------------------- */

/* ---- OAuth ---- */
function gisReady(){
  return !!(window.google && google.accounts && google.accounts.oauth2);
}
function waitForGis(timeoutMs){
  return new Promise((resolve, reject)=>{
    if(gisReady()) return resolve();
    const started = Date.now();
    const t = setInterval(()=>{
      if(gisReady()){ clearInterval(t); resolve(); }
      else if(Date.now() - started > timeoutMs){
        clearInterval(t);
        reject(new Error('โหลดไลบรารีของ Google ไม่สำเร็จ'));
      }
    }, 120);
  });
}
/* prompt:'' asks silently — it only works once access was granted before,
   so the first ever sign-in still needs the button. */
function requestToken(silent){
  return new Promise((resolve, reject)=>{
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: () => {}
      });
    }
    tokenClient.callback = (resp)=>{
      if(resp && resp.access_token){ accessToken = resp.access_token; resolve(resp.access_token); }
      else reject(new Error(resp && resp.error ? resp.error : 'ไม่ได้รับสิทธิ์เข้าถึง Drive'));
    };
    tokenClient.error_callback = (err)=> reject(new Error((err && err.type) || 'การเข้าสู่ระบบถูกยกเลิก'));
    try{ tokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' }); }
    catch(e){ reject(e); }
  });
}

/* ---- Drive REST helpers ---- */
async function driveFetch(url, opts, retrying){
  const o = Object.assign({}, opts);
  o.headers = Object.assign({}, o.headers, { Authorization: 'Bearer ' + accessToken });
  const res = await fetch(url, o);
  if(res.status === 401 && !retrying){
    // Access tokens expire after about an hour; get a fresh one and retry once.
    await requestToken(true);
    return driveFetch(url, opts, true);
  }
  if(!res.ok){
    const body = await res.text().catch(()=> '');
    throw new Error('Drive ' + res.status + ' ' + body.slice(0, 140));
  }
  return res;
}
async function findDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)&pageSize=1`);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}
async function createDriveFile(doc){
  const boundary = 'youai' + Math.random().toString(36).slice(2);
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify({ name: DRIVE_FILENAME, mimeType: 'application/json' }) +
    `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(doc) +
    `\r\n--${boundary}--`;
  const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
    body
  });
  return (await res.json()).id;
}
async function readDriveFile(id){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  return await res.json();
}
async function writeDriveFile(id, doc){
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
    body: JSON.stringify(doc)
  });
}

/* ---- The document that lives on Drive ---- */
function currentDoc(){
  return {
    version: 1,
    notes, quizzes, journal, notifications,
    pointsWallet: wallet,
    lastModifiedAt: new Date().toISOString()
  };
}
function applyDoc(doc){
  doc = doc && typeof doc === 'object' ? doc : {};
  notes = Array.isArray(doc.notes) ? doc.notes : [];
  quizzes = Array.isArray(doc.quizzes) ? doc.quizzes : [];
  journal = Array.isArray(doc.journal) ? doc.journal : [];
  notifications = Array.isArray(doc.notifications) ? doc.notifications : [];
  wallet = normalizeWallet(doc.pointsWallet);
}

/* One-time rescue of anything a device saved before this version, so
   upgrading doesn't throw the user's existing data away. Read once,
   handed to Drive, then the local copy is cleared for good. */
function takeLegacyLocalData(){
  const keys = ['notes','quizzes','journal','pointsWallet','notifications'];
  let found = null;
  try{
    const raw = {};
    keys.forEach(k=>{ const v = localStorage.getItem(k); if(v) raw[k] = JSON.parse(v); });
    const hasSomething =
      (raw.notes && raw.notes.length) || (raw.quizzes && raw.quizzes.length) ||
      (raw.journal && raw.journal.length) || (raw.notifications && raw.notifications.length) ||
      (raw.pointsWallet && (raw.pointsWallet.balance || (raw.pointsWallet.activities||[]).length || (raw.pointsWallet.marketItems||[]).length));
    if(hasSomething) found = raw;
  }catch(e){ found = null; }
  try{ keys.forEach(k=> localStorage.removeItem(k)); }catch(e){ /* nothing to clean up */ }
  return found;
}

/* ---- Saving ---- */
function scheduleSave(){
  savePending = true;
  setSyncState('saving', 'กำลังบันทึก');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE_MS);
}
async function flushSave(){
  clearTimeout(saveTimer);
  if(!savePending || !driveFileId) return;
  if(saveInFlight) return saveInFlight;          // one write at a time
  savePending = false;
  setSyncState('saving', 'กำลังบันทึก');
  saveInFlight = (async ()=>{
    try{
      await writeDriveFile(driveFileId, currentDoc());
      setSyncState('ok', 'ซิงก์แล้ว');
    }catch(e){
      savePending = true;                        // keep it queued for a retry
      setSyncState('error', 'บันทึกไม่สำเร็จ');
      showToast('บันทึกขึ้น Drive ไม่สำเร็จ แตะที่สถานะเพื่อลองใหม่');
    }finally{
      saveInFlight = null;
    }
  })();
  return saveInFlight;
}
// Don't lose the last edit when the tab is closed or backgrounded.
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);

/* ---- Boot ---- */
async function connectDrive(){
  try{
    showDriveBusy('กำลังเชื่อมต่อ Google Drive...');
    await waitForGis(12000);
    if(!accessToken) await requestToken(false);
    await loadFromDrive();
  }catch(e){
    showDriveError(e && e.message ? e.message : String(e));
  }
}
async function loadFromDrive(){
  showDriveBusy('กำลังโหลดข้อมูลจาก Drive...');
  driveFileId = await findDriveFile();

  if(driveFileId){
    applyDoc(await readDriveFile(driveFileId));
  }else{
    // First run on this account: carry over any pre-Drive local data,
    // otherwise start from the seed file shipped with the site.
    const legacy = takeLegacyLocalData();
    if(legacy){
      applyDoc({
        notes: legacy.notes, quizzes: legacy.quizzes, journal: legacy.journal,
        notifications: legacy.notifications, pointsWallet: legacy.pointsWallet
      });
    }else{
      let seed = {};
      try{
        const res = await fetch('data.json', { cache:'no-store' });
        if(res.ok) seed = await res.json();
      }catch(e){ /* the seed is optional */ }
      applyDoc(seed);
    }
    driveFileId = await createDriveFile(currentDoc());
    if(legacy) showToast('ย้ายข้อมูลเดิมในเครื่องขึ้น Google Drive แล้ว');
  }

  hideDriveGate();
  setSyncState('ok', 'ซิงก์แล้ว');
  startApp();
}

  maybeDailyNudge();
  renderAll();
  requestAnimationFrame(updateTabIndicator);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(updateTabIndicator); }
  historyReady = true;
  lastPushedHistoryKey = historyKey();
  history.replaceState(historySnapshot(), '');
}

/* =========================================================
   POINTS WALLET
   One shared balance behind the notebook (earn) and the market
   (spend). Every change goes through addPoints/spendPoints so the
   ledger stays the complete history of how the balance got here.
   ========================================================= */
function emptyWallet(){
  return { balance:0, ledger:[], activities:[], marketItems:[], redemptions:[], lastModifiedAt:new Date().toISOString() };
}
function normalizeWallet(w){
  const base = emptyWallet();
  if(!w || typeof w !== 'object') return base;
  return {
    balance: Number.isFinite(w.balance) ? w.balance : 0,
    ledger: Array.isArray(w.ledger) ? w.ledger : [],
    activities: Array.isArray(w.activities) ? w.activities : [],
    marketItems: Array.isArray(w.marketItems) ? w.marketItems : [],
    redemptions: Array.isArray(w.redemptions) ? w.redemptions : [],
    lastModifiedAt: w.lastModifiedAt || base.lastModifiedAt
  };
}
function saveWallet(){
  wallet.lastModifiedAt = new Date().toISOString();
  scheduleSave();
}
function addPoints(amount, reason, source){
  const amt = Math.max(0, Math.round(Number(amount) || 0));
  if(!amt) return 0;
  wallet.balance += amt;
  wallet.ledger.push({ id:uid(), timestamp:new Date().toISOString(), amount:amt, reason:reason||'', source:source||'notebook' });
  saveWallet();
  return amt;
}
/* Returns false (and changes nothing) when the balance is too low. */
function spendPoints(amount, reason, source){
  const amt = Math.max(0, Math.round(Number(amount) || 0));
  if(!amt) return false;
  if(wallet.balance < amt) return false;
  wallet.balance -= amt;
  wallet.ledger.push({ id:uid(), timestamp:new Date().toISOString(), amount:-amt, reason:reason||'', source:source||'market' });
  saveWallet();
  return true;
}
function fmtPoints(n){ return (Number(n)||0).toLocaleString('th-TH'); }

/* =========================================================
   NOTIFICATIONS
   Every notable event pins a sticky note to the home board. The
   newest 30 are kept so the board never grows without bound.
   ========================================================= */
const NOTIF_LIMIT = 30;
function saveNotifications(){ scheduleSave(); }
function pushNotification(kind, title, body){
  notifications.unshift({ id:uid(), kind, title, body:body||'', createdAt:new Date().toISOString(), read:false });
  if(notifications.length > NOTIF_LIMIT) notifications.length = NOTIF_LIMIT;
  saveNotifications();
  // Refresh the two views that show notifications, so a note pinned from
  // the notebook or market is already there when you switch tabs.
  if(historyReady){ renderHome(); renderJournal(); }
}
function unreadCount(){ return notifications.filter(n=>!n.read).length; }
function markNotificationRead(id){
  const n = notifications.find(x=>x.id===id);
  if(n && !n.read){ n.read = true; saveNotifications(); renderHome(); renderJournal(); }
}
function dismissNotification(id, ev){
  if(ev) ev.stopPropagation();
  const i = notifications.findIndex(x=>x.id===id);
  if(i===-1) return;
  notifications.splice(i,1);
  saveNotifications();
  renderHome(); renderJournal();
}
function markAllNotificationsRead(){
  notifications.forEach(n=> n.read = true);
  saveNotifications(); renderHome(); renderJournal();
}
function clearAllNotifications(){
  notifications = [];
  saveNotifications(); renderHome(); renderJournal();
}
/* A once-a-day nudge about anything still outstanding, so the board
   reminds without spamming a new note on every page load. */
function maybeDailyNudge(){
  const today = new Date().toISOString().slice(0,10);
  if(notifications.some(n=> n.kind==='nudge' && String(n.createdAt).slice(0,10)===today)) return;
  const pending = computeSuggestions();
  if(!pending.length) return;
  pushNotification('nudge', 'ยังมี ' + pending.length + ' อย่างค้างอยู่',
    pending.slice(0,2).map(p=>p.title).join(' · '));
}

/* =========================================================
   HOME DASHBOARD
   ========================================================= */
function computeStats(){
  const totalNotes = notes.length;
  const completedNotes = notes.filter(n=>n.completed).length;
  const overallPct = totalNotes ? Math.round(completedNotes/totalNotes*100) : 0;
  const perLang = ['en','zh'].map(key=>{
    const langNotes = notes.filter(n=>(n.lang||'en')===key);
    const langCompleted = langNotes.filter(n=>n.completed).length;
    const langQuizzes = quizzes.filter(q=>(q.lang||'en')===key);
    const attempted = langQuizzes.filter(q=>q.bestScore!=null);
    const avgScore = attempted.length ? Math.round(attempted.reduce((s,q)=> s + (q.bestScore/q.bestTotal*100),0)/attempted.length) : null;
    return { key, label:LANGS[key].label, total:langNotes.length, completed:langCompleted,
      pct: langNotes.length ? Math.round(langCompleted/langNotes.length*100) : 0, avgScore, quizCount:langQuizzes.length };
  });
  return { totalNotes, completedNotes, overallPct, perLang };
}

function computeStreak(){
  const dates = new Set();
  notes.forEach(n=>{ if(n.updatedAt) dates.add(new Date(n.updatedAt).toDateString()); });
  quizzes.forEach(q=>{ if(q.lastAttemptDate) dates.add(new Date(q.lastAttemptDate).toDateString()); });
  let streak = 0;
  const cursor = new Date();
  while(dates.has(cursor.toDateString())){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeSuggestions(){
  const items = [];
  [...notes].filter(n=>!n.completed).sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,3).forEach(n=>{
    items.push({ kind:'note', id:n.id, title:n.title, lang:n.lang||'en', label:'ยังไม่ได้เรียน' });
  });
  // "no quiz yet" now means: no quiz shares a tag with this note (tags are the link).
  notes.filter(n=>{
    if(!n.completed) return false;
    const keys = itemTags(n).map(normTag).filter(Boolean);
    if(!keys.length) return true;
    return !quizzes.some(q=> keys.some(k=> hasTag(q, k)));
  }).slice(0,2).forEach(n=>{
    items.push({ kind:'note', id:n.id, title:n.title, lang:n.lang||'en', label:'ยังไม่มีแบบทดสอบ' });
  });
  quizzes.filter(q=>q.bestScore===null).slice(0,2).forEach(q=>{
    items.push({ kind:'quiz', id:q.id, title:q.title, lang:q.lang||'en', label:'ยังไม่ได้ทำ' });
  });
  return items.slice(0,5);
}
function suggestionClickAttr(item){
  return item.kind==='quiz'
    ? `quizzesState={mode:'detail', id:'${item.id}'}; renderQuizzes(); switchTab('quizzes');`
    : `notesState={mode:'detail', id:'${item.id}'}; renderNotes(); switchTab('notes');`;
}

function setFilterNotes(key){ notesFilter = key; renderNotes(); }
function setSearchNotes(value){
  notesSearch = value;

  const input = document.getElementById('notes-search-input');
  if(input){ input.focus(); const p = input.value.length; input.setSelectionRange(p,p); }
}
function noteMatchesSearch(n, q){
  const { tags, text } = splitQuery(q);
  if(tags.length && !tags.every(k=> hasTag(n, k))) return false;
  if(!text) return true;
  if((n.title||'').toLowerCase().includes(text)) return true;
  if(itemTags(n).some(t=> normTag(t).includes(text))) return true;
  if(n.format==='vocab'){
    return (n.entries||[]).some(e=> (e.word||'').toLowerCase().includes(text) || (e.meaning||'').toLowerCase().includes(text));
  }
  return (n.content||'').toLowerCase().includes(text);
}
function quizMatchesSearch(qz, q){
  const { tags, text } = splitQuery(q);
  if(tags.length && !tags.every(k=> hasTag(qz, k))) return false;
  if(!text) return true;
  if((qz.title||'').toLowerCase().includes(text)) return true;
  return itemTags(qz).some(t=> normTag(t).includes(text));
}

function saveNoteForm(){
  const title = (draftNote.title||'').trim() || 'ไม่มีหัวข้อ';
  if(draftNote.format==='freeform'){
    if(!draftNote.content.trim()){ showToast('กรุณาใส่เนื้อหาก่อนบันทึก'); return; }
  }else{
    const validEntries = draftNote.entries.filter(e=> e.word.trim() && e.meaning.trim());
    if(validEntries.length===0){ showToast('กรุณาใส่คำศัพท์อย่างน้อย 1 คำ พร้อมความหมาย'); return; }
    draftNote.entries = validEntries.map(e=>({...e, word:e.word.trim(), reading:e.reading.trim(), meaning:e.meaning.trim(), example:e.example.trim()}));
  }
  const tags = parseTags((draftNote.tags||[]).join(' '));
  if(editingNoteId){
    const n = notes.find(x=>x.id===editingNoteId);
    Object.assign(n, { title, lang:draftNote.lang, format:draftNote.format, content:draftNote.content, tags, entries:draftNote.entries, updatedAt:new Date().toISOString() });
  }else{
    notes.push({ id:uid(), title, lang:draftNote.lang, format:draftNote.format, content:draftNote.content, tags, entries:draftNote.entries, completed:false, updatedAt:new Date().toISOString() });
  }
  saveNotes();
  noteFormSnapshot = null;
  notesState = editingNoteId ? {mode:'detail', id:editingNoteId} : {mode:'list'};
  renderNotes();
  showToast('บันทึกเรียบร้อยแล้ว');
}

function toggleNoteCompleted(id){
  const n = notes.find(x=>x.id===id);
  if(!n) return;
  n.completed = !n.completed;
  saveNotes();
  renderNotes();
}

/* ---- Flashcard review (vocab notes) ---- */
function startFlashcards(noteId){
  const note = notes.find(n=>n.id===noteId);
  if(!note || !note.entries || !note.entries.length) return;
  const order = note.entries.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  flashState = { noteId, order, pos:0, revealed:false };
  notesState = { mode:'flash', id:noteId };
  renderNotes();
}
function flipFlashcard(){ flashState.revealed = !flashState.revealed; renderNotes(); }
function nextFlashcard(){
  if(flashState.pos < flashState.order.length-1){
    flashState.pos++; flashState.revealed = false; renderNotes();
  } else {
    const noteId = flashState.noteId;
    flashState = null;
    notesState = { mode:'detail', id:noteId };
    renderNotes();
    showToast('ทบทวนครบทุกคำแล้ว');
  }
}
function prevFlashcard(){
  if(flashState.pos > 0){ flashState.pos--; flashState.revealed = false; renderNotes(); }
}
function renderFlashcards(){
  const el = document.getElementById('view-notes');
  const note = notes.find(n=>n.id===flashState.noteId);
  if(!note){ flashState=null; notesState={mode:'list'}; renderNotes(); return; }
  const entry = note.entries[flashState.order[flashState.pos]];
  el.innerHTML = `
    <button class="back-link" onclick="flashState=null; notesState={mode:'detail', id:'${note.id}'}; renderNotes();">‹ ออกจากการทบทวน</button>
    <h2 class="detail-title">${escapeHtml(note.title)}</h2>
    <p class="flash-progress">คำที่ ${flashState.pos+1} / ${flashState.order.length}</p>
    <div class="flashcard ${flashState.revealed?'is-flipped':''}" onclick="flipFlashcard()">
      <div class="flashcard-word">${escapeHtml(entry.word)}</div>
      <div class="flashcard-back">
        ${entry.reading?`<div class="vocab-reading">${escapeHtml(entry.reading)}</div>`:''}
        <p class="vocab-meaning">${escapeHtml(entry.meaning)}</p>
        ${entry.example?`<p class="vocab-example">${escapeHtml(entry.example)}</p>`:''}
      </div>
    </div>
    <p class="flashcard-hint">แตะการ์ดเพื่อดูความหมาย</p>
    <div class="row-actions">
      <button class="btn btn-ghost" onclick="prevFlashcard()" ${flashState.pos===0?'disabled':''}>‹ ก่อนหน้า</button>
      <button class="btn btn-primary" onclick="nextFlashcard()">${flashState.pos===flashState.order.length-1?'จบการทบทวน':'ถัดไป ›'}</button>
    </div>`;
}

function confirmDeleteNote(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบบทเรียนนี้'; } }, 3000);
    return;
  }
  const idx = notes.findIndex(n=>n.id===id);
  if(idx===-1) return;
  const removed = notes[idx];
  notes.splice(idx,1);
  saveNotes();
  notesState = {mode:'list'};
  renderNotes();
  showToast('ลบบทเรียนแล้ว', ()=>{
    notes.splice(idx,0,removed);
    saveNotes();
    notesState = {mode:'detail', id};
    renderNotes();
  });
}

function renderNotes(){ renderNotesImpl(); pushHistoryState(); }
function renderNotesImpl(){
  const el = document.getElementById('view-notes');

  if(notesState.mode === 'form'){ renderNoteForm(); return; }
  if(notesState.mode === 'flash'){ renderFlashcards(); return; }

  if(notesState.mode === 'detail'){
    const note = notes.find(n=>n.id===notesState.id);
    if(!note){ notesState={mode:'list'}; renderNotes(); return; }
    const bodyHtml = note.format==='vocab'
      ? note.entries.map(e=>`
          <div class="vocab-card">
            <div><span class="vocab-word">${escapeHtml(e.word)}</span>${e.reading?`<span class="vocab-reading">${escapeHtml(e.reading)}</span>`:''}</div>
            <p class="vocab-meaning">${escapeHtml(e.meaning)}</p>
            ${e.example?`<p class="vocab-example">${escapeHtml(e.example)}</p>`:''}
          </div>`).join('')
      : `<div class="detail-content">${mdToHtml(note.content)}</div>`;
    el.innerHTML = `
      <button class="back-link" onclick="notesState={mode:'list'}; renderNotes();">‹ กลับ</button>
      <h2 class="detail-title">${escapeHtml(note.title)}${langBadge(note.lang||'en')}${note.completed?'<span class="check-mark">✓</span>':''}</h2>
      <p class="detail-meta">แก้ไขล่าสุด ${fmtShortDate(note.updatedAt)}</p>
      ${tagChipsHtml(itemTags(note), 'filterNotesByTag')}
      ${bodyHtml}
      <div class="row-actions" style="margin-top:16px;">
        ${note.format==='vocab' && note.entries.length ? `<button class="btn btn-highlight" onclick="startFlashcards('${note.id}')">ทบทวนคำศัพท์ (flashcard)</button>` : ''}
        <button class="btn btn-complete ${note.completed?'is-done':''}" onclick="toggleNoteCompleted('${note.id}')">${note.completed? 'เรียนแล้ว ✓' : 'ทำเครื่องหมายว่าเรียนแล้ว'}</button>
        <button class="btn btn-ghost" onclick="openEditNoteForm('${note.id}')">แก้ไข</button>
        <button class="btn btn-danger" id="del-note-btn" onclick="confirmDeleteNote('${note.id}', this)">ลบบทเรียนนี้</button>
      </div>
      ${relatedHtml(note, 'note')}`;
    return;
  }

  if(notes.length === 0){
    el.innerHTML = `
      <div class="empty">
        <div class="doodle">📘</div>
        <p>ยังไม่มีบทเรียนในหน้านี้ เริ่มเพิ่มบทเรียนหรือคำศัพท์แรกของคุณได้เลย</p>
        <button class="btn btn-primary" onclick="openNewNoteForm()">+ เพิ่มบทเรียนใหม่</button>
      </div>`;
    return;
  }
  const byLang = notesFilter==='all' ? notes : notes.filter(n=>(n.lang||'en')===notesFilter);
  const filtered = byLang.filter(n=> noteMatchesSearch(n, notesSearch));
  const sorted = [...filtered].sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt));
  el.innerHTML = `
    <div class="list-head">
      <h2>บทเรียนทั้งหมด (${notes.length})</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewNoteForm()">+ เพิ่มบทเรียนใหม่</button>
    </div>
    <input type="text" class="search-input" id="notes-search-input" placeholder="ค้นหาบทเรียน..." value="${escapeHtml(notesSearch)}" oninput="setSearchNotes(this.value)">
    ${langChipsRow(notesFilter, 'setFilterNotes')}
    ${sorted.length===0 ? `<div class="empty"><p>ไม่พบบทเรียนที่ตรงกับที่ค้นหา</p></div>` : `
    <div class="cards">
      ${sorted.map(n=>{
        const snippet = n.format==='vocab'
          ? `${n.entries.length} คำศัพท์ · ${n.entries.slice(0,3).map(e=>e.word).join(', ')}`
          : stripMd(n.content).slice(0,80);
        return `
        <div class="card" onclick="notesState={mode:'detail', id:'${n.id}'}; renderNotes();">
          <div class="card-top">
            <p class="card-title">${escapeHtml(n.title || 'ไม่มีหัวข้อ')}${langBadge(n.lang||'en')}${n.completed?'<span class="check-mark">✓</span>':''}</p>
          </div>
          <p class="card-snippet">${escapeHtml(snippet)}</p>
          <p class="card-meta">${fmtShortDate(n.updatedAt)}${itemTags(n).length ? ' · ' + itemTags(n).map(t=>'#'+escapeHtml(String(t).replace(/^#+/,''))).join(' ') : ''}</p>
        </div>`;
      }).join('')}
    </div>`}`;
}

function setFilterQuizzes(key){ quizzesFilter = key; renderQuizzes(); }
function setSearchQuizzes(value){
  quizzesSearch = value;
  renderQuizzes();
  const input = document.getElementById('quizzes-search-input');
  if(input){ input.focus(); const p = input.value.length; input.setSelectionRange(p,p); }
}
function newDraftQuiz(){ return { title:'', lang:'en', tags:[], questions:[ {text:'', options:['',''], correct:0} ] }; }

function renderQuizzes(){ renderQuizzesImpl(); pushHistoryState(); }
function renderQuizzesImpl(){
  const el = document.getElementById('view-quizzes');
  if(quizzesState.mode === 'form'){ renderQuizForm(); return; }
  if(quizzesState.mode === 'detail'){ renderQuizDetail(); return; }
  if(quizzesState.mode === 'take'){ renderQuizTake(); return; }
  if(quizzesState.mode === 'result'){ renderQuizResult(); return; }

  if(quizzes.length === 0){
    el.innerHTML = `
      <div class="empty">
        <div class="doodle">🖊️</div>
        <p>ยังไม่มีแบบทดสอบ สร้างแบบทดสอบแรกเพื่อเริ่มทบทวนได้เลย</p>
        <button class="btn btn-primary" onclick="openNewQuizForm()">+ สร้างแบบทดสอบใหม่</button>
      </div>`;
    return;
  }
  const byLang = quizzesFilter==='all' ? quizzes : quizzes.filter(q=>(q.lang||'en')===quizzesFilter);
  const filtered = byLang.filter(q=> quizMatchesSearch(q, quizzesSearch));
  el.innerHTML = `
    <div class="list-head">
      <h2>แบบทดสอบทั้งหมด (${quizzes.length})</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewQuizForm()">+ สร้างแบบทดสอบใหม่</button>
    </div>
    <input type="text" class="search-input" id="quizzes-search-input" placeholder="ค้นหาแบบทดสอบ..." value="${escapeHtml(quizzesSearch)}" oninput="setSearchQuizzes(this.value)">
    ${langChipsRow(quizzesFilter, 'setFilterQuizzes')}
    ${filtered.length===0 ? `<div class="empty"><p>ไม่พบแบบทดสอบที่ตรงกับที่ค้นหา</p></div>` : `
    <div class="cards">
      ${filtered.map(q=>`
        <div class="card quiz-card" onclick="quizzesState={mode:'detail', id:'${q.id}'}; renderQuizzes();">
          <div class="card-top">
            <div>
              <p class="card-title">${escapeHtml(q.title)}${langBadge(q.lang||'en')}</p>
              <p class="card-meta">${q.questions.length} ข้อ${q.lastAttemptDate ? ' · ทำล่าสุด '+fmtShortDate(q.lastAttemptDate) : ''}${itemTags(q).length ? ' · ' + itemTags(q).map(t=>'#'+escapeHtml(String(t).replace(/^#+/,''))).join(' ') : ''}</p>
            </div>
            ${q.bestScore!=null ? `<div class="stamp-badge">${q.bestScore}/${q.bestTotal}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>`}`;
}

function openNewQuizForm(){
  draftQuiz = newDraftQuiz(); editingQuizId = null; quizzesState = {mode:'form'};
  quizFormSnapshot = JSON.stringify(draftQuiz);
  renderQuizzes();
}
function openEditQuizForm(id){

}
function cancelQuizForm(){ quizFormSnapshot = null; quizzesState = editingQuizId ? {mode:'detail', id:editingQuizId} : {mode:'list'}; renderQuizzes(); }
function setDraftQuizLang(k){ draftQuiz.lang = k; renderQuizForm(); }

function renderQuizForm(){
  const el = document.getElementById('view-quizzes');
  el.innerHTML = `
    <button class="back-link" onclick="cancelQuizForm()">‹ กลับ</button>
    <div class="form-block">
      <div class="field">
        <label>ชื่อแบบทดสอบ</label>
        <input type="text" id="quiz-title-input" placeholder="เช่น คำศัพท์บทที่ 3" value="${escapeHtml(draftQuiz.title)}" oninput="draftQuiz.title=this.value">
      </div>
      <div class="field">
        <label>หมวดภาษา</label>

          ${['en','zh'].map(k=>`<button type="button" class="toggle-btn ${draftQuiz.lang===k?'active':''}" onclick="setDraftQuizLang('${k}')">${LANGS[k].label}</button>`).join('')}
        </div>

function renderQuestionBlock(q, qi){
  return `
    <div class="q-block">
      <div class="q-block-head">
        <span>คำถามที่ ${qi+1}</span>
        ${draftQuiz.questions.length>1 ? `<button class="opt-remove" onclick="removeQuestion(${qi})">✕ ลบคำถาม</button>` : ''}
      </div>
      <div class="field">
        <input type="text" placeholder="พิมพ์คำถาม" value="${escapeHtml(q.text)}" oninput="draftQuiz.questions[${qi}].text=this.value">
      </div>
      ${q.options.map((opt,oi)=>`
        <div class="opt-row">
          <input type="radio" name="correct-${qi}" ${q.correct===oi?'checked':''} onchange="draftQuiz.questions[${qi}].correct=${oi}" title="ทำเครื่องหมายว่าเป็นคำตอบที่ถูก">
          <input type="text" placeholder="ตัวเลือกที่ ${oi+1}" value="${escapeHtml(opt)}" oninput="draftQuiz.questions[${qi}].options[${oi}]=this.value">
          ${q.options.length>2 ? `<button class="opt-remove" onclick="removeOption(${qi},${oi})">✕</button>` : ''}
        </div>`).join('')}
      ${q.options.length<6 ? `<button class="btn btn-ghost btn-sm" onclick="addOption(${qi})">+ เพิ่มตัวเลือก</button>` : ''}
    </div>`;
}

function addQuestion(){ draftQuiz.questions.push({text:'', options:['',''], correct:0}); renderQuizForm(); }
function removeQuestion(qi){ draftQuiz.questions.splice(qi,1); renderQuizForm(); }
function addOption(qi){ draftQuiz.questions[qi].options.push(''); renderQuizForm(); }
function removeOption(qi, oi){
  draftQuiz.questions[qi].options.splice(oi,1);
  if(draftQuiz.questions[qi].correct >= draftQuiz.questions[qi].options.length){ draftQuiz.questions[qi].correct = 0; }
  renderQuizForm();
}

function saveQuizForm(){
  const title = draftQuiz.title.trim();
  if(!title){ showToast('กรุณาตั้งชื่อแบบทดสอบ'); return; }
  for(let i=0;i<draftQuiz.questions.length;i++){
    const q = draftQuiz.questions[i];
    if(!q.text.trim()){ showToast(`กรุณาใส่คำถามที่ ${i+1}`); return; }
    if(q.options.some(o=>!o.trim())){ showToast(`กรุณากรอกตัวเลือกให้ครบในคำถามที่ ${i+1}`); return; }
  }
  const questions = draftQuiz.questions.map(q=>({ id:uid(), text:q.text.trim(), options:q.options.map(o=>o.trim()), correctIndex:q.correct }));
  const qTags = parseTags((draftQuiz.tags||[]).join(' '));
  if(editingQuizId){
    const existing = quizzes.find(x=>x.id===editingQuizId);
    existing.title = title; existing.lang = draftQuiz.lang; existing.questions = questions;
    existing.tags = qTags;
    quizzesState = {mode:'detail', id:editingQuizId};
  }else{
    const id = uid();
    quizzes.push({ id, title, lang:draftQuiz.lang, tags:qTags, questions, bestScore:null, bestTotal:null, lastAttemptDate:null });
    quizzesState = {mode:'detail', id};
  }
  saveQuizzes();
  quizFormSnapshot = null;
  renderQuizzes();
  showToast('บันทึกแบบทดสอบเรียบร้อยแล้ว');
}

function renderQuizDetail(){
  const el = document.getElementById('view-quizzes');
  const q = quizzes.find(x=>x.id===quizzesState.id);
  if(!q){ quizzesState={mode:'list'}; renderQuizzes(); return; }
  el.innerHTML = `
    <button class="back-link" onclick="quizzesState={mode:'list'}; renderQuizzes();">‹ กลับ</button>
    <h2 class="detail-title">${escapeHtml(q.title)}${langBadge(q.lang||'en')}</h2>
    <p class="detail-meta">${q.questions.length} ข้อ${q.bestScore!=null ? ` · คะแนนดีที่สุด ${q.bestScore}/${q.bestTotal}` : ' · ยังไม่เคยทำ'}</p>
    ${tagChipsHtml(itemTags(q), 'filterQuizzesByTag')}
    <div class="row-actions" style="margin-top:14px;">
      <button class="btn btn-primary" onclick="startQuiz('${q.id}')">เริ่มทำแบบทดสอบ</button>
      <button class="btn btn-ghost" onclick="openEditQuizForm('${q.id}')">แก้ไข</button>
      <button class="btn btn-danger" id="del-quiz-btn" onclick="confirmDeleteQuiz('${q.id}', this)">ลบแบบทดสอบนี้</button>
    </div>
    ${relatedHtml(q, 'quiz')}`;
}

function confirmDeleteQuiz(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบแบบทดสอบนี้'; } }, 3000);
    return;
  }
  const idx = quizzes.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removed = quizzes[idx];
  quizzes.splice(idx,1);
  saveQuizzes();
  quizzesState = {mode:'list'};
  renderQuizzes();
  showToast('ลบแบบทดสอบแล้ว', ()=>{
    quizzes.splice(idx,0,removed);
    saveQuizzes();
    quizzesState = {mode:'detail', id};
    renderQuizzes();
  });
}

function startQuiz(id){
  currentAttempt = { quizId:id, answers: new Array(quizzes.find(x=>x.id===id).questions.length).fill(null) };
  quizzesState = {mode:'take', id};
  renderQuizzes();
}

function renderQuizTake(){
  const el = document.getElementById('view-quizzes');
  const q = quizzes.find(x=>x.id===quizzesState.id);
  if(!q){ quizzesState={mode:'list'}; renderQuizzes(); return; }
  el.innerHTML = `
    <button class="back-link" onclick="quizzesState={mode:'detail', id:'${q.id}'}; renderQuizzes();">‹ ออกจากแบบทดสอบ</button>
    <h2 class="detail-title">${escapeHtml(q.title)}${langBadge(q.lang||'en')}</h2>
    <div style="margin-top:10px;">
      ${q.questions.map((qq,qi)=>`
        <div class="take-q">
          <p class="qtext">${qi+1}. ${escapeHtml(qq.text)}</p>
          ${qq.options.map((opt,oi)=>`
            <label class="take-opt">
              <input type="radio" name="take-${qi}" ${currentAttempt.answers[qi]===oi?'checked':''} onchange="setAnswer(${qi},${oi})">
              <span>${escapeHtml(opt)}</span>
            </label>`).join('')}
        </div>`).join('')}
    </div>
    <p class="hint-msg" id="take-hint"></p>
    <button class="btn btn-primary" onclick="submitQuiz()">ตรวจคำตอบ</button>`;
}

function setAnswer(qi, oi){
  currentAttempt.answers[qi] = oi;
  const hint = document.getElementById('take-hint');
  if(hint) hint.textContent = '';
}

function submitQuiz(){
  if(currentAttempt.answers.some(a=>a===null)){
    document.getElementById('take-hint').textContent = 'ตอบให้ครบทุกข้อก่อนส่งนะ';
    return;
  }
  const q = quizzes.find(x=>x.id===currentAttempt.quizId);
  let score = 0;
  const details = q.questions.map((qq,qi)=>{
    const chosen = currentAttempt.answers[qi];
    const correct = chosen === qq.correctIndex;
    if(correct) score++;
    return { text:qq.text, chosenText:qq.options[chosen], correctText:qq.options[qq.correctIndex], correct };
  });
  const total = q.questions.length;
  q.lastAttemptDate = new Date().toISOString();
  if(q.bestScore===null || score > q.bestScore){ q.bestScore = score; q.bestTotal = total; }
  saveQuizzes();
  lastResult = { quizId:q.id, quizTitle:q.title, score, total, details };
  quizzesState = {mode:'result'};
  renderQuizzes();
}

function renderQuizResult(){
  const el = document.getElementById('view-quizzes');
  const r = lastResult;
  if(!r){ quizzesState={mode:'list'}; renderQuizzes(); return; }
  const pct = Math.round((r.score/r.total)*100);
  el.innerHTML = `
    <div class="result-wrap">
      <div class="stamp">
        <svg viewBox="0 0 200 200">
          <path d="M100,20 C142,14 178,46 181,86 C185,132 156,170 107,179 C63,187 22,155 18,109 C14,66 44,27 91,21 C94,20 97,20 100,20 Z"/>
        </svg>
        <div class="stamp-text">
          <div class="score">${r.score}/${r.total}</div>
          <div class="pct">${pct}%</div>
        </div>
      </div>
      <p class="result-note">${escapeHtml(r.quizTitle)}</p>
      <div class="row-actions" style="margin-bottom:18px;">
        <button class="btn btn-highlight" onclick="startQuiz('${r.quizId}')">ทำอีกครั้ง</button>
        <button class="btn btn-ghost" onclick="quizzesState={mode:'list'}; renderQuizzes();">กลับไปที่รายการ</button>
      </div>
      <div class="review-list">
        ${r.details.map((d,i)=>`
          <div class="review-item">
            <p class="rq"><span class="mark ${d.correct?'correct':'wrong'}">${d.correct?'✓':'✗'}</span> <span>${i+1}. ${escapeHtml(d.text)}</span></p>
            <p class="ans-line">คำตอบของคุณ: <b>${escapeHtml(d.chosenText)}</b></p>
            ${!d.correct ? `<p class="ans-line">คำตอบที่ถูก: <b>${escapeHtml(d.correctText)}</b></p>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
}

   JOURNAL (general notes: game guides, recipes, ideas, etc.)
