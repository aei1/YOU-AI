<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เว็บเรียนของฉัน</title>
<link rel="icon" type="image/jpeg" href="logo.jpg?v=2">
<link rel="apple-touch-icon" href="logo.jpg?v=2">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Sarabun:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#24352B;
    --cover-dark:#17231C;
    --cover-ring:#3E5A47;
    --paper:#F6F1E4;
    --paper-shade:#ECE4CF;
    --paper-line:#D9D2BC;
    --ink:#1F2A3D;
    --ink-soft:#5B6577;
    --red-pen:#B23A2E;
    --red-pen-dark:#8F2C22;
    --highlighter:#E3B23C;
    --highlighter-soft:#F1D28C;
    --green-check:#3F6B4F;
    --lang-en:#2E5F86;
    --lang-zh:#8F4A1C;
    --lang-gen:#6B6357;
    --ink-faint:#6B665C;
    /* Text sitting on the always-dark green header/spine — never flips with theme. */
    --cover-text:#F6F1E4;
    /* Text sitting on top of a saturated accent fill (red-pen / green-check). */
    --on-accent:#FFFFFF;
    /* Action link inside the toast (toast bg is --ink, so this must contrast with it). */
    --toast-accent:#E3B23C;
    --font-display:'Charmonman',cursive;
    --font-body:'Sarabun',sans-serif;
    --font-mono:'Chakra Petch',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#231F1A;
      --paper-shade:#2D2820;
      --paper-line:#473F33;
      --ink:#EDE7D8;
      --ink-soft:#B0A996;
      --ink-faint:#958E7F;
      --highlighter-soft:#4A3D22;
      --green-check:#6DAC7E;
      --red-pen:#D9776A;
      --red-pen-dark:#B85C50;
      --lang-en:#6FA0D6;
      --lang-zh:#D08A57;
      /* Accents get lighter in dark mode, so text on them must go dark. */
      --on-accent:#221E19;
      /* Toast bg is light in dark mode, so the action link needs a deep amber. */
      --toast-accent:#7A5310;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* No fixed height here: with html/body locked to 100% the card became a
     flex item that had to shrink, so the page could not scroll and anything
     below the fold was clipped away by .app's overflow:hidden. */
  html,body{margin:0;padding:0;}
  html{ background:var(--cover-dark); min-height:100%; }
  body{
    font-family:var(--font-body);
    background:radial-gradient(ellipse at top left, #2E4234 0%, var(--cover-dark) 70%);
    color:var(--ink);
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:24px 14px calc(24px + 78px);
    overscroll-behavior-y:none;
  }
  .app{
    width:100%; max-width:820px; background:var(--paper); border-radius:14px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.04) inset;
    overflow:hidden; display:flex; flex-direction:column; min-height:640px;
  }
  button, .card, .activity-item{ touch-action:manipulation; }
  .ring-strip{
    height:16px; flex:0 0 16px; background:var(--cover-dark);
    background-image:radial-gradient(circle, var(--cover-ring) 0 4px, transparent 5px);
    background-size:34px 100%; background-position:center; background-repeat:repeat-x;
  }
  .app-header{ background:linear-gradient(180deg,var(--cover),#1E2E25); padding:22px 30px 16px; }
  .brand{ font-family:var(--font-display); font-size:32px; line-height:1; margin:0 0 6px; color:var(--cover-text); }
  .sub{margin:0 0 6px; color:rgba(246,241,228,.78); font-size:13.5px;}
  .date-line{margin:0; font-family:var(--font-mono); font-size:11px; letter-spacing:.4px; color:rgba(246,241,228,.62);}

  /* Bottom navigation dock. It is pinned to the viewport rather than laid
     out inside the card: as a flex item it could be squeezed to nothing by
     the content above it, and down here it also sits under the thumb. */
  .tabbar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; z-index:40;
    width:100%; max-width:820px;
    background:var(--paper-shade); border-top:1.5px solid var(--paper-line);
    padding:0 10px env(safe-area-inset-bottom);
    box-shadow:0 -12px 28px -20px rgba(0,0,0,.75);
  }
  .tabbar-inner{position:relative; display:flex; width:100%;}
  .tab-btn{
    flex:1 1 0; background:none; border:none; cursor:pointer;
    font-family:var(--font-body); font-weight:600; font-size:12.5px;
    padding:9px 4px 10px; color:var(--ink-soft); transition:color .15s ease; white-space:nowrap;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .tab-btn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink);}
  .tab-indicator{
    position:absolute; top:0; height:3px; border-radius:0 0 3px 3px; background:var(--highlighter);
    transition:left .25s cubic-bezier(.4,0,.2,1), width .25s cubic-bezier(.4,0,.2,1);
  }

  /* The last 78px of the page sit behind the dock, so give it back. */
  .content{padding:22px 30px calc(86px + env(safe-area-inset-bottom)); flex:1;}
  .view{min-height:0;}
  .hidden{display:none !important;}

  .search-input{
    width:100%; font-family:var(--font-body); font-size:14.5px; padding:9px 12px;
    border:1.5px solid var(--paper-line); border-radius:8px; background:var(--paper-shade); color:var(--ink);
    margin-bottom:12px;
  }
  .search-input:focus-visible{outline:2px solid var(--highlighter); border-color:var(--highlighter);}
  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .lang-chip{
    padding:5px 13px; border-radius:20px; font-family:var(--font-mono); font-size:12px; font-weight:600;
    border:1.5px solid var(--paper-line); background:none; color:var(--ink-soft); cursor:pointer; transition:all .15s ease;
  }
  .lang-chip.all.active{border-color:var(--ink); color:var(--ink);}
  .lang-chip.en.active{border-color:var(--lang-en); color:var(--lang-en);}
  .lang-chip.zh.active{border-color:var(--lang-zh); color:var(--lang-zh);}
  .lang-badge{
    display:inline-block; font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    padding:2px 9px; border-radius:10px; border:1.5px solid currentColor; vertical-align:middle; margin-left:6px;
  }
  .lang-badge.en{color:var(--lang-en);}
  .lang-badge.zh{color:var(--lang-zh);}
  .check-mark{color:var(--green-check); font-weight:700; margin-left:6px;}

  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px;}
  .tag-chip{
    font-family:var(--font-mono); font-size:12px; font-weight:600; cursor:pointer;
    padding:4px 11px; border-radius:20px; border:1.5px solid var(--lang-en);
    background:none; color:var(--lang-en); transition:background .15s ease, color .15s ease;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tag-chip:hover{background:var(--lang-en); color:var(--on-accent);}
  .tag-chip.ghost{border-color:var(--paper-line); color:var(--ink-soft);}
  .tag-chip.ghost:hover{border-color:var(--ink-soft); background:none; color:var(--ink);}
  .tag-count{
    font-size:10.5px; padding:1px 6px; border-radius:9px;
    background:var(--paper-shade); color:var(--ink-soft);
  }
  .tag-chip:hover .tag-count{background:var(--paper); color:var(--ink-soft);}
  .tag-suggest{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px;}
  .tag-suggest-label{font-size:12px; color:var(--ink-soft);}

  .btn{font-family:var(--font-body); font-weight:600; font-size:14.5px; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{box-shadow:0 4px 10px rgba(31,42,61,.3);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--paper-line);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn-danger{background:transparent; color:var(--red-pen); border:1.5px solid var(--red-pen);}
  .btn-danger:hover{background:var(--red-pen); color:var(--on-accent);}
  .btn-highlight{background:var(--highlighter); color:#3A2A0A;}
  .btn-highlight:hover{box-shadow:0 4px 10px rgba(227,178,58,.4);}
  .btn-complete{background:transparent; color:var(--green-check); border:1.5px solid var(--green-check);}
  .btn-complete.is-done{background:var(--green-check); color:var(--on-accent);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:6px 10px; font-size:13px; border-radius:6px;}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}
  /* Deleting lives at the very bottom of the form it belongs to, fenced off
     from the save and cancel buttons so it is never a mis-tap. */
  .danger-zone{
    margin-top:22px; padding-top:14px; border-top:1.5px dashed var(--paper-line);
    display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  }
  .danger-zone .field-hint{margin:0;}
  .bag-history{margin-top:22px; padding-top:14px; border-top:1.5px dashed var(--paper-line);}

  .empty{text-align:center; padding:50px 16px; color:var(--ink-soft);}
  .empty p{margin:0 0 16px; font-size:15px;}
  .empty .doodle{font-size:34px; margin-bottom:10px; opacity:.7;}

  .section-title{font-size:19px; font-weight:700; margin:0 0 4px; color:var(--ink);}
  .section-sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 18px;}
  .mini-label{font-size:13px; font-weight:600; color:var(--ink-soft); margin:20px 0 10px;}

  /* Sub-tabs, shared by the notes hub and the market */
  .hub-subtabs{
    display:flex; gap:6px; background:var(--paper-shade); border:1.5px solid var(--paper-line);
    border-radius:10px; padding:4px; margin-bottom:18px;
  }
  .hub-tab{
    flex:1; font-family:var(--font-body); font-size:14.5px; font-weight:600;
    border:none; background:transparent; color:var(--ink-soft);
    padding:9px 10px; border-radius:7px; cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .hub-tab.active{ background:var(--cover); color:var(--cover-text); }

  /* Turning points into money, on the market tab */
  .cash-card{
    border:1.5px solid var(--paper-line); border-radius:12px; background:var(--paper-shade);
    padding:12px; margin-bottom:18px;
  }
  .cash-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
  .cash-title{margin:0; font-size:15px; font-weight:700; color:var(--ink);}
  .cash-rate{margin:0 0 10px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft);}
  .cash-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .cash-row input{
    flex:1; min-width:0; font-family:var(--font-mono); font-size:15px; padding:9px 11px;
    border:1.5px solid var(--paper-line); border-radius:9px; background:var(--paper); color:var(--ink);
  }
  .cash-row input:focus-visible{outline:2px solid var(--highlighter); border-color:var(--highlighter);}
  .cash-preview{margin:0 0 10px; font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--highlighter);}
  .sched-extra{margin-top:8px;}
  .sched-extra input{
    font-family:var(--font-body); font-size:14.5px; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--paper-line); border-radius:8px;
    padding:9px 11px; width:100%; box-sizing:border-box;
  }
  .sched-extra input:focus-visible{outline:2px solid var(--highlighter); border-color:var(--highlighter);}
  .rate-row{display:flex; align-items:flex-end; gap:8px; margin-bottom:10px;}
  .rate-cell{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0;}
  .rate-cell label{font-size:11px; color:var(--ink-soft);}
  .rate-cell input{
    width:100%; min-width:0; font-family:var(--font-mono); font-size:15px; padding:8px 9px;
    border:1.5px solid var(--paper-line); border-radius:9px; background:var(--paper); color:var(--ink);
  }
  .rate-cell input:focus-visible{outline:2px solid var(--highlighter); border-color:var(--highlighter);}
  .rate-eq{font-family:var(--font-mono); font-size:16px; color:var(--ink-soft); padding-bottom:9px;}
  .cash-total{margin:14px 0 8px; font-size:12.5px; color:var(--ink-soft);}

  /* Calendar on the home tab — one square per day, a dot per kind of event */
  .cal-card{
    border:1.5px solid var(--paper-line); border-radius:12px; background:var(--paper-shade);
    padding:12px 12px 14px; margin-bottom:4px;
  }
  .cal-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .cal-title{margin:0; font-size:15px; font-weight:700; color:var(--ink);}
  .cal-nav{display:flex; gap:6px; align-items:center;}
  .cal-nav button{
    border:1.5px solid var(--paper-line); background:var(--paper); color:var(--ink);
    border-radius:8px; min-width:30px; height:30px; padding:0 8px; font-size:14px; line-height:1;
    font-family:var(--font-body); cursor:pointer;
  }
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cal-dow{text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); padding:2px 0 4px;}
  .cal-day{
    position:relative; aspect-ratio:1/1; border:none; background:transparent; border-radius:9px;
    color:var(--ink); font-family:var(--font-mono); font-size:13px; cursor:pointer; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  }
  .cal-day.blank{visibility:hidden; cursor:default;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--highlighter);}
  .cal-day.selected{background:var(--cover); color:var(--cover-text);}
  .cal-dots{display:flex; gap:2px; height:5px;}
  .cal-dot{width:5px; height:5px; border-radius:50%; flex:none;}
  .cal-dot.activity{background:var(--green-check);}
  .cal-dot.market{background:var(--red-pen);}
  .cal-dot.lesson{background:var(--lang-en);}
  .cal-dot.quiz{background:var(--lang-zh);}
  .cal-dot.custom{background:var(--highlighter);}
  .cal-dot.due{background:var(--ink-soft);}
  .cal-day.selected .cal-dot{box-shadow:0 0 0 1px rgba(246,241,228,.45);}
  .cal-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:11px; color:var(--ink-soft);}
  .cal-legend span{display:inline-flex; align-items:center; gap:4px;}
  .cal-day-panel{margin-top:12px; border-top:1.5px dashed var(--paper-line); padding-top:10px;}
  .cal-day-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .cal-day-title{margin:0; font-size:13.5px; font-weight:600; color:var(--ink);}
  .cal-event{display:flex; align-items:flex-start; gap:8px; padding:7px 0; border-bottom:1px solid var(--paper-line);}
  .cal-event:last-child{border-bottom:none;}
  .cal-event .cal-dot{margin-top:6px;}
  .cal-event-body{flex:1; min-width:0;}
  .cal-event-title{margin:0; font-size:13.5px; color:var(--ink); word-break:break-word;}
  .cal-event-meta{margin:2px 0 0; font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono);}
  .cal-empty{margin:0 0 8px; font-size:13px; color:var(--ink-soft);}

  /* Points wallet */
  .balance-card{
    background:linear-gradient(135deg,var(--cover),#1E2E25); border-radius:12px;
    padding:18px 20px; margin-bottom:18px; text-align:center;
    box-shadow:0 8px 20px -12px rgba(0,0,0,.55);
  }
  .balance-label{font-size:12.5px; color:rgba(246,241,228,.75); margin:0 0 4px;}
  .balance-value{font-family:var(--font-mono); font-size:34px; font-weight:600; line-height:1.1; color:var(--highlighter); margin:0;}
  .balance-unit{font-size:14px; color:rgba(246,241,228,.75); margin-left:4px;}
  .balance-sub{font-size:12px; color:rgba(246,241,228,.6); margin:6px 0 0;}
  .points-badge{
    font-family:var(--font-mono); font-size:12.5px; font-weight:600; border-radius:20px;
    padding:2px 9px; white-space:nowrap;
  }
  .points-badge.plus{ background:rgba(63,107,79,.16); color:var(--green-check); }
  .kind-chip.repeat{ border-color:var(--highlighter); color:var(--highlighter); }
  .kind-chip.hot{ border-color:var(--red-pen); color:var(--red-pen); font-weight:700; }
  .card.is-locked{ opacity:.6; }
  .card.is-done{ opacity:.62; }
  .field-hint{ font-size:11.5px; color:var(--ink-soft); margin:6px 0 0; }
  .points-badge.minus{ background:rgba(178,58,46,.14); color:var(--red-pen); }
  .price-tag{font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--highlighter); white-space:nowrap;}
  .item-card-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .kind-chip{
    display:inline-block; font-size:11.5px; border-radius:20px; padding:2px 9px; margin-left:6px;
    background:var(--paper-shade); border:1px solid var(--paper-line); color:var(--ink-soft);
  }
  /* Sticky-note notification board */
  .sticky-board{ display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:16px; margin-bottom:6px; }
  .sticky{
    position:relative; padding:18px 14px 12px; border-radius:3px; min-height:118px;
    display:flex; flex-direction:column; gap:6px; cursor:pointer; text-align:left;
    border:none; font-family:var(--font-body); width:100%;
    box-shadow:0 6px 14px -8px rgba(0,0,0,.5);
    transform:rotate(var(--tilt,-1deg)); transform-origin:center top;
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .sticky::before{
    content:''; position:absolute; top:-7px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:52px; height:15px; border-radius:2px;
    background:rgba(246,241,228,.55); box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .sticky:hover{ transform:rotate(0deg) translateY(-2px); box-shadow:0 10px 20px -8px rgba(0,0,0,.55); }
  .sticky.n-points{ background:#F1D9A0; }
  .sticky.n-market{ background:#EFC0B4; }
  .sticky.n-nudge{ background:#C9DCC4; }
  .sticky.n-note{ background:#CBD8E8; }
  .sticky.n-claude{ background:#DCCBE8; }
  .sticky.is-read{ opacity:.55; }
  .sticky-title{ font-weight:700; font-size:14.5px; color:#2A2620; margin:0; line-height:1.35; word-break:break-word; }
  .sticky-body{ font-size:13px; color:#4A443A; margin:0; line-height:1.5; flex:1; word-break:break-word; }
  .sticky-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sticky-time{ font-family:var(--font-mono); font-size:10.5px; color:#6B6357; margin:0; }
  .sticky-open{ font-size:11px; font-weight:600; color:#3F5A46; margin:0; white-space:nowrap; }

  /* Full text of a notification that has nothing to jump to */
  .notif-sheet{
    position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .notif-sheet-card{
    width:100%; max-width:420px; max-height:80vh; overflow-y:auto;
    background:var(--paper); border-radius:14px; padding:18px 18px 16px;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.7);
  }
  .notif-sheet-kind{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin:0 0 6px; }
  .notif-sheet-title{ font-size:17px; font-weight:700; color:var(--ink); margin:0 0 8px; }
  .notif-sheet-body{ font-size:14px; color:var(--ink); margin:0 0 12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .notif-sheet-time{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin:0 0 14px; }
  .sticky-close{
    position:absolute; top:6px; right:7px; width:24px; height:24px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:50%; cursor:pointer; font-size:15px;
    background:rgba(0,0,0,.06); color:#4A443A;
  }
  .sticky-close:active{ background:rgba(0,0,0,.14); }
  .board-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 12px; }
  .board-head .mini-label{ margin:0; }
  .unread-dot{
    display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:9px;
    background:var(--red-pen); color:var(--on-accent);
    font-family:var(--font-mono); font-size:11px; line-height:18px; text-align:center; margin-left:6px;
  }
  .notif-strip{

  function unlock(){
    sessionStorage.setItem(SESSION_KEY, "yes");
    document.body.classList.remove("locked");
    document.getElementById("gate").classList.add("hidden");
    loadAll();   // only reach for Drive once the PIN screen is out of the way
  }

  if(sessionStorage.getItem(SESSION_KEY) === "yes"){ unlock(); return; }

  var entry = "";
  var locked = false;               // brief lock-out while the wrong-PIN shake plays
  var dotsEl = document.getElementById("pin-dots");
  var padEl = document.getElementById("pin-pad");
  var errEl = document.getElementById("gate-error");
  var cardEl = document.querySelector("#gate .gate-card");

  function renderDots(){
    var html = "";
    for(var i = 0; i < PIN.length; i++){
      html += '<span class="pin-dot' + (i < entry.length ? ' filled' : '') + '"></span>';
    }
    dotsEl.innerHTML = html;
  }

  function reject(){
    locked = true;
    errEl.textContent = "รหัสไม่ถูกต้อง";
    cardEl.classList.add("shake");
    setTimeout(function(){
      cardEl.classList.remove("shake");
      entry = "";
      locked = false;
      renderDots();
    }, 420);
  }

  function press(digit){
    if(locked || entry.length >= PIN.length) return;
    entry += digit;
    errEl.textContent = "";
    renderDots();
    if(entry.length === PIN.length){
      if(entry === PIN) unlock();
      else reject();
    }
  }

  function backspace(){
    if(locked || !entry.length) return;
    entry = entry.slice(0, -1);
    errEl.textContent = "";
    renderDots();
  }

  var keys = ["1","2","3","4","5","6","7","8","9","blank","0","back"];
  padEl.innerHTML = keys.map(function(k){
    if(k === "blank") return '<div class="pin-key blank"></div>';
    if(k === "back")  return '<button type="button" class="pin-key ghost" data-key="back" aria-label="ลบ">⌫</button>';
    return '<button type="button" class="pin-key" data-key="' + k + '">' + k + '</button>';
  }).join("");

  padEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-key]");
    if(!btn) return;
    if(btn.dataset.key === "back") backspace();
    else press(btn.dataset.key);
  });

  // Physical keyboard still works on desktop.
  document.addEventListener("keydown", function(e){
    if(document.body.classList.contains("locked") === false) return;
    if(e.key >= "0" && e.key <= "9") press(e.key);
    else if(e.key === "Backspace"){ e.preventDefault(); backspace(); }
  });

  renderDots();
})();

function mdInline(s){ return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>'); }

/* ---------------- Tags ----------------
   Tags are the cross-cutting link between data: a tag says which topic /
   branch an item belongs to, and the same tag can sit on both notes and
   quizzes, so one topic can be pulled up across both types.
   Matching is case-insensitive; the display spelling of whichever tag was
   saved first wins, so "HSK3" and "hsk3" never split into two tags.
--------------------------------------- */
function normTag(t){ return String(t||'').trim().replace(/^#+/,'').trim().toLowerCase(); }
function itemTags(x){ return Array.isArray(x && x.tags) ? x.tags : []; }
function tagRegistry(){
  // key -> display spelling already in use somewhere
  const reg = new Map();
  [...notes, ...quizzes, ...journal].forEach(x=>{
    itemTags(x).forEach(t=>{
      const k = normTag(t);
      if(k && !reg.has(k)) reg.set(k, String(t).replace(/^#+/,'').trim());
    });
  });
  return reg;
}
function parseTags(str){
  const reg = tagRegistry();
  const out = [], seen = new Set();
  String(str||'').split(/[,\n]+|\s+/).forEach(raw=>{
    const k = normTag(raw);
    if(!k || seen.has(k)) return;
    seen.add(k);
    out.push(reg.get(k) || String(raw).replace(/^#+/,'').trim());
  });
  return out;
}
function allTags(){
  const map = new Map();
  function add(x, kind){
    itemTags(x).forEach(t=>{
      const k = normTag(t); if(!k) return;
      if(!map.has(k)) map.set(k, { key:k, tag:String(t).replace(/^#+/,'').trim(), notes:0, quizzes:0, journal:0 });
      map.get(k)[kind]++;
    });
  }
  notes.forEach(n=>add(n,'notes'));
  quizzes.forEach(q=>add(q,'quizzes'));
  journal.forEach(j=>add(j,'journal'));
  return [...map.values()].map(t=>({ ...t, total:t.notes + t.quizzes + t.journal }))
    .sort((a,b)=> b.total-a.total || a.tag.localeCompare(b.tag));
}
function hasTag(x, key){ return itemTags(x).some(t=> normTag(t)===key); }
/* Split a search string into #tag requirements and leftover free text. */
function splitQuery(q){
  const tags = [], words = [];
  String(q||'').split(/\s+/).forEach(tok=>{
    if(!tok) return;
    if(tok.startsWith('#')){ const k = normTag(tok); if(k) tags.push(k); }
    else words.push(tok);
  });
  return { tags, text: words.join(' ').trim().toLowerCase() };
}
function tagChipsHtml(tags, onClickFn){
  if(!tags || !tags.length) return '';
  return `<div class="tag-row">${tags.map(t=>{
    const k = normTag(t);
    return `<button type="button" class="tag-chip" onclick="${onClickFn}('${escapeHtml(k).replace(/'/g,"\\'")}')">#${escapeHtml(String(t).replace(/^#+/,''))}</button>`;
  }).join('')}</div>`;
}
/* Everything (notes + quizzes) sharing any tag with this item, minus itself. */
function relatedByTag(item, kind){
  const keys = itemTags(item).map(normTag).filter(Boolean);
  if(!keys.length) return [];
  const out = [];
  notes.forEach(n=>{
    if(kind==='note' && n.id===item.id) return;
    if(keys.some(k=>hasTag(n,k))) out.push({ type:'note', id:n.id, title:n.title, lang:n.lang||'en' });
  });
  quizzes.forEach(q=>{
    if(kind==='quiz' && q.id===item.id) return;
    if(keys.some(k=>hasTag(q,k))) out.push({ type:'quiz', id:q.id, title:q.title, lang:q.lang||'en', bestScore:q.bestScore, bestTotal:q.bestTotal });
  });
  journal.forEach(j=>{
    if(kind==='journal' && j.id===item.id) return;
    if(keys.some(k=>hasTag(j,k))) out.push({ type:'journal', id:j.id, title:j.title });
  });
  return out;
}

function mdToHtml(md){
  const lines = escapeHtml(md).split('\n');
  let html = '', inList = null, para = [];
  function flushPara(){ if(para.length){ html += `<p>${para.join('<br>')}</p>`; para = []; } }
  function closeList(){ if(inList){ html += `</${inList}>`; inList = null; } }
  lines.forEach(raw=>{
    const line = raw.trim();
    if(line===''){ flushPara(); closeList(); return; }
    let m;
    if((m = line.match(/^(#{1,3})\s+(.*)$/))){
      flushPara(); closeList();
      const tag = 'h' + (m[1].length + 2);
      html += `<${tag}>${mdInline(m[2])}</${tag}>`;
      return;
    }
    if((m = line.match(/^[-*]\s+(.*)$/))){
      flushPara();
      if(inList!=='ul'){ closeList(); html += '<ul class="md-list">'; inList = 'ul'; }
      html += `<li>${mdInline(m[1])}</li>`;
      return;
    }
    if((m = line.match(/^\d+\.\s+(.*)$/))){
      flushPara();
      if(inList!=='ol'){ closeList(); html += '<ol class="md-list">'; inList = 'ol'; }
      html += `<li>${mdInline(m[1])}</li>`;
      return;
    }
    closeList();
    para.push(mdInline(line));
  });
  flushPara(); closeList();
  return html || '<p></p>';
}

}

/* ---- OAuth ---- */
function gisReady(){
  return !!(window.google && google.accounts && google.accounts.oauth2);
}
function waitForGis(timeoutMs){
  return new Promise((resolve, reject)=>{
    if(gisReady()) return resolve();
    const started = Date.now();
    const t = setInterval(()=>{
      if(gisReady()){ clearInterval(t); resolve(); }
      else if(Date.now() - started > timeoutMs){
        clearInterval(t);
        reject(new Error('โหลดไลบรารีของ Google ไม่สำเร็จ'));
      }
    }, 120);
  });
}
/* prompt:'' asks silently — it only works once access was granted before,
   so the first ever sign-in still needs the button. */
function requestToken(silent){
  return new Promise((resolve, reject)=>{
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: () => {}
      });
    }
    tokenClient.callback = (resp)=>{
      if(resp && resp.access_token){ accessToken = resp.access_token; resolve(resp.access_token); }
      else reject(new Error(resp && resp.error ? resp.error : 'ไม่ได้รับสิทธิ์เข้าถึง Drive'));
    };
    tokenClient.error_callback = (err)=> reject(new Error((err && err.type) || 'การเข้าสู่ระบบถูกยกเลิก'));
    try{ tokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' }); }
    catch(e){ reject(e); }
  });
}

/* ---- Drive REST helpers ---- */
async function driveFetch(url, opts, retrying){
  const o = Object.assign({}, opts);
  o.headers = Object.assign({}, o.headers, { Authorization: 'Bearer ' + accessToken });
  const res = await fetch(url, o);
  if(res.status === 401 && !retrying){
    // Access tokens expire after about an hour; get a fresh one and retry once.
    await requestToken(true);
    return driveFetch(url, opts, true);
  }
  if(!res.ok){
    const body = await res.text().catch(()=> '');
    throw new Error('Drive ' + res.status + ' ' + body.slice(0, 140));
  }
  return res;
}
async function findDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)&pageSize=1`);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}
async function createDriveFile(doc){
  const boundary = 'youai' + Math.random().toString(36).slice(2);
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify({ name: DRIVE_FILENAME, mimeType: 'application/json' }) +
    `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(doc) +
    `\r\n--${boundary}--`;
  const res = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
    body
  });
  return (await res.json()).id;
}
async function readDriveFile(id){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  return await res.json();
}
async function writeDriveFile(id, doc){
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
    body: JSON.stringify(doc)
  });
}

/* One-time rescue of anything a device saved before this version, so
   upgrading doesn't throw the user's existing data away. Read once,
   handed to Drive, then the local copy is cleared for good. */
function takeLegacyLocalData(){
  const keys = ['notes','quizzes','journal','pointsWallet','notifications'];
  let found = null;
  try{
    const raw = {};
    keys.forEach(k=>{ const v = localStorage.getItem(k); if(v) raw[k] = JSON.parse(v); });
    const hasSomething =
      (raw.notes && raw.notes.length) || (raw.quizzes && raw.quizzes.length) ||
      (raw.journal && raw.journal.length) || (raw.notifications && raw.notifications.length) ||
      (raw.pointsWallet && (raw.pointsWallet.balance || (raw.pointsWallet.activities||[]).length || (raw.pointsWallet.marketItems||[]).length));
    if(hasSomething) found = raw;
  }catch(e){ found = null; }
  try{ keys.forEach(k=> localStorage.removeItem(k)); }catch(e){ /* nothing to clean up */ }
  return found;
}

/* ---- Saving ---- */
function scheduleSave(){
  savePending = true;
  setSyncState('saving', 'กำลังบันทึก');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE_MS);
}
async function flushSave(){
  clearTimeout(saveTimer);
  if(!savePending || !driveFileId) return;
  if(saveInFlight) return saveInFlight;          // one write at a time
  savePending = false;
  setSyncState('saving', 'กำลังบันทึก');
  saveInFlight = (async ()=>{
    try{
      await writeDriveFile(driveFileId, currentDoc());
      setSyncState('ok', 'ซิงก์แล้ว');
    }catch(e){
      savePending = true;                        // keep it queued for a retry
      setSyncState('error', 'บันทึกไม่สำเร็จ');
      showToast('บันทึกขึ้น Drive ไม่สำเร็จ แตะที่สถานะเพื่อลองใหม่');
    }finally{
      saveInFlight = null;
    }
  })();
  return saveInFlight;
}
// Don't lose the last edit when the tab is closed or backgrounded.
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);

/* =========================================================
   POINTS WALLET
   One shared balance behind the notebook (earn) and the market
   (spend). Every change goes through addPoints/spendPoints so the
   ledger stays the complete history of how the balance got here.
   ========================================================= */
/* A rate is "N points = M money". Wallets saved before the money side
   was settable only stored pointsPerUnit, which meant M was always 1. */
function normalizeExchange(e){
  e = (e && typeof e === 'object') ? e : {};
  const rawPoints = e.points != null ? e.points : e.pointsPerUnit;
  const points = Math.max(1, Math.round(Number(rawPoints) || 10));
  const amount = Math.round(Math.max(0.01, Number(e.amount != null ? e.amount : 1) || 1) * 100) / 100;
  const currency = String(e.currency || 'บาท').trim().slice(0, 12) || 'บาท';
  return { points, amount, currency };
}
function emptyWallet(){
  return { balance:0, ledger:[], activities:[], marketItems:[], redemptions:[],
           cashOuts:[], exchange:{ points:10, amount:1, currency:'บาท' },
           lastModifiedAt:new Date().toISOString() };
}
function normalizeWallet(w){
  const base = emptyWallet();
  if(!w || typeof w !== 'object') return base;
  return {
    balance: Number.isFinite(w.balance) ? w.balance : 0,
    ledger: Array.isArray(w.ledger) ? w.ledger : [],
    activities: Array.isArray(w.activities) ? w.activities : [],
    marketItems: Array.isArray(w.marketItems) ? w.marketItems : [],
    redemptions: Array.isArray(w.redemptions) ? w.redemptions : [],
    cashOuts: Array.isArray(w.cashOuts) ? w.cashOuts : [],
    exchange: normalizeExchange(w.exchange),
    lastModifiedAt: w.lastModifiedAt || base.lastModifiedAt
  };
}
function saveWallet(){
  wallet.lastModifiedAt = new Date().toISOString();
  scheduleSave();
}
function addPoints(amount, reason, source){
  const amt = Math.max(0, Math.round(Number(amount) || 0));
  if(!amt) return 0;
  wallet.balance += amt;
  wallet.ledger.push({ id:uid(), timestamp:new Date().toISOString(), amount:amt, reason:reason||'', source:source||'notebook' });
  saveWallet();
  return amt;
}
/* Returns false (and changes nothing) when the balance is too low. */
function spendPoints(amount, reason, source){
  const amt = Math.max(0, Math.round(Number(amount) || 0));
  if(!amt) return false;
  if(wallet.balance < amt) return false;
  wallet.balance -= amt;
  wallet.ledger.push({ id:uid(), timestamp:new Date().toISOString(), amount:-amt, reason:reason||'', source:source||'market' });
  saveWallet();
  return true;
}
function fmtPoints(n){ return (Number(n)||0).toLocaleString('th-TH'); }

/* =========================================================
   NOTIFICATIONS
   Every notable event pins a sticky note to the home board. The
   newest 30 are kept so the board never grows without bound.
   ========================================================= */
const NOTIF_LIMIT = 30;
function saveNotifications(){ scheduleSave(); }
function pushNotification(kind, title, body, link){
  notifications.unshift({ id:uid(), kind, title, body:body||'', link:link||null, createdAt:new Date().toISOString(), read:false });
  if(notifications.length > NOTIF_LIMIT) notifications.length = NOTIF_LIMIT;
  saveNotifications();
  // Refresh the two views that show notifications, so a note pinned from
  // the notebook or market is already there when you switch tabs.
  if(historyReady){ renderHome(); renderJournal(); }
}
/* A sticky note is a door, not a label: tapping it opens whatever it is
   about. When there is nothing left to open — a plain reminder, or an
   item since deleted — it shows its own full text instead, so a tap is
   never a dead end. */
let notifSheetId = null;
function openNotification(id){
  const n = notifications.find(x=>x.id===id);
  if(!n) return;
  markNotificationRead(id);
  const l = n.link || {};
  switch(l.type){
    case 'lesson':
      if(notes.some(x=>x.id===l.id)){
        notesState = {mode:'detail', id:l.id}; journalState = {mode:'list'};
        gotoHub('read'); renderNotes(); return;
      }
      break;
    case 'journal':
      if(journal.some(x=>x.id===l.id)){
        journalState = {mode:'detail', id:l.id}; notesState = {mode:'list'};
        gotoHub('read'); renderJournal(); return;
      }
      break;
    case 'quiz':
      if(quizzes.some(x=>x.id===l.id)){
        quizzesState = {mode:'detail', id:l.id};
        gotoHub('activities'); renderQuizzes(); return;
      }
      break;
    case 'hub':
      gotoHub(l.section === 'activities' ? 'activities' : 'read'); return;
    case 'activity':
      notebookState = {mode:'list'}; quizzesState = {mode:'list'};
      gotoHub('activities'); return;
    case 'market':
      marketState = {mode:'list'}; marketSection = 'shop'; switchTab('market'); renderMarket(); return;
    case 'bag':
      marketState = {mode:'list'}; marketSection = 'bag'; switchTab('market'); renderMarket(); return;
    case 'event':
      if(l.date){ const [y,m] = String(l.date).split('-').map(Number); if(y && m) calCursor = {y, m:m-1}; calSelected = l.date; }
      switchTab('home'); renderHome();
      scrollToSelector('.cal-card'); return;
  }
  notifSheetId = id;
  renderHome();
}
function closeNotifSheet(ev){
  if(ev && ev.target !== ev.currentTarget) return;   // only the backdrop closes it
  notifSheetId = null;
  renderHome();
}
function scrollToSelector(sel){
  requestAnimationFrame(()=>{
    const el = document.querySelector(sel);
    if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  });
}
function notifSheetHtml(){
  if(!notifSheetId) return '';
  const n = notifications.find(x=>x.id===notifSheetId);
  if(!n) return '';
  const gone = n.link && n.link.type && ['lesson','journal','quiz'].includes(n.link.type);
  return `
    <div class="notif-sheet" onclick="closeNotifSheet(event)">
      <div class="notif-sheet-card">
        <p class="notif-sheet-kind">แจ้งเตือน</p>
        <p class="notif-sheet-title">${escapeHtml(n.title)}</p>
        <p class="notif-sheet-body">${escapeHtml(n.body) || '<span style="color:var(--ink-soft)">ไม่มีรายละเอียดเพิ่มเติม</span>'}</p>
        <p class="notif-sheet-time">${fmtShortDate(n.createdAt)}${gone ? ' · สิ่งที่อ้างถึงถูกลบไปแล้ว' : ''}</p>
        <div class="row-actions">
          <button class="btn btn-primary btn-sm" onclick="notifSheetId=null; renderHome();">ปิด</button>
          <button class="btn btn-danger btn-sm" onclick="notifSheetId=null; dismissNotification('${n.id}', event)">ลบแจ้งเตือนนี้</button>
        </div>
      </div>
    </div>`;
}
function unreadCount(){ return notifications.filter(n=>!n.read).length; }
function markNotificationRead(id){
  const n = notifications.find(x=>x.id===id);
  if(n && !n.read){ n.read = true; saveNotifications(); renderHome(); renderJournal(); }
}
function dismissNotification(id, ev){
  if(ev) ev.stopPropagation();
  const i = notifications.findIndex(x=>x.id===id);
  if(i===-1) return;
  notifications.splice(i,1);
  saveNotifications();
  renderHome(); renderJournal();
}
function markAllNotificationsRead(){
  notifications.forEach(n=> n.read = true);
  saveNotifications(); renderHome(); renderJournal();
}
function clearAllNotifications(){
  notifications = [];

/* A once-a-day nudge about anything still outstanding, so the board
   reminds without spamming a new note on every page load. */
function maybeDailyNudge(){
  const today = new Date().toISOString().slice(0,10);
  if(notifications.some(n=> n.kind==='nudge' && String(n.createdAt).slice(0,10)===today)) return;
  const pending = computeSuggestions();
  if(!pending.length) return;
  pushNotification('nudge', 'ยังมี ' + pending.length + ' อย่างค้างอยู่',
    pending.slice(0,2).map(p=>p.title).join(' · '), {type:'hub', section:'read'});
}

   HOME DASHBOARD
   ========================================================= */
function computeStats(){
  const totalNotes = notes.length;
  const completedNotes = notes.filter(n=>n.completed).length;
  const overallPct = totalNotes ? Math.round(completedNotes/totalNotes*100) : 0;
  const perLang = ['en','zh'].map(key=>{
    const langNotes = notes.filter(n=>(n.lang||'en')===key);
    const langCompleted = langNotes.filter(n=>n.completed).length;
    const langQuizzes = quizzes.filter(q=>(q.lang||'en')===key);
    const attempted = langQuizzes.filter(q=>q.bestScore!=null);
    const avgScore = attempted.length ? Math.round(attempted.reduce((s,q)=> s + (q.bestScore/q.bestTotal*100),0)/attempted.length) : null;
    return { key, label:LANGS[key].label, total:langNotes.length, completed:langCompleted,
      pct: langNotes.length ? Math.round(langCompleted/langNotes.length*100) : 0, avgScore, quizCount:langQuizzes.length };
  });
  return { totalNotes, completedNotes, overallPct, perLang };
}

function computeStreak(){
  const dates = new Set();
  notes.forEach(n=>{ if(n.updatedAt) dates.add(new Date(n.updatedAt).toDateString()); });
  quizzes.forEach(q=>{ if(q.lastAttemptDate) dates.add(new Date(q.lastAttemptDate).toDateString()); });
  let streak = 0;
  const cursor = new Date();
  while(dates.has(cursor.toDateString())){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeSuggestions(){
  const items = [];
  [...notes].filter(n=>!n.completed).sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,3).forEach(n=>{
    items.push({ kind:'note', id:n.id, title:n.title, lang:n.lang||'en', label:'ยังไม่ได้เรียน' });
  });
  // "no quiz yet" now means: no quiz shares a tag with this note (tags are the link).
  notes.filter(n=>{
    if(!n.completed) return false;
    const keys = itemTags(n).map(normTag).filter(Boolean);
    if(!keys.length) return true;
    return !quizzes.some(q=> keys.some(k=> hasTag(q, k)));
  }).slice(0,2).forEach(n=>{
    items.push({ kind:'note', id:n.id, title:n.title, lang:n.lang||'en', label:'ยังไม่มีแบบทดสอบ' });
  });
  quizzes.filter(q=>q.bestScore===null).slice(0,2).forEach(q=>{
    items.push({ kind:'quiz', id:q.id, title:q.title, lang:q.lang||'en', label:'ยังไม่ได้ทำ' });
  });
  return items.slice(0,5);
}

    : `notesState={mode:'detail', id:'${item.id}'}; renderNotes(); gotoHub('read');`;
}

/* =========================================================
   CLAUDE'S OUTBOX
   Claude reads your Drive file, does what you asked for, and
   writes the result into `claude-outbox.json` published next
   to this page. The app polls it and carries each action out
   here, in the app, exactly once.
   ========================================================= */
const OUTBOX_URL = 'claude-outbox.json';
const OUTBOX_POLL_MS = 30000;
let outboxTimer = null;
/* ---- Claude's outbox ----
   A small JSON file published beside this page. Each entry is one
   action; the id keeps it from ever being carried out twice. */
async function checkClaudeOutbox(){
  let payload;
  try{
    const res = await fetch(OUTBOX_URL + '?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) return;
    payload = await res.json();
  }catch(e){ return; }                      // offline or not published yet

  const actions = Array.isArray(payload && payload.actions) ? payload.actions : [];
  const fresh = actions.filter(a => a && a.id && !appliedActions.includes(a.id));
  if(!fresh.length) return;

  let changed = false;
  fresh.forEach(a=>{
    try{ if(applyClaudeAction(a)){ appliedActions.push(a.id); changed = true; } }
    catch(e){ /* a malformed entry must not take the app down */ }
  });
  if(!changed) return;

  scheduleSave();
  renderAll();
  showToast('Claude ทำให้แล้ว');
}

function applyClaudeAction(a){
  const at = a.at || new Date().toISOString();
  switch(a.type){
    case 'note': {
      const jid = uid();
      journal.push({ id:jid, title:a.title || 'โน้ตจาก Claude', content:a.content || '', tags:parseTags((a.tags||[]).join(' ')), updatedAt:at });
      pushNotification('claude', 'Claude เพิ่มโน้ตให้', a.title || '', {type:'journal', id:jid});
      return true;
    }
    case 'lesson': {
      const nid = uid();
      notes.push({ id:nid, title:a.title || 'บทเรียนจาก Claude', lang:a.lang === 'zh' ? 'zh' : 'en', format:'freeform',
                   content:a.content || '', tags:parseTags((a.tags||[]).join(' ')), entries:[], completed:false, updatedAt:at });
      pushNotification('claude', 'Claude เพิ่มบทเรียนให้', a.title || '', {type:'lesson', id:nid});
      return true;
    }
    case 'event':
      events.push({ id:uid(), date:a.date || todayInputValue(), title:a.title || 'อีเวนต์จาก Claude', note:a.note || '', createdAt:at });
      pushNotification('claude', 'Claude เพิ่มอีเวนต์ในปฏิทิน', `${a.date || ''} · ${a.title || ''}`, {type:'event', date:a.date || todayInputValue()});
      return true;
    case 'notify':
      pushNotification('claude', a.title || 'ข้อความจาก Claude', a.body || '');   // no target: opens its own full text
      return true;
    case 'activity': {
      // Same rule as setting one up by hand: this only sets the task up.
      // The points are for doing it, so they wait for "ทำเสร็จแล้ว".
      const pts = Math.max(0, Math.round(Number(a.points) || 0));
      wallet.activities.push({ id:uid(), title:a.title || 'ภารกิจจาก Claude', kind:a.kind || 'other', points:pts,
        date:a.date || todayInputValue(), repeat:REPEATS.some(r=>r.key===a.repeat) ? a.repeat : 'none',
        doneDates:[], createdAt:at });
      saveWallet();
      pushNotification('claude', 'Claude ตั้งภารกิจให้', `${a.title || ''}${pts ? ' · ทำเสร็จแล้วได้ ' + fmtPoints(pts) + ' แต้ม' : ''}`, {type:'activity'});
      return true;
    }
    default: return false;
  }
}

function startOutboxWatch(){
  if(outboxTimer) return;
  checkClaudeOutbox();
  outboxTimer = setInterval(()=>{ if(document.visibilityState === 'visible') checkClaudeOutbox(); }, OUTBOX_POLL_MS);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') checkClaudeOutbox(); });
}

/* =========================================================
   CALENDAR — what happened on a day, and what is coming up
   Nothing new is recorded twice: activities, redemptions,
   finished lessons and quiz attempts are read off the data
   they already carry. `events` holds the ones typed by hand.
   ========================================================= */
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                   'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const EVENT_KIND_LABEL = { activity:'กิจกรรม', due:'ถึงรอบทำซ้ำ', market:'แลกของรางวัล', lesson:'บทเรียน', quiz:'แบบฝึกหัด', custom:'อีเวนต์' };

let calCursor = null;      // {y, m} of the month on screen
let calSelected = null;    // 'YYYY-MM-DD'
let draftEvent = null;     // the inline "add an event" form, when open

function dayKeyOf(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function isoToDayKey(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso).slice(0,10) : dayKeyOf(d);
}
function thaiDayLabel(key){
  const [y,m,d] = String(key).split('-').map(Number);
  if(!y || !m || !d) return key;
  return `${d} ${TH_MONTHS[m-1]} ${y+543}`;
}

/* Every dated thing in the app, bucketed by day. */
function eventsByDay(){
  const map = {};
  const put = (key, ev) => { if(!key) return; (map[key] = map[key] || []).push(ev); };
  if(wallet){
    wallet.activities.forEach(a => {
      doneDatesOf(a).forEach(d => put(d, { kind:'activity', title:a.title, meta:`+${fmtPoints(a.points)} แต้ม · ${kindLabel(a.kind)}` }));
      const due = nextDueDate(a);
      if(due) put(due, { kind:'due', title:'ถึงรอบ: ' + a.title, meta:repeatLabel(a.repeat) });
    });
    wallet.redemptions.forEach(r => put(isoToDayKey(r.redeemedAt), { kind:'market', title:'แลก ' + r.name, meta:`-${fmtPoints(r.price)} แต้ม` }));
  }
  notes.filter(n => n.completed).forEach(n => put(isoToDayKey(n.completedAt || n.updatedAt), { kind:'lesson', title:'เรียนจบ: ' + n.title, meta:'' }));
  journal.filter(j => j.completed).forEach(j => put(isoToDayKey(j.completedAt || j.updatedAt), { kind:'lesson', title:'อ่านจบ: ' + j.title, meta:'' }));
  quizzes.filter(q => q.lastAttemptDate).forEach(q => put(isoToDayKey(q.lastAttemptDate),
    { kind:'quiz', title:'ทำแบบฝึกหัด: ' + q.title, meta: q.bestScore!=null ? `ได้ ${q.bestScore}/${q.bestTotal}` : '' }));
  events.forEach(e => put(e.date, { kind:'custom', title:e.title, meta:e.note || '', id:e.id }));
  return map;
}

function calMonthOnScreen(){
  if(calCursor) return calCursor;
  const t = new Date();
  calCursor = { y:t.getFullYear(), m:t.getMonth() };
  return calCursor;
}
function shiftCalendar(delta){
  const c = calMonthOnScreen();
  const d = new Date(c.y, c.m + delta, 1);
  calCursor = { y:d.getFullYear(), m:d.getMonth() };
  renderHome();
}
function calendarToday(){
  const t = new Date();
  calCursor = { y:t.getFullYear(), m:t.getMonth() };
  calSelected = dayKeyOf(t);
  renderHome();
}
function selectCalendarDay(key){
  calSelected = key;
  if(draftEvent) draftEvent.date = key;
  renderHome();
}

function saveEvents(){ scheduleSave(); }
function openEventForm(){
  draftEvent = { date: calSelected || dayKeyOf(new Date()), title:'', note:'' };
  renderHome();
  const input = document.getElementById('event-title-input');
  if(input) input.focus();
}
function cancelEventForm(){ draftEvent = null; renderHome(); }
function saveEventForm(){
  const title = (draftEvent.title || '').trim();
  if(!title){ showToast('ใส่ชื่ออีเวนต์ก่อนบันทึก'); return; }
  const date = draftEvent.date || dayKeyOf(new Date());
  events.push({ id:uid(), date, title, note:(draftEvent.note || '').trim(), createdAt:new Date().toISOString() });
  const [y,m] = date.split('-').map(Number);
  calCursor = { y, m:m-1 };
  calSelected = date;
  draftEvent = null;
  saveEvents();
  renderHome();
  showToast('เพิ่มอีเวนต์ในปฏิทินแล้ว');
}
function deleteEvent(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยัน?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบ'; } }, 3000);
    return;
  }
  const i = events.findIndex(e => e.id === id);
  if(i === -1) return;
  events.splice(i,1);
  saveEvents();
  renderHome();
  showToast('ลบอีเวนต์แล้ว');
}

function calendarHtml(){
  const { y, m } = calMonthOnScreen();
  const todayKey = dayKeyOf(new Date());
  const map = eventsByDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const lead = new Date(y, m, 1).getDay();
  const pad = n => String(n).padStart(2,'0');

  let cells = '';
  for(let i=0; i<lead; i++) cells += `<span class="cal-day blank"></span>`;
  let daysWithEvents = 0;
  for(let d=1; d<=daysInMonth; d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const evs = map[key] || [];
    if(evs.length) daysWithEvents++;
    const kinds = [...new Set(evs.map(e=>e.kind))].slice(0,3);
    const cls = [key===todayKey ? 'today' : '', key===calSelected ? 'selected' : ''].filter(Boolean).join(' ');
    cells += `
      <button type="button" class="cal-day ${cls}" onclick="selectCalendarDay('${key}')"
              aria-label="${d} ${TH_MONTHS[m]}${evs.length ? ' · ' + evs.length + ' อีเวนต์' : ''}">
        <span>${d}</span>
        <span class="cal-dots">${kinds.map(k=>`<span class="cal-dot ${k}"></span>`).join('')}</span>
      </button>`;
  }

  const openKey = calSelected || todayKey;
  const openEvents = map[openKey] || [];
  const form = draftEvent ? `
    <div class="form-block" style="margin-top:10px;">
      <div class="field">
        <label>ชื่ออีเวนต์</label>
        <input type="text" id="event-title-input" placeholder="เช่น สอบปลายภาค" value="${escapeHtml(draftEvent.title)}" oninput="draftEvent.title=this.value">
      </div>
      <div class="field">
        <label>รายละเอียด (ถ้ามี)</label>
        <input type="text" placeholder="เช่น ห้อง 302 บ่ายสอง" value="${escapeHtml(draftEvent.note)}" oninput="draftEvent.note=this.value">
      </div>
      <div class="field">
        <label>วันที่</label>
        <input type="date" value="${escapeHtml(draftEvent.date)}" oninput="draftEvent.date=this.value">
      </div>
      <div class="row-actions">
        <button class="btn btn-primary btn-sm" onclick="saveEventForm()">บันทึกไว้</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelEventForm()">ยกเลิก</button>
      </div>
    </div>` : '';

  return `
    <p class="mini-label">ปฏิทิน</p>
    <div class="cal-card">
      <div class="cal-head">
        <p class="cal-title">${TH_MONTHS[m]} ${y+543}</p>
        <span class="cal-nav">
          <button type="button" onclick="shiftCalendar(-1)" aria-label="เดือนก่อนหน้า">‹</button>
          <button type="button" onclick="calendarToday()">วันนี้</button>
          <button type="button" onclick="shiftCalendar(1)" aria-label="เดือนถัดไป">›</button>
        </span>
      </div>
      <div class="cal-grid">
        ${TH_DOW.map(d=>`<span class="cal-dow">${d}</span>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        <span><i class="cal-dot activity"></i>กิจกรรม</span>
        <span><i class="cal-dot lesson"></i>บทเรียน</span>
        <span><i class="cal-dot quiz"></i>แบบฝึกหัด</span>
        <span><i class="cal-dot market"></i>แลกของ</span>
        <span><i class="cal-dot custom"></i>อีเวนต์</span>
        <span><i class="cal-dot due"></i>ถึงรอบ</span>
      </div>
      <div class="cal-day-panel">
        <div class="cal-day-head">
          <p class="cal-day-title">${thaiDayLabel(openKey)}${openKey===todayKey ? ' · วันนี้' : ''}</p>
          ${draftEvent ? '' : `<button class="btn btn-ghost btn-sm" onclick="openEventForm()">+ เพิ่มอีเวนต์</button>`}
        </div>
        ${openEvents.length === 0
          ? `<p class="cal-empty">วันนี้ไม่มีอีเวนต์</p>`
          : `<div>${openEvents.map(e=>`
              <div class="cal-event">
                <span class="cal-dot ${e.kind}"></span>
                <div class="cal-event-body">
                  <p class="cal-event-title">${escapeHtml(e.title)}</p>
                  <p class="cal-event-meta">${EVENT_KIND_LABEL[e.kind]}${e.meta ? ' · ' + escapeHtml(e.meta) : ''}</p>
                </div>
                ${e.kind==='custom' ? `<button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.id}', this)">ลบ</button>` : ''}
              </div>`).join('')}</div>`}
        ${form}
      </div>
      <p class="cal-empty" style="margin:10px 0 0;">เดือนนี้มี ${daysWithEvents} วันที่มีอีเวนต์</p>
    </div>`;
}

function renderHome(){
  const el = document.getElementById('view-home');
  if(!el || !wallet) return;

  // The wallet and the board lead the page and always show, even before
  // there are any lessons to summarise.
  const head = balanceCardHtml(
    wallet.activities.length
      ? `จาก ${wallet.activities.length} กิจกรรม · แลกไปแล้ว ${wallet.redemptions.length} รายการ`
      : 'บันทึกกิจกรรมในแท็บโน้ต › กิจกรรม เพื่อเริ่มสะสมแต้ม'
  ) + stickyBoardHtml();

  if(notes.length===0 && quizzes.length===0){
    el.innerHTML = head + `
      <div class="empty">
        <div class="doodle">📊</div>
        <p>ยังไม่มีบทเรียนให้สรุป เริ่มเพิ่มบทเรียนแรกก่อนนะ</p>
        <button class="btn btn-primary" onclick="gotoHub('read'); openNewNoteForm();">+ เพิ่มบทเรียนแรก</button>
      </div>` + calendarHtml();
    return;
  }
  const stats = computeStats();
  const r = 54, circumference = 2*Math.PI*r;
  const dashOffset = circumference * (1 - stats.overallPct/100);

  const noteEvents = notes.map(n=>({type:'note', date:n.updatedAt, title:n.title, lang:n.lang||'en', id:n.id}));
  const quizEvents = quizzes.filter(q=>q.lastAttemptDate).map(q=>({type:'quiz', date:q.lastAttemptDate, title:q.title, lang:q.lang||'en', id:q.id, score:q.bestScore, total:q.bestTotal}));
  const activity = [...noteEvents, ...quizEvents].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,6);
  const suggestions = computeSuggestions();
  const streak = computeStreak();

  el.innerHTML = `
    ${head}
    <h2 class="section-title">ภาพรวมการเรียน</h2>
    <p class="section-sub">สรุปความคืบหน้าและคะแนนของคุณ</p>
    <div class="progress-ring-wrap">
      <div class="progress-ring">
        <svg viewBox="0 0 120 120">
          <circle class="bg" cx="60" cy="60" r="${r}"></circle>
          <circle class="fg" cx="60" cy="60" r="${r}" stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"></circle>
        </svg>
        <div class="progress-ring-text">
          <div class="big">${stats.overallPct}%</div>
          <div class="small">${stats.completedNotes}/${stats.totalNotes}<br>บทเรียนที่เรียนแล้ว</div>
        </div>
      </div>
    </div>
    <div class="streak-row">${streak>0 ? `<strong>${streak}</strong> วันติดต่อกันที่มีการเรียนหรือทำแบบทดสอบ` : 'ยังไม่มีความต่อเนื่องของวันนี้ — เริ่มวันนี้เลย'}</div>
    <p class="mini-label">ความคืบหน้าแยกตามภาษา</p>
    ${stats.perLang.map(l=>`
      <div class="lang-progress-row">
        <div class="lang-progress-head">
          <span>${l.label} · ${l.completed}/${l.total} บทเรียน</span>
          <span>${l.avgScore!=null ? `คะแนนเฉลี่ย ${l.avgScore}%` : (l.quizCount? 'ยังไม่ได้ทำแบบทดสอบ' : '')}</span>
        </div>
        <div class="lang-progress-bar"><div class="lang-progress-fill ${l.key}" style="width:${l.pct}%;"></div></div>
      </div>`).join('')}
    ${(function(){
      const tags = allTags();
      if(!tags.length) return '';
      return `
        <p class="mini-label">หมวดหมู่ทั้งหมด (${tags.length})</p>
        <div class="tag-row">
          ${tags.map(t=>`
            <button type="button" class="tag-chip counted" onclick="filterNotesByTag('${escapeHtml(t.key).replace(/'/g,"\\'")}')">
              #${escapeHtml(t.tag)}<span class="tag-count">${t.total}</span>
            </button>`).join('')}
        </div>`;
    })()}
    <p class="mini-label">ควรทำต่อวันนี้</p>
    ${suggestions.length===0 ? `<p style="color:var(--ink-soft); font-size:13.5px;">เรียบร้อยดีมาก ไม่มีบทเรียนหรือแบบทดสอบค้างแล้ว 🎉</p>` : `
    <div class="cards">
      ${suggestions.map(it=>`
        <div class="activity-item" onclick="${suggestionClickAttr(it)}">
          <div class="activity-left">
            <p class="activity-title">${escapeHtml(it.title)}${langBadge(it.lang)}</p>
          </div>
          <span class="activity-type">${it.label}</span>
        </div>`).join('')}
    </div>`}
    <p class="mini-label">กิจกรรมล่าสุด</p>
    ${activity.length===0 ? `<p style="color:var(--ink-soft); font-size:13.5px;">ยังไม่มีกิจกรรม</p>` : `
    <div class="cards">
      ${activity.map(a=>`
        <div class="activity-item" onclick="${a.type==='note' ? `notesState={mode:'detail',id:'${a.id}'}; renderNotes(); gotoHub('read');` : `quizzesState={mode:'detail',id:'${a.id}'}; renderQuizzes(); gotoHub('activities');`}">
          <div class="activity-left">
            <p class="activity-title">${escapeHtml(a.title)}${langBadge(a.lang)}</p>
            <p class="activity-meta">${fmtShortDate(a.date)}${a.type==='quiz' ? ` · ได้ ${a.score}/${a.total}` : ''}</p>
          </div>
          <span class="activity-type">${a.type==='note' ? 'บทเรียน' : 'แบบทดสอบ'}</span>
        </div>`).join('')}
    </div>`}
    ${calendarHtml()}`;
}

        </div>
      </div>` : `
      <div id="vocab-blocks">${draftNote.entries.map((e,i)=>renderVocabBlock(e,i)).join('')}</div>
      <div class="row-actions" style="margin-bottom:16px;">

      </div>`}

      <button class="btn btn-ghost" onclick="cancelNoteForm()">ยกเลิก</button>
    </div>`;
}

function saveNoteForm(){
  const title = (draftNote.title||'').trim() || 'ไม่มีหัวข้อ';
  if(draftNote.format==='freeform'){
    if(!draftNote.content.trim()){ showToast('กรุณาใส่เนื้อหาก่อนบันทึก'); return; }
  }else{
    const validEntries = draftNote.entries.filter(e=> e.word.trim() && e.meaning.trim());
    if(validEntries.length===0){ showToast('กรุณาใส่คำศัพท์อย่างน้อย 1 คำ พร้อมความหมาย'); return; }
    draftNote.entries = validEntries.map(e=>({...e, word:e.word.trim(), reading:e.reading.trim(), meaning:e.meaning.trim(), example:e.example.trim()}));
  }
  const tags = parseTags((draftNote.tags||[]).join(' '));
  const points = Math.max(0, Math.round(Number(draftNote.points) || 0));
  if(editingNoteId){
    const n = notes.find(x=>x.id===editingNoteId);
    if(!rebalanceReadPoints(n, points, title)) return;
    Object.assign(n, { title, lang:draftNote.lang, format:draftNote.format, content:draftNote.content, tags, entries:draftNote.entries, points, updatedAt:new Date().toISOString() });
  }else{
    notes.push({ id:uid(), title, lang:draftNote.lang, format:draftNote.format, content:draftNote.content, tags, entries:draftNote.entries, points, completed:false, updatedAt:new Date().toISOString() });
  }
  saveNotes();
  noteFormSnapshot = null;
  notesState = editingNoteId ? {mode:'detail', id:editingNoteId} : {mode:'list'};
  renderNotes();
  showToast('บันทึกเรียบร้อยแล้ว');
}

/* Reading earns points the same way doing a task does: the amount is set on
   the item, and it is paid once, when you mark it read. Lessons and free
   notes are two collections but one rule, so it lives here once. */
const READ_POINTS_DEFAULT = 10;
function readPointsOf(it){
  const v = it && it.points;
  return v == null ? READ_POINTS_DEFAULT : Math.max(0, Math.round(Number(v) || 0));
}
/* What this item actually paid. Items marked read before points were
   settable stored `true`, and back then the rate was the default. */
function paidReadPoints(it){
  const p = it && it.pointsAwarded;
  if(!p) return 0;
  return p === true ? READ_POINTS_DEFAULT : Math.max(0, Math.round(Number(p) || 0));
}
function readCollection(kind){ return kind === 'journal' ? journal : notes; }
function saveRead(kind){ return kind === 'journal' ? saveJournal() : saveNotes(); }
function renderRead(kind){ return kind === 'journal' ? renderJournal() : renderNotes(); }

function toggleReadDone(kind, id){
  const it = readCollection(kind).find(x => x.id === id);
  if(!it) return;
  it.completed = !it.completed;
  // Reading pays out once. Un-ticking doesn't claw the points back, and
  // re-ticking doesn't pay twice.
  if(it.completed && !it.completedAt) it.completedAt = new Date().toISOString();
  if(it.completed && !it.pointsAwarded){
    const pts = readPointsOf(it);
    it.pointsAwarded = pts || true;          // remember what was paid
    if(pts > 0){
      addPoints(pts, 'อ่านจบ: ' + it.title, 'notebook');
      pushNotification('points', '+' + fmtPoints(pts) + ' แต้ม', 'อ่านจบ: ' + it.title, {type:kind, id:it.id});
    }
    showToast(pts > 0 ? 'อ่านจบแล้ว +' + fmtPoints(pts) + ' แต้ม' : 'อ่านจบแล้ว');
  }
  saveRead(kind);
  renderRead(kind);
  renderHome();
}
/* Changing the value after it has already paid settles the difference, so
   the ledger keeps matching what the item says it is worth. */
function rebalanceReadPoints(it, newPoints, label){
  const paid = paidReadPoints(it);
  if(!paid) return true;
  const diff = newPoints - paid;
  if(!diff) return true;
  if(diff > 0) addPoints(diff, 'แก้ไข: ' + label, 'notebook');
  else if(!spendPoints(-diff, 'แก้ไข: ' + label, 'notebook')){
    showToast('ลดคะแนนไม่ได้ เพราะคะแนนคงเหลือไม่พอ'); return false;
  }
  it.pointsAwarded = newPoints || true;
  return true;
}
/* Deleting something that already paid takes the points back, so a note
   cannot be read, deleted and read again for more. */
function reclaimReadPoints(it, label){
  const paid = paidReadPoints(it);
  if(!paid) return true;
  if(!spendPoints(paid, 'ลบ: ' + label, 'notebook')){
    showToast('ลบไม่ได้ เพราะคะแนนคงเหลือไม่พอจะหักคืน'); return false;
  }
  return true;
}
function toggleNoteCompleted(id){ toggleReadDone('lesson', id); }

/* ---- Flashcard review (vocab notes) ---- */
function startFlashcards(noteId){
  const note = notes.find(n=>n.id===noteId);
  if(!note || !note.entries || !note.entries.length) return;
  const order = note.entries.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  flashState = { noteId, order, pos:0, revealed:false };
  notesState = { mode:'flash', id:noteId };
  renderNotes();
}
function flipFlashcard(){ flashState.revealed = !flashState.revealed; renderNotes(); }
function nextFlashcard(){
  if(flashState.pos < flashState.order.length-1){
    flashState.pos++; flashState.revealed = false; renderNotes();
  } else {
    const noteId = flashState.noteId;
    flashState = null;
    notesState = { mode:'detail', id:noteId };
    renderNotes();
    showToast('ทบทวนครบทุกคำแล้ว');
  }
}
function prevFlashcard(){
  if(flashState.pos > 0){ flashState.pos--; flashState.revealed = false; renderNotes(); }
}
function renderFlashcards(){
  const el = document.getElementById('view-notes');
  const note = notes.find(n=>n.id===flashState.noteId);
  if(!note){ flashState=null; notesState={mode:'list'}; renderNotes(); return; }
  const entry = note.entries[flashState.order[flashState.pos]];
  el.innerHTML = `
    <button class="back-link" onclick="flashState=null; notesState={mode:'detail', id:'${note.id}'}; renderNotes();">‹ ออกจากการทบทวน</button>
    <h2 class="detail-title">${escapeHtml(note.title)}</h2>
    <p class="flash-progress">คำที่ ${flashState.pos+1} / ${flashState.order.length}</p>
    <div class="flashcard ${flashState.revealed?'is-flipped':''}" onclick="flipFlashcard()">
      <div class="flashcard-word">${escapeHtml(entry.word)}</div>
      <div class="flashcard-back">
        ${entry.reading?`<div class="vocab-reading">${escapeHtml(entry.reading)}</div>`:''}
        <p class="vocab-meaning">${escapeHtml(entry.meaning)}</p>
        ${entry.example?`<p class="vocab-example">${escapeHtml(entry.example)}</p>`:''}
      </div>
    </div>
    <p class="flashcard-hint">แตะการ์ดเพื่อดูความหมาย</p>
    <div class="row-actions">
      <button class="btn btn-ghost" onclick="prevFlashcard()" ${flashState.pos===0?'disabled':''}>‹ ก่อนหน้า</button>
      <button class="btn btn-primary" onclick="nextFlashcard()">${flashState.pos===flashState.order.length-1?'จบการทบทวน':'ถัดไป ›'}</button>
    </div>`;
}

function confirmDeleteNote(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบบทเรียนนี้'; } }, 3000);
    return;
  }
  const idx = notes.findIndex(n=>n.id===id);
  if(idx===-1) return;
  const removed = notes[idx];
  const paid = paidReadPoints(removed);
  if(!reclaimReadPoints(removed, removed.title)) return;
  notes.splice(idx,1);
  saveNotes();
  notesState = {mode:'list'};
  renderNotes(); renderHome();
  showToast('ลบบทเรียนแล้ว' + (paid ? ' -' + fmtPoints(paid) + ' แต้ม' : ''), ()=>{
    notes.splice(idx,0,removed);
    if(paid) addPoints(paid, 'กู้คืน: ' + removed.title, 'notebook');
    saveNotes();
    notesState = {mode:'detail', id};
    renderNotes(); renderHome();
  });
}

function renderNotes(){ renderHub(); pushHistoryState(); }
function renderNotesImpl(){
  const el = document.getElementById('view-notes');

  if(notesState.mode === 'form'){ renderNoteForm(); return; }
  if(notesState.mode === 'flash'){ renderFlashcards(); return; }

  if(notesState.mode === 'detail'){
    const note = notes.find(n=>n.id===notesState.id);
    if(!note){ notesState={mode:'list'}; renderNotes(); return; }
    const bodyHtml = note.format==='vocab'
      ? note.entries.map(e=>`
          <div class="vocab-card">
            <div><span class="vocab-word">${escapeHtml(e.word)}</span>${e.reading?`<span class="vocab-reading">${escapeHtml(e.reading)}</span>`:''}</div>
            <p class="vocab-meaning">${escapeHtml(e.meaning)}</p>
            ${e.example?`<p class="vocab-example">${escapeHtml(e.example)}</p>`:''}
          </div>`).join('')
      : `<div class="detail-content">${mdToHtml(note.content)}</div>`;
    el.innerHTML = `
      <button class="back-link" onclick="notesState={mode:'list'}; renderNotes();">‹ กลับ</button>
      <h2 class="detail-title">${escapeHtml(note.title)}${langBadge(note.lang||'en')}${note.completed?'<span class="check-mark">✓</span>':''}</h2>
      <p class="detail-meta">แก้ไขล่าสุด ${fmtShortDate(note.updatedAt)}</p>
      ${tagChipsHtml(itemTags(note), 'filterNotesByTag')}
      ${bodyHtml}
      <div class="row-actions" style="margin-top:16px;">
        ${note.format==='vocab' && note.entries.length ? `<button class="btn btn-highlight" onclick="startFlashcards('${note.id}')">ทบทวนคำศัพท์ (flashcard)</button>` : ''}
        <button class="btn btn-complete ${note.completed?'is-done':''}" onclick="toggleNoteCompleted('${note.id}')">${note.completed? 'เรียนแล้ว ✓' : 'อ่านจบแล้ว +' + fmtPoints(readPointsOf(note)) + ' แต้ม'}</button>
        <button class="btn btn-ghost" onclick="openEditNoteForm('${note.id}')">แก้ไข</button>
        <button class="btn btn-danger" id="del-note-btn" onclick="confirmDeleteNote('${note.id}', this)">ลบบทเรียนนี้</button>
      </div>
      ${relatedHtml(note, 'note')}`;
    return;
  }
  // Nothing else to draw: the list case is renderReadList's job.
}

const QUIZ_POINTS_PER_CORRECT = 5;
function newDraftQuiz(){ return { title:'', lang:'en', tags:[], questions:[ {text:'', options:['',''], correct:0} ] }; }

function renderQuizzes(){ renderHub(); pushHistoryState(); }
function renderQuizzesImpl(){

}

}
function cancelQuizForm(){ quizFormSnapshot = null; quizzesState = editingQuizId ? {mode:'detail', id:editingQuizId} : {mode:'list'}; renderQuizzes(); }
function setDraftQuizLang(k){ draftQuiz.lang = k; renderQuizForm(); }

    <button class="back-link" onclick="cancelQuizForm()">‹ กลับ</button>
    <div class="form-block">
      <div class="field">
        <label>ชื่อแบบทดสอบ</label>

      </div>
      <div class="field">
        <label>หมวดภาษา</label>

        </div>

    </div>

function renderQuestionBlock(q, qi){
  return `
    <div class="q-block">
      <div class="q-block-head">
        <span>คำถามที่ ${qi+1}</span>
        ${draftQuiz.questions.length>1 ? `<button class="opt-remove" onclick="removeQuestion(${qi})">✕ ลบคำถาม</button>` : ''}
      </div>
      <div class="field">
        <input type="text" placeholder="พิมพ์คำถาม" value="${escapeHtml(q.text)}" oninput="draftQuiz.questions[${qi}].text=this.value">
      </div>
      ${q.options.map((opt,oi)=>`
        <div class="opt-row">
          <input type="radio" name="correct-${qi}" ${q.correct===oi?'checked':''} onchange="draftQuiz.questions[${qi}].correct=${oi}" title="ทำเครื่องหมายว่าเป็นคำตอบที่ถูก">
          <input type="text" placeholder="ตัวเลือกที่ ${oi+1}" value="${escapeHtml(opt)}" oninput="draftQuiz.questions[${qi}].options[${oi}]=this.value">
          ${q.options.length>2 ? `<button class="opt-remove" onclick="removeOption(${qi},${oi})">✕</button>` : ''}
        </div>`).join('')}
      ${q.options.length<6 ? `<button class="btn btn-ghost btn-sm" onclick="addOption(${qi})">+ เพิ่มตัวเลือก</button>` : ''}
    </div>`;
}

function addQuestion(){ draftQuiz.questions.push({text:'', options:['',''], correct:0}); renderQuizForm(); }
function removeQuestion(qi){ draftQuiz.questions.splice(qi,1); renderQuizForm(); }
function addOption(qi){ draftQuiz.questions[qi].options.push(''); renderQuizForm(); }
function removeOption(qi, oi){
  draftQuiz.questions[qi].options.splice(oi,1);
  if(draftQuiz.questions[qi].correct >= draftQuiz.questions[qi].options.length){ draftQuiz.questions[qi].correct = 0; }
  renderQuizForm();
}

function saveQuizForm(){
  const title = draftQuiz.title.trim();
  if(!title){ showToast('กรุณาตั้งชื่อแบบทดสอบ'); return; }
  for(let i=0;i<draftQuiz.questions.length;i++){
    const q = draftQuiz.questions[i];
    if(!q.text.trim()){ showToast(`กรุณาใส่คำถามที่ ${i+1}`); return; }
    if(q.options.some(o=>!o.trim())){ showToast(`กรุณากรอกตัวเลือกให้ครบในคำถามที่ ${i+1}`); return; }
  }
  const questions = draftQuiz.questions.map(q=>({ id:uid(), text:q.text.trim(), options:q.options.map(o=>o.trim()), correctIndex:q.correct }));
  const qTags = parseTags((draftQuiz.tags||[]).join(' '));
  if(editingQuizId){
    const existing = quizzes.find(x=>x.id===editingQuizId);
    existing.title = title; existing.lang = draftQuiz.lang; existing.questions = questions;
    existing.tags = qTags;
    quizzesState = {mode:'detail', id:editingQuizId};
  }else{
    const id = uid();
    quizzes.push({ id, title, lang:draftQuiz.lang, tags:qTags, questions, bestScore:null, bestTotal:null, lastAttemptDate:null });
    quizzesState = {mode:'detail', id};
  }
  saveQuizzes();
  quizFormSnapshot = null;
  renderQuizzes();
  showToast('บันทึกแบบทดสอบเรียบร้อยแล้ว');
}

function renderQuizDetail(){
  const el = document.getElementById('view-quizzes');
  const q = quizzes.find(x=>x.id===quizzesState.id);
  if(!q){ quizzesState={mode:'list'}; renderQuizzes(); return; }
  el.innerHTML = `
    <button class="back-link" onclick="quizzesState={mode:'list'}; renderQuizzes();">‹ กลับ</button>
    <h2 class="detail-title">${escapeHtml(q.title)}${langBadge(q.lang||'en')}</h2>
    <p class="detail-meta">${q.questions.length} ข้อ${q.bestScore!=null ? ` · คะแนนดีที่สุด ${q.bestScore}/${q.bestTotal}` : ' · ยังไม่เคยทำ'}</p>
    ${tagChipsHtml(itemTags(q), 'filterQuizzesByTag')}
    <div class="row-actions" style="margin-top:14px;">
      <button class="btn btn-primary" onclick="startQuiz('${q.id}')">เริ่มทำแบบทดสอบ</button>
      <button class="btn btn-ghost" onclick="openEditQuizForm('${q.id}')">แก้ไข</button>
      <button class="btn btn-danger" id="del-quiz-btn" onclick="confirmDeleteQuiz('${q.id}', this)">ลบแบบทดสอบนี้</button>
    </div>
    ${relatedHtml(q, 'quiz')}`;
}

function confirmDeleteQuiz(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent='ลบแบบทดสอบนี้'; } }, 3000);
    return;
  }
  const idx = quizzes.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removed = quizzes[idx];
  quizzes.splice(idx,1);
  saveQuizzes();
  quizzesState = {mode:'list'};
  renderQuizzes();
  showToast('ลบแบบทดสอบแล้ว', ()=>{
    quizzes.splice(idx,0,removed);
    saveQuizzes();
    quizzesState = {mode:'detail', id};
    renderQuizzes();
  });
}

function startQuiz(id){
  currentAttempt = { quizId:id, answers: new Array(quizzes.find(x=>x.id===id).questions.length).fill(null) };
  quizzesState = {mode:'take', id};
  renderQuizzes();
}

function renderQuizTake(){
  const el = document.getElementById('view-quizzes');
  const q = quizzes.find(x=>x.id===quizzesState.id);
  if(!q){ quizzesState={mode:'list'}; renderQuizzes(); return; }
  el.innerHTML = `
    <button class="back-link" onclick="quizzesState={mode:'detail', id:'${q.id}'}; renderQuizzes();">‹ ออกจากแบบทดสอบ</button>
    <h2 class="detail-title">${escapeHtml(q.title)}${langBadge(q.lang||'en')}</h2>
    <div style="margin-top:10px;">
      ${q.questions.map((qq,qi)=>`
        <div class="take-q">
          <p class="qtext">${qi+1}. ${escapeHtml(qq.text)}</p>
          ${qq.options.map((opt,oi)=>`
            <label class="take-opt">
              <input type="radio" name="take-${qi}" ${currentAttempt.answers[qi]===oi?'checked':''} onchange="setAnswer(${qi},${oi})">
              <span>${escapeHtml(opt)}</span>
            </label>`).join('')}
        </div>`).join('')}
    </div>
    <p class="hint-msg" id="take-hint"></p>
    <button class="btn btn-primary" onclick="submitQuiz()">ตรวจคำตอบ</button>`;
}

function setAnswer(qi, oi){
  currentAttempt.answers[qi] = oi;
  const hint = document.getElementById('take-hint');
  if(hint) hint.textContent = '';
}

function submitQuiz(){
  if(currentAttempt.answers.some(a=>a===null)){
    document.getElementById('take-hint').textContent = 'ตอบให้ครบทุกข้อก่อนส่งนะ';
    return;
  }
  const q = quizzes.find(x=>x.id===currentAttempt.quizId);
  let score = 0;
  const details = q.questions.map((qq,qi)=>{
    const chosen = currentAttempt.answers[qi];
    const correct = chosen === qq.correctIndex;
    if(correct) score++;
    return { text:qq.text, chosenText:qq.options[chosen], correctText:qq.options[qq.correctIndex], correct };
  });
  const total = q.questions.length;
  q.lastAttemptDate = new Date().toISOString();
  if(q.bestScore===null || score > q.bestScore){ q.bestScore = score; q.bestTotal = total; }
  // Points for the first completed attempt only, scaled by how many
  // answers were right — retaking to farm points shouldn't work.
  if(!q.pointsAwarded && score > 0){
    q.pointsAwarded = true;
    const earned = score * QUIZ_POINTS_PER_CORRECT;
    addPoints(earned, 'ทำแบบทดสอบ: ' + q.title, 'notebook');
    pushNotification('points', '+' + fmtPoints(earned) + ' แต้ม', `ทำแบบทดสอบ "${q.title}" ได้ ${score}/${total}`, {type:'quiz', id:q.id});
  }
  saveQuizzes();
  lastResult = { quizId:q.id, quizTitle:q.title, score, total, details };
  quizzesState = {mode:'result'};
  renderQuizzes();
}

function renderQuizResult(){
  const el = document.getElementById('view-quizzes');
  const r = lastResult;
  if(!r){ quizzesState={mode:'list'}; renderQuizzes(); return; }
  const pct = Math.round((r.score/r.total)*100);
  el.innerHTML = `
    <div class="result-wrap">
