/* =========================================================
   NOTEBOOK — log an activity, earn points
   ========================================================= */
const ACTIVITY_KINDS = [
  { key:'read',     label:'อ่านหนังสือ' },
  { key:'exercise', label:'ออกกำลังกาย' },
  { key:'work',     label:'งาน' },
  { key:'study',    label:'เรียน' },
  { key:'other',    label:'อื่นๆ' },
];
function kindLabel(k){ const f = ACTIVITY_KINDS.find(x=>x.key===k); return f ? f.label : 'อื่นๆ'; }

const REPEATS = [
  { key:'none',      label:'ครั้งเดียว',  days:0, months:0  },
  { key:'daily',     label:'ทุกวัน',      days:1, months:0  },
  { key:'weekly',    label:'ทุกสัปดาห์',  days:7, months:0  },
  { key:'monthly',   label:'ทุกเดือน',    days:0, months:1  },
  { key:'quarterly', label:'ทุก 3 เดือน', days:0, months:3  },
  { key:'biannual',  label:'ทุก 6 เดือน', days:0, months:6  },
  { key:'yearly',    label:'ทุกปี',       days:0, months:12 },
];
function repeatLabel(k){ const f = REPEATS.find(x=>x.key===k); return f ? f.label : 'ครั้งเดียว'; }
function isRoutine(a){ return !!(a && a.repeat && a.repeat !== 'none'); }
/* Every day this task was actually done. An empty list means "not yet" —
   only a record saved before tasks had a done list falls back to its date,
   because back then creating one paid out on the spot. */
function doneDatesOf(a){
  if(!a) return [];
  if(Array.isArray(a.doneDates)) return a.doneDates;
  return a.date ? [a.date] : [];
}
function activityDone(a){ return doneDatesOf(a).length > 0; }
function addInterval(dateStr, repeat){
  const f = REPEATS.find(x => x.key === repeat);
  if(!f || (!f.days && !f.months)) return dateStr;
  const [y,m,d] = String(dateStr).split('-').map(Number);
  if(!y || !m || !d) return dateStr;
  const dt = new Date(y, m-1, d);
  if(f.days)   dt.setDate(dt.getDate() + f.days);
  if(f.months) dt.setMonth(dt.getMonth() + f.months);
  return dayKeyOf(dt);
}
/* When this task is next owed. null means there is nothing left to do:
   a one-off that has been done is finished for good. */
function nextDueDate(a){
  const done = doneDatesOf(a).slice().sort();
  if(!isRoutine(a)) return done.length ? null : (a.date || todayInputValue());
  if(!done.length) return a.date || todayInputValue();   // a routine never done starts on its own date
  return addInterval(done[done.length-1], a.repeat);
}
function isDueNow(a){
  const due = nextDueDate(a);
  return !!due && due <= todayInputValue();
}
/* Marking it done is the only thing that pays — once per day for a
   routine, once ever for a one-off. */
function markActivityDone(id){
  const a = wallet.activities.find(x=>x.id===id);
  if(!a) return;
  const today = todayInputValue();
  const done = doneDatesOf(a);
  if(!isRoutine(a) && done.length){ showToast('ภารกิจนี้ทำเสร็จแล้ว'); return; }
  if(done.includes(today)){ showToast('วันนี้บันทึกไปแล้ว'); return; }
  a.doneDates = [...done, today];
  addPoints(a.points, a.title, 'notebook');
  pushNotification('points', '+' + fmtPoints(a.points) + ' แต้ม',
    a.title + (isRoutine(a) ? ' · ' + repeatLabel(a.repeat) : ''), {type:'activity'});
  saveWallet();
  renderNotebook(); renderHome();
  showToast('ทำเสร็จแล้ว +' + fmtPoints(a.points) + ' แต้ม');
}
/* Ticked it by mistake: take the last round back. */
function undoActivityDone(id){
  const a = wallet.activities.find(x=>x.id===id);
  if(!a) return;
  const done = doneDatesOf(a);
  if(!done.length) return;
  if(!spendPoints(a.points, 'ยกเลิก: ' + a.title, 'notebook')){
    showToast('ยกเลิกไม่ได้ เพราะคะแนนคงเหลือไม่พอ'); return;
  }
  a.doneDates = done.slice(0, -1);
  saveWallet();
  renderNotebook(); renderHome();
  showToast('ยกเลิกแล้ว -' + fmtPoints(a.points) + ' แต้ม');
}
function todayInputValue(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function newDraftActivity(){ return { title:'', kind:'read', points:10, date:todayInputValue(), repeat:'none' }; }

  editingActivityId = id; notebookState = {mode:'form'};

function saveActivityForm(){
  const title = (draftActivity.title||'').trim();
  if(!title){ showToast('ใส่ชื่อภารกิจก่อนบันทึก'); return; }
  const points = Math.max(0, Math.round(Number(draftActivity.points) || 0));
  if(!points){ showToast('ใส่คะแนนที่ได้ให้มากกว่า 0'); return; }

  if(editingActivityId){
    // Editing re-balances by the difference, times however many rounds this
    // one has already paid out, so the ledger stays truthful.
    const a = wallet.activities.find(x=>x.id===editingActivityId);
    const rounds = doneDatesOf(a).length || 1;
    const diff = (points - a.points) * rounds;
    if(diff > 0) addPoints(diff, 'แก้ไขกิจกรรม: ' + title, 'notebook');
    else if(diff < 0){
      if(!spendPoints(-diff, 'แก้ไขกิจกรรม: ' + title, 'notebook')){
        showToast('ลดคะแนนไม่ได้ เพราะคะแนนคงเหลือไม่พอ'); return;
      }
    }
    Object.assign(a, { title, kind:draftActivity.kind, points, date:draftActivity.date, repeat:draftActivity.repeat||'none' });
    saveWallet();
    showToast('แก้ไขกิจกรรมแล้ว');
  }else{
    // Setting a task up earns nothing — the points are for doing it.
    wallet.activities.push({ id:uid(), title, kind:draftActivity.kind, points, date:draftActivity.date,
      repeat:draftActivity.repeat||'none', doneDates:[], createdAt:new Date().toISOString() });
    saveWallet();
    showToast('ตั้งภารกิจแล้ว · กด "ทำเสร็จแล้ว" เมื่อทำจริงเพื่อรับ ' + fmtPoints(points) + ' แต้ม');
  }
  notebookFormSnapshot = null; editingActivityId = null;
  notebookState = {mode:'list'};
  renderNotebook(); renderHome();
}

function confirmDeleteActivity(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    const was = btnEl.textContent;
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent = was; } }, 3000);
    return;
  }
  const idx = wallet.activities.findIndex(a=>a.id===id);
  if(idx===-1) return;
  const a = wallet.activities[idx];
  const owed = a.points * (doneDatesOf(a).length || 1);   // every round it paid out
  if(!spendPoints(owed, 'ลบกิจกรรม: ' + a.title, 'notebook')){
    showToast('ลบไม่ได้ เพราะคะแนนคงเหลือไม่พอจะหักคืน'); return;
  }
  wallet.activities.splice(idx,1);
  saveWallet();
  notebookFormSnapshot = null; editingActivityId = null;
  notebookState = {mode:'list'};
  renderNotebook(); renderHome();
  showToast('ลบกิจกรรมแล้ว -' + fmtPoints(owed) + ' แต้ม');
}

    (isDueNow(b)?1:0) - (isDueNow(a)?1:0)

    || String(b.date).localeCompare(String(a.date))

/* =========================================================
   MARKET — spend points on real-life rewards
   ========================================================= */
/* Turning points into real money. The rate is yours to set: how many
   points make one unit of whatever currency you keep at home. */
let draftCash = { points:'' };
let rateFormOpen = false;
let draftRate = null;

function exchangeRate(){ return normalizeExchange(wallet && wallet.exchange); }
function cashFor(points){
  const r = exchangeRate();
  const p = Math.max(0, Math.round(Number(points) || 0));
  return Math.round((p / r.points) * r.amount * 100) / 100;
}
function fmtCash(n){ return (Number(n)||0).toLocaleString('th-TH', { maximumFractionDigits:2 }); }
function rateLine(r){ return `${fmtPoints(r.points)} แต้ม = ${fmtCash(r.amount)} ${r.currency}`; }

function openRateForm(){
  const r = exchangeRate();
  draftRate = { points:r.points, amount:r.amount, currency:r.currency };

/* An item is described by two independent things, and both are picked from
   a single dropdown so the form stays short:

     schedule — WHEN it is on the shelf at all. A shop event can be one
                specific day, that same day every year, that date every
                month, a whole month, that month every year, or a random
                day it decides for itself.
     limit    — HOW MANY you may take while it is there, per day, month,
                half-year, year, or ever.

   Neither keeps a counter of its own: both read the redemptions already
   recorded, so a per-year limit refills by itself when the year turns and
   there is nothing to reset by hand. */

const SCHEDULES = [
  { key:'always',      label:'ขายทุกวัน',                     short:'ทุกวัน',        needs:null    },
  { key:'onceDate',    label:'เฉพาะวันที่กำหนด (ครั้งเดียว)',  short:'วันเดียว',      needs:'date'  },
  { key:'yearlyDay',   label:'วันเดิมนี้ ของทุกปี',            short:'ทุกปี',         needs:'date'  },
  { key:'monthlyDay',  label:'วันที่เดิมนี้ ของทุกเดือน',       short:'ทุกเดือน',      needs:'dom'   },
  { key:'onceMonth',   label:'เฉพาะเดือนที่กำหนด (ครั้งเดียว)', short:'เดือนเดียว',    needs:'month' },
  { key:'yearlyMonth', label:'เดือนเดิมนี้ ของทุกปี',          short:'เดือนนี้ทุกปี', needs:'month' },
  { key:'random',      label:'สุ่มโผล่เอง',                    short:'สุ่ม',          needs:null    },
];
const RANDOM_APPEAR_PERCENT = 10;      // roughly one day in ten
// Month names come from the calendar's TH_MONTHS, declared further up.

function scheduleDef(k){ return SCHEDULES.find(x=>x.key===k) || SCHEDULES[0]; }
function scheduleShort(k){ return scheduleDef(k).short; }

/* Items written before schedules existed carried a `cycle` instead. The two
   old cooldown cycles are exactly a limit of one per period, so they are
   read as that; only 'random' was ever about when a thing appears. */
const LEGACY_CYCLE_LIMIT = { monthly:'month', biannual:'half', yearly:'year', random:'day' };
function scheduleOf(it){
  const raw = it && it.schedule;
  if(raw && SCHEDULES.some(x=>x.key===raw.mode)){
    return { mode:raw.mode, date:raw.date || '', dom:raw.dom || 1, month:raw.month || '' };
  }
  const mode = (it && it.cycle === 'random') ? 'random' : 'always';
  return { mode, date:'', dom:1, month:'' };
}

const LIMIT_PERIODS = [
  { key:'none',  label:'ไม่จำกัด',        word:''          },
  { key:'day',   label:'จำกัดต่อวัน',      word:'วันนี้'    },
  { key:'month', label:'จำกัดต่อเดือน',    word:'เดือนนี้'  },
  { key:'half',  label:'จำกัดต่อครึ่งปี',  word:'ครึ่งปีนี้' },
  { key:'year',  label:'จำกัดต่อปี',       word:'ปีนี้'     },
  { key:'total', label:'จำกัดตลอดกาล',    word:''          },
];
function limitOf(it){
  const k = it && it.limitPer;
  if(LIMIT_PERIODS.some(l=>l.key===k)) return k;
  return (it && LEGACY_CYCLE_LIMIT[it.cycle]) || 'none';
}
function limitCountOf(it){
  if(it && it.limitCount != null) return Math.max(1, Math.round(Number(it.limitCount) || 1));
  return 1;
}
function limitWord(k){ const f = LIMIT_PERIODS.find(l=>l.key===k); return f ? f.word : ''; }

/* ---- day-key arithmetic, all on 'YYYY-MM-DD' strings ---- */
function keyToDate(k){ const [y,m,d] = String(k).split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
function shiftKey(k, days){ const d = keyToDate(k); d.setDate(d.getDate() + days); return dayKeyOf(d); }
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }        // m is 1-based
function monthName(mm){ return TH_MONTHS[(Number(mm) || 1) - 1] || ''; }

/* Same answer on every device and all day long, without storing anything:
   the roll is a hash of the item and today's date. */
function hashInt(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function appearsToday(itemId, dayKey){ return (hashInt(itemId + '@' + dayKey) % 100) < RANDOM_APPEAR_PERCENT; }

/* Is the item on the shelf on this particular day? */
function onShelfOn(it, dayKey){
  const s = scheduleOf(it);
  switch(s.mode){
    case 'always':      return true;
    case 'random':      return appearsToday(it.id, dayKey);
    case 'onceDate':    return !!s.date && s.date === dayKey;
    case 'yearlyDay':   return !!s.date && s.date.slice(5) === dayKey.slice(5);
    case 'onceMonth':   return !!s.month && s.month === dayKey.slice(0, 7);
    case 'yearlyMonth': return !!s.month && s.month.slice(5, 7) === dayKey.slice(5, 7);
    case 'monthlyDay': {
      const [y, m, d] = dayKey.split('-').map(Number);
      // A 31st still lands in a 30-day month, on its last day.
      return d === Math.min(s.dom, daysInMonth(y, m));
    }
    default: return true;
  }
}
/* The next day it will be on the shelf, or '' when there is no telling. */
function nextShelfDay(it, fromKey){
  const s = scheduleOf(it);
  if(s.mode === 'always') return fromKey;
  if(s.mode === 'random') return '';                    // it decides each morning
  if(s.mode === 'onceDate') return s.date >= fromKey ? s.date : '';
  if(s.mode === 'onceMonth'){
    if(!s.month) return '';
    const first = s.month + '-01';
    return s.month >= fromKey.slice(0, 7) ? (first >= fromKey ? first : fromKey) : '';
  }
  for(let i = 0, k = fromKey; i < 400; i++, k = shiftKey(k, 1)){
    if(onShelfOn(it, k)) return k;
  }
  return '';
}
function scheduleSummary(it){
  const s = scheduleOf(it);
  switch(s.mode){
    case 'always':      return 'ขายทุกวัน';
    case 'random':      return `สุ่มโผล่เอง ~${RANDOM_APPEAR_PERCENT}% ของวัน`;
    case 'onceDate':    return `ขายเฉพาะ ${s.date} วันเดียว`;
    case 'yearlyDay':   return `ขายวันที่ ${Number(s.date.slice(8))} ${monthName(s.date.slice(5,7))} ของทุกปี`;
    case 'monthlyDay':  return `ขายวันที่ ${s.dom} ของทุกเดือน`;
    case 'onceMonth':   return `ขายทั้งเดือน ${monthName(s.month.slice(5,7))} ${s.month.slice(0,4)} เดือนเดียว`;
    case 'yearlyMonth': return `ขายทั้งเดือน ${monthName(s.month.slice(5,7))} ของทุกปี`;
    default: return '';
  }
}

/* ---- limits, counted straight off the redemptions ---- */
function periodKeyOf(per, dayKey){
  switch(per){
    case 'day':   return dayKey;
    case 'month': return dayKey.slice(0, 7);
    case 'half':  return dayKey.slice(0, 4) + '-H' + (Number(dayKey.slice(5, 7)) <= 6 ? 1 : 2);
    case 'year':  return dayKey.slice(0, 4);
    case 'total': return 'ALL';
    default: return '';
  }
}
function usedInPeriod(itemId, per){
  const rows = wallet.redemptions.filter(r => r.itemId === itemId);
  if(per === 'total') return rows.length;
  const cur = periodKeyOf(per, todayInputValue());
  if(!cur) return 0;
  return rows.filter(r => periodKeyOf(per, isoToDayKey(r.redeemedAt) || '') === cur).length;
}
/* When the allowance fills back up — the answer to "do I have to set this
   up again next year?", which is no. */
function limitResetsOn(per, dayKey){
  const [y, m] = dayKey.split('-').map(Number);
  switch(per){
    case 'day':   return shiftKey(dayKey, 1);
    case 'month': return m === 12 ? `${y+1}-01-01` : `${y}-${String(m+1).padStart(2,'0')}-01`;
    case 'half':  return m <= 6 ? `${y}-07-01` : `${y+1}-01-01`;
    case 'year':  return `${y+1}-01-01`;
    default: return '';
  }
}
function quotaState(it){
  const per = limitOf(it);
  if(per === 'none') return { limited:false, per, left:Infinity };
  const cap = limitCountOf(it);
  const used = usedInPeriod(it.id, per);
  return { limited:true, per, cap, used, left: Math.max(0, cap - used) };
}
function quotaChipText(q){
  if(!q.limited) return '';
  if(q.per === 'total') return q.left > 0 ? `เหลือ ${fmtPoints(q.left)} ครั้ง` : 'หมดถาวร';
  return q.left > 0 ? `เหลือ ${fmtPoints(q.left)}/${fmtPoints(q.cap)} ${limitWord(q.per)}`
                    : `ครบโควตา${limitWord(q.per)}`;
}

/* Both gates in one answer: ready, and if not, why and when it changes. */
function itemAvailability(it){
  const today = todayInputValue();
  const sched = scheduleOf(it);
  const quota = quotaState(it);
  const open = onShelfOn(it, today);

  if(quota.limited && quota.left <= 0){
    if(quota.per === 'total') return { ready:false, quota, sched, reason:'แลกครบแล้ว ไม่มีอีก' };
    const back = limitResetsOn(quota.per, today);
    // Once the allowance refills it still has to be a selling day.
    const next = nextShelfDay(it, back);
    return { ready:false, quota, sched, reason:`ครบโควตา${limitWord(quota.per)}`,
             next: next || back, nextIsReset:true };
  }
  if(open) return { ready:true, quota, sched, hot: sched.mode === 'random' };

  const next = nextShelfDay(it, shiftKey(today, 1));
  if(sched.mode === 'random') return { ready:false, quota, sched, reason:'วันนี้ยังไม่โผล่' };
  if(!next) return { ready:false, quota, sched, reason:'เลยวันขายไปแล้ว' };
  return { ready:false, quota, sched, reason:'ยังไม่ถึงวันขาย', next };
}

/* Typing in the count box only rewrites the one line that depends on it,
   so the caret stays where the fingers left it. */
function limitHintText(d){
  const per = limitOf(d), n = fmtPoints(limitCountOf(d));
  if(per === 'total') return `มีทั้งหมด ${n} ครั้งเท่านั้น แลกครบแล้วหมดถาวร`;

         `ครบแล้วเติมเองอัตโนมัติ ${back} ไม่ต้องมาตั้งใหม่`;

}

function openNewItemForm(){
  draftItem = newDraftItem();
  editingItemId = null; marketState = {mode:'form'}; marketSection = 'shop';
  marketFormSnapshot = JSON.stringify(draftItem);
  renderMarket();
}
function openEditItemForm(id){
  const it = wallet.marketItems.find(x=>x.id===id); if(!it) return;
  const s = scheduleOf(it);
  draftItem = { name:it.name, desc:it.desc||'', price:it.price,
                schedule:{ mode:s.mode,
                           date:s.date || todayInputValue(),
                           dom:s.dom || 1,
                           month:s.month || todayInputValue().slice(0,7) },
                limitPer:limitOf(it), limitCount:limitCountOf(it) };
  editingItemId = id; marketState = {mode:'form'}; marketSection = 'shop';
  marketFormSnapshot = JSON.stringify(draftItem);
  renderMarket();
}
function cancelItemForm(){
  marketFormSnapshot = null; editingItemId = null;
  marketState = {mode:'manage'}; renderMarket();
}
function saveItemForm(){
  const name = (draftItem.name||'').trim();
  if(!name){ showToast('ใส่ชื่อไอเทมก่อนบันทึก'); return; }
  const price = Math.max(1, Math.round(Number(draftItem.price) || 0));
  const mode = scheduleDef(draftItem.schedule.mode).key;
  const needs = scheduleDef(mode).needs;
  if(needs === 'date' && !draftItem.schedule.date){ showToast('เลือกวันที่ก่อน'); return; }
  if(needs === 'month' && !draftItem.schedule.month){ showToast('เลือกเดือนก่อน'); return; }
  const schedule = { mode };
  if(needs === 'date')  schedule.date  = draftItem.schedule.date;
  if(needs === 'dom')   schedule.dom   = Math.min(31, Math.max(1, Math.round(Number(draftItem.schedule.dom) || 1)));
  if(needs === 'month') schedule.month = draftItem.schedule.month;
  const limitPer = limitOf(draftItem);
  const limitCount = limitCountOf(draftItem);
  if(editingItemId){
    const it = wallet.marketItems.find(x=>x.id===editingItemId);
    Object.assign(it, { name, desc:(draftItem.desc||'').trim(), price, schedule, limitPer, limitCount });
    delete it.cycle;                      // the schedule now says everything
  }else{
    wallet.marketItems.push({ id:uid(), name, desc:(draftItem.desc||'').trim(), price, schedule,
                              limitPer, limitCount, createdAt:new Date().toISOString() });
  }
  saveWallet();
  marketFormSnapshot = null; editingItemId = null;
  marketState = {mode:'manage'};
  renderMarket();
  showToast('บันทึกไอเทมแล้ว');
}
function confirmDeleteItem(id, btnEl){
  if(btnEl.dataset.confirm !== '1'){
    const was = btnEl.textContent;
    btnEl.dataset.confirm = '1'; btnEl.textContent = 'ยืนยันการลบ?';
    setTimeout(()=>{ if(btnEl.isConnected){ btnEl.dataset.confirm=''; btnEl.textContent = was; } }, 3000);
    return;
  }
  const idx = wallet.marketItems.findIndex(x=>x.id===id);
  if(idx===-1) return;
  wallet.marketItems.splice(idx,1);
  saveWallet();
  marketFormSnapshot = null; editingItemId = null;
  marketState = {mode:'manage'};
  renderMarket();
  showToast('ลบไอเทมแล้ว');
}

function renderMarketForm(){
  const el = document.getElementById('view-market');
  const s = draftItem.schedule;
  const needs = scheduleDef(s.mode).needs;
  const extra =
    needs === 'date'  ? `<input type="date" id="sched-date-input" value="${escapeHtml(s.date)}" oninput="setDraftScheduleField('date', this.value)">`
  : needs === 'month' ? `<input type="month" id="sched-month-input" value="${escapeHtml(s.month)}" oninput="setDraftScheduleField('month', this.value)">`
  : needs === 'dom'   ? `<input type="number" min="1" max="31" step="1" inputmode="numeric" id="sched-dom-input"
                                value="${escapeHtml(String(s.dom))}" oninput="setDraftScheduleField('dom', this.value)">`
  : '';
  el.innerHTML = `
    <button class="back-link" onclick="cancelItemForm()">‹ กลับ</button>
    <div class="form-block">
      <div class="field">
        <label>ชื่อไอเทม</label>
        <input type="text" id="item-name-input" placeholder="เช่น ใบลาหยุด 1 วัน" value="${escapeHtml(draftItem.name)}" oninput="draftItem.name=this.value">
      </div>
      <div class="field">
        <label>คำอธิบาย (ถ้ามี)</label>
        <input type="text" placeholder="เช่น ใช้ขอลาหยุดได้ 1 วันโดยไม่รู้สึกผิด" value="${escapeHtml(draftItem.desc)}" oninput="draftItem.desc=this.value">
      </div>
      <div class="field">
        <label>ราคา (แต้ม)</label>
        <input type="number" min="1" step="1" inputmode="numeric" value="${escapeHtml(String(draftItem.price))}" oninput="draftItem.price=this.value">
      </div>
      <div class="field">
        <label>วางขายเมื่อไร</label>
        <select id="sched-mode-select" onchange="setDraftSchedule(this.value)">
          ${SCHEDULES.map(c=>`<option value="${c.key}" ${s.mode===c.key?'selected':''}>${c.label}</option>`).join('')}
        </select>
        ${extra ? `<div class="sched-extra">${extra}</div>` : ''}
        <p class="field-hint" id="sched-hint">${escapeHtml(scheduleSummary(draftItem))}</p>
      </div>
      <div class="field">
        <label>จำนวนที่แลกได้</label>
        <select id="item-limit-select" onchange="setDraftItemLimit(this.value)">
          ${LIMIT_PERIODS.map(l=>`<option value="${l.key}" ${limitOf(draftItem)===l.key?'selected':''}>${l.label}</option>`).join('')}
        </select>
        ${limitOf(draftItem)!=='none' ? `
          <div class="sched-extra">
            <input type="number" min="1" step="1" inputmode="numeric" id="item-limit-input"
                   value="${escapeHtml(String(limitCountOf(draftItem)))}" oninput="setDraftItemCount(this.value)">
          </div>
          <p class="field-hint" id="item-limit-hint">${escapeHtml(limitHintText(draftItem))}</p>
        ` : ''}
      </div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary" onclick="saveItemForm()">บันทึกไว้</button>
      <button class="btn btn-ghost" onclick="cancelItemForm()">ยกเลิก</button>
    </div>
    ${editingItemId ? `
      <div class="danger-zone">
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteItem('${editingItemId}', this)">ลบไอเทมนี้</button>
      </div>` : ''}`;
}

/* =========================================================
   BUYING, AND THE BAG OF THINGS ALREADY BOUGHT
   ========================================================= */
function redeemItem(id){
  const it = wallet.marketItems.find(x=>x.id===id); if(!it) return;
  const avail = itemAvailability(it);
  if(!avail.ready){
    showToast(avail.next ? avail.reason + ' · กลับมา ' + avail.next : avail.reason);
    return;
  }
  if(!spendPoints(it.price, 'แลก: ' + it.name, 'market')){
    showToast('คะแนนไม่พอ ต้องมีอีก ' + fmtPoints(it.price - wallet.balance) + ' แต้ม');
    return;
  }
  wallet.redemptions.push({ id:uid(), itemId:it.id, name:it.name, price:it.price, redeemedAt:new Date().toISOString() });
  saveWallet();
  pushNotification('market', 'ซื้อ ' + it.name + ' แล้ว', 'อยู่ในคลังของคุณ · -' + fmtPoints(it.price) + ' แต้ม', {type:'bag'});
  renderMarket(); renderHome();
  const after = quotaState(it);
  showToast('ซื้อ "' + it.name + '" แล้ว เก็บไว้ในคลัง'
    + (after.limited && after.left <= 0 ? ' · ' + quotaChipText(after) : ''));
}
/* The bag is just the redemptions, with a flag for the ones spent for real. */
function markUsed(id){
  const r = wallet.redemptions.find(x=>x.id===id); if(!r || r.usedAt) return;
  r.usedAt = new Date().toISOString();
  saveWallet(); renderMarket();
  showToast('ใช้ "' + r.name + '" แล้ว · เอาออกจากคลังให้แล้ว');
}
function markUnused(id){
  const r = wallet.redemptions.find(x=>x.id===id); if(!r || !r.usedAt) return;
  delete r.usedAt;
  saveWallet(); renderMarket();
  showToast('เอา "' + r.name + '" กลับเข้าคลังแล้ว');
}
function bagRows(){
  return [...wallet.redemptions].sort((a,b)=> new Date(b.redeemedAt) - new Date(a.redeemedAt));
}
function unusedCount(){ return wallet.redemptions.filter(r=>!r.usedAt).length; }

/* =========================================================
   MARKET SCREENS — shop / manage / bag
   ========================================================= */
function switchMarket(section){
  if(!confirmLeaveIfDirty()) return;
  marketSection = section;
  marketState = { mode:'list' };
  renderMarket();
}
function openShopManage(){
  if(!confirmLeaveIfDirty()) return;
  marketSection = 'shop';
  marketState = { mode:'manage' };
  renderMarket();
}
function closeShopManage(){
  marketState = { mode:'list' };
  renderMarket();
}
function marketSubtabsHtml(){
  const onShelf = wallet.marketItems.filter(it => itemAvailability(it).ready).length;
  const bag = unusedCount();
  return `
    <div class="hub-subtabs">
      <button type="button" class="hub-tab ${marketSection==='shop'?'active':''}" onclick="switchMarket('shop')">ร้านค้า${onShelf?` (${fmtPoints(onShelf)})`:''}</button>
      <button type="button" class="hub-tab ${marketSection==='bag'?'active':''}" onclick="switchMarket('bag')">คลังของฉัน${bag?` (${fmtPoints(bag)})`:''}</button>
    </div>`;
}
function itemChipsHtml(it, av){
  const s = av.sched || scheduleOf(it);
  const q = av.quota || quotaState(it);
  const schedChip = s.mode !== 'always'
    ? `<span class="kind-chip ${av.hot?'hot':'repeat'}">${av.hot ? 'โผล่วันนี้!' : escapeHtml(scheduleShort(s.mode))}</span>` : '';
  const quotaChip = q.limited
    ? `<span class="kind-chip ${q.left>0?'repeat':''}">${escapeHtml(quotaChipText(q))}</span>` : '';
  return schedChip + quotaChip;
}

/* --- the shop: buying, and nothing else --- */
function shopHtml(){
  const open = wallet.marketItems.filter(it => itemAvailability(it).ready)
    .sort((a,b)=>{ const A = itemAvailability(a), B = itemAvailability(b);
                   return (B.hot?1:0) - (A.hot?1:0) || a.price - b.price; });
  return cashExchangeHtml() + `
    <div class="list-head">
      <h2>วางขายวันนี้</h2>
      <button class="btn btn-ghost btn-sm" onclick="openShopManage()">⚙ จัดการร้านค้า</button>
    </div>
    ${open.length===0 ? `
      <div class="empty">
        <div class="doodle">🏪</div>
        <p>${wallet.marketItems.length
             ? 'วันนี้ยังไม่มีของวางขาย ของที่ถึงวันขายหรือสุ่มโผล่จะขึ้นมาตรงนี้เอง'
             : 'ร้านยังว่าง ไปตั้งรางวัลให้ตัวเองในจัดการร้านค้าก่อน'}</p>
        <button class="btn btn-primary" onclick="openShopManage()">จัดการร้านค้า</button>
      </div>` : `
      <div class="cards">
        ${open.map(it=>{
          const av = itemAvailability(it);
          const affordable = wallet.balance >= it.price;
          return `
          <div class="card">
            <div class="card-top">
              <p class="card-title">${escapeHtml(it.name)}${itemChipsHtml(it, av)}</p>
              <span class="price-tag">${fmtPoints(it.price)} แต้ม</span>
            </div>
            ${it.desc ? `<p class="card-snippet">${escapeHtml(it.desc)}</p>` : ''}
            <div class="item-card-foot">
              <button class="btn ${affordable ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="redeemItem('${it.id}')">
                ${affordable ? 'ซื้อเลย' : 'ยังขาด ' + fmtPoints(it.price - wallet.balance) + ' แต้ม'}
              </button>
            </div>
          </div>`;
        }).join('')}
      </div>`}`;
}

/* --- managing the shop: the rate, and every item whether on sale or not --- */
function statusText(it, av){
  if(av.ready) return av.hot ? 'สุ่มโผล่วันนี้ — วางขายอยู่' : 'วางขายอยู่ตอนนี้';
  if(av.next) return av.reason + ' · ' + (av.nextIsReset ? 'เติมโควตาและกลับมา ' : 'กลับมา ') + av.next;
  return av.reason;
}
function manageHtml(){
  const items = [...wallet.marketItems].sort((a,b)=>{
    const A = itemAvailability(a), B = itemAvailability(b);
    return (B.ready?1:0) - (A.ready?1:0) || a.price - b.price;
  });
  const onShelf = items.filter(it => itemAvailability(it).ready).length;
  return `
    <button class="back-link" onclick="closeShopManage()">‹ กลับไปหน้าร้าน</button>
    ${rateCardHtml()}
    <div class="list-head">
      <h2>ของในร้าน</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewItemForm()">+ เพิ่มไอเทม</button>
    </div>
    ${items.length===0 ? `
      <div class="empty">
        <div class="doodle">🎁</div>
        <p>ยังไม่มีของในร้าน ลองตั้งรางวัลให้ตัวเอง เช่น ใบลาหยุด 1 วัน หรือของที่อยากซื้อ</p>
        <button class="btn btn-primary" onclick="openNewItemForm()">+ เพิ่มไอเทมแรก</button>
      </div>` : `
      <p class="cash-total">มีทั้งหมด ${fmtPoints(items.length)} ชิ้น · วางขายวันนี้ ${fmtPoints(onShelf)} ชิ้น</p>
      <div class="cards">
        ${items.map(it=>{
          const av = itemAvailability(it);
          return `
          <div class="card ${av.ready ? '' : 'is-locked'}">
            <div class="card-top">
              <p class="card-title">${escapeHtml(it.name)}${itemChipsHtml(it, av)}</p>
              <span class="price-tag">${fmtPoints(it.price)} แต้ม</span>
            </div>
            ${it.desc ? `<p class="card-snippet">${escapeHtml(it.desc)}</p>` : ''}
            <p class="field-hint">${escapeHtml(scheduleSummary(it))}</p>
            <p class="field-hint">${escapeHtml(statusText(it, av))}</p>
            <div class="item-card-foot">
              <span></span>
              <button class="btn btn-ghost btn-sm" onclick="openEditItemForm('${it.id}')">แก้ไข</button>
            </div>
          </div>`;
        }).join('')}
      </div>`}`;
}

/* --- the bag: what the points already bought --- */
/* The bag holds what you still have. Using something takes it out of the
   bag — the record stays behind, because the purchase is what the limits
   and the calendar are counted from, but it is folded away in a history
   you only see if you ask for it. */
function toggleBagHistory(){ bagHistoryOpen = !bagHistoryOpen; renderMarket(); }

function bagHtml(){
  const rows = bagRows();
  const unused = rows.filter(r=>!r.usedAt);
  const used = rows.filter(r=>r.usedAt);
  const card = (r, isUsed) => `
    <div class="card ${isUsed ? 'is-locked' : ''}">
      <div class="card-top">
        <p class="card-title">${escapeHtml(r.name)}${isUsed ? '<span class="kind-chip">ใช้แล้ว</span>' : ''}</p>
        <span class="price-tag">${fmtPoints(r.price)} แต้ม</span>
      </div>
      <p class="field-hint">ซื้อเมื่อ ${fmtShortDate(r.redeemedAt)}${isUsed ? ' · ใช้เมื่อ ' + fmtShortDate(r.usedAt) : ''}</p>
      <div class="item-card-foot">
        ${isUsed
          ? `<button class="btn btn-ghost btn-sm" onclick="markUnused('${r.id}')">เอากลับเข้าคลัง</button>`
          : `<button class="btn btn-primary btn-sm" onclick="markUsed('${r.id}')">ใช้เลย</button>`}
        <span></span>
      </div>
    </div>`;
  const history = used.length ? `
    <div class="bag-history">
      <button class="btn btn-ghost btn-sm" onclick="toggleBagHistory()">
        ${bagHistoryOpen ? 'ซ่อนประวัติ' : 'ดูของที่ใช้ไปแล้ว ' + fmtPoints(used.length) + ' ชิ้น'}
      </button>
      ${bagHistoryOpen ? `<div class="cards" style="margin-top:12px;">${used.map(r=>card(r,true)).join('')}</div>` : ''}
    </div>` : '';
  return `
    <div class="list-head">
      <h2>ของที่ซื้อไว้</h2>
    </div>
    ${unused.length ? `
      <p class="cash-total">พร้อมใช้ ${fmtPoints(unused.length)} ชิ้น</p>
      <div class="cards">${unused.map(r=>card(r,false)).join('')}</div>` : `
      <div class="empty">
        <div class="doodle">🎒</div>
        <p>${rows.length
             ? 'ใช้ไปหมดแล้ว ยังไม่มีของที่รอใช้'
             : 'ยังไม่ได้ซื้ออะไร ของที่ซื้อจากร้านค้าจะมาเก็บไว้ที่นี่จนกว่าจะเอาไปใช้จริง'}</p>
        <button class="btn btn-primary" onclick="switchMarket('shop')">ไปที่ร้านค้า</button>
      </div>`}
    ${history}`;
}

function renderMarket(){ renderMarketImpl(); updateCashPreview(); updateRatePreview(); pushHistoryState(); }
function renderMarketImpl(){
  const el = document.getElementById('view-market');
  if(!el || !wallet) return;
  if(marketState.mode === 'form'){ renderMarketForm(); return; }
  if(marketSection === 'bag'){ el.innerHTML = marketSubtabsHtml() + bagHtml(); return; }
  if(marketState.mode === 'manage'){ el.innerHTML = manageHtml(); return; }
  el.innerHTML = marketSubtabsHtml() + shopHtml();
}

/* =========================================================
   READ LIST — lessons and free notes browsed as one library
   Both collections keep their own shape and their own detail /
   form screens; this is the shared front door to them.
   ========================================================= */
let readSearch = '';
let readFilter = 'all';                // 'all' | 'en' | 'zh' | 'note'
const READ_FILTERS = [
  { key:'all',  label:'ทั้งหมด', cls:'all' },
  { key:'en',   label:'อังกฤษ',  cls:'en'  },
  { key:'zh',   label:'จีน',     cls:'zh'  },
  { key:'note', label:'โน้ต',    cls:'all' },
];
function setReadFilter(key){ readFilter = key; renderReadList(); }
function setReadSearch(value){
  readSearch = value;
  renderReadList();
  const input = document.getElementById('read-search-input');
  if(input){ input.focus(); const p = input.value.length; input.setSelectionRange(p,p); }
}
function readItems(){
  const lessons = notes.map(n=>({
    kind:'lesson', id:n.id, title:n.title, tags:itemTags(n), updatedAt:n.updatedAt,
    completed:!!n.completed, lang:n.lang||'en',
    snippet: n.format==='vocab'
      ? `${(n.entries||[]).length} คำศัพท์ · ${(n.entries||[]).slice(0,3).map(e=>e.word).join(', ')}`
      : stripMd(n.content).slice(0,80)
  }));
  const free = journal.map(j=>({
    kind:'note', id:j.id, title:j.title, tags:itemTags(j), updatedAt:j.updatedAt,
    completed:!!j.completed, snippet: stripMd(j.content).slice(0,80)
  }));
  const pool = readFilter === 'note' ? free
             : readFilter === 'all'  ? [...lessons, ...free]
             : lessons.filter(l=> l.lang === readFilter);
  // "#ทักทาย hello" means both: the tag AND the words.
  const { tags:qTags, text:qText } = splitQuery(readSearch);
  const all = pool.filter(it=>{
    if(qTags.length && !qTags.every(k=> it.tags.some(t=> normTag(t).includes(k)))) return false;
    if(!qText) return true;
    return String(it.title||'').toLowerCase().includes(qText)
        || String(it.snippet||'').toLowerCase().includes(qText);
  });
  return all.sort((a,b)=> new Date(b.updatedAt||0) - new Date(a.updatedAt||0));
}
function openReadItem(kind, id){
  if(kind==='lesson'){ notesState = {mode:'detail', id}; }
  else { journalState = {mode:'detail', id}; }
  renderHub(); pushHistoryState();
}
function renderReadList(){
  const el = document.getElementById('read-list');
  if(!el) return;
  const items = readItems();
  const total = notes.length + journal.length;

  // Unread notifications surface at the front door of the hub too,
  // not only on the home board.
  const unread = unreadCount();
  const strip = unread ? `
    <div class="notif-strip">
      <span>มีแจ้งเตือนใหม่ ${unread} รายการ</span>
      <button class="btn btn-ghost btn-sm" onclick="switchTab('home')">ดูบอร์ด</button>
    </div>` : '';

  el.innerHTML = strip + `
    <div class="list-head">
      <h2>เนื้อหาทั้งหมด (${total})</h2>
      <span class="row-actions">
        <button class="btn btn-primary btn-sm" onclick="openNewNoteForm()">+ บทเรียน</button>
        <button class="btn btn-ghost btn-sm" onclick="openNewJournalForm()">+ โน้ต</button>
      </span>
    </div>
    ${total ? `<input type="text" class="search-input" id="read-search-input" placeholder="ค้นหาเนื้อหา..." value="${escapeHtml(readSearch)}" oninput="setReadSearch(this.value)">` : ''}
    ${total ? `<div class="filters">${READ_FILTERS.map(f=>`
        <button type="button" class="lang-chip ${f.cls} ${readFilter===f.key?'active':''}" onclick="setReadFilter('${f.key}')">${f.label}</button>`).join('')}</div>` : ''}
    ${total===0 ? `
      <div class="empty">
        <div class="doodle">📚</div>
        <p>ยังไม่มีเนื้อหา เพิ่มบทเรียนที่ต้องอ่าน (ทำเครื่องหมายว่าอ่านจบแล้วได้แต้ม)
           หรือโน้ตทั่วไป เช่น โน้ตเกม สูตรอาหาร ได้เลย</p>
        <button class="btn btn-primary" onclick="openNewNoteForm()">+ เพิ่มบทเรียนแรก</button>
      </div>` : items.length===0 ? `
      <div class="empty"><p>ไม่พบเนื้อหาที่ตรงกับที่ค้นหา</p></div>` : `
      <div class="cards">
        ${items.map(it=>`
          <div class="card" onclick="openReadItem('${it.kind}','${it.id}')">
            <div class="card-top">
              <p class="card-title">${escapeHtml(it.title || 'ไม่มีหัวข้อ')}
                <span class="kind-chip">${it.kind==='lesson' ? 'บทเรียน' : 'โน้ต'}</span>
                ${it.completed ? '<span class="check-mark">✓</span>' : ''}</p>
            </div>
            <p class="card-snippet">${escapeHtml(it.snippet||'')}</p>
            <p class="card-meta">${it.updatedAt ? fmtShortDate(it.updatedAt) : ''}${it.tags.length ? ' · ' + it.tags.map(t=>'#'+escapeHtml(String(t).replace(/^#+/,''))).join(' ') : ''}</p>
          </div>`).join('')}
      </div>`}`;
}

/* Quizzes live under the activities section: taking one earns points. */
function setSearchQuizzes(value){
  quizzesSearch = value;
  renderQuizLauncher();
  const input = document.getElementById('quiz-search-input');
  if(input){ input.focus(); const p = input.value.length; input.setSelectionRange(p,p); }
}
function quizMatchesSearch(q, term){
  const { tags:qTags, text:qText } = splitQuery(term);
  if(qTags.length && !qTags.every(k=> itemTags(q).some(t=> normTag(t).includes(k)))) return false;
  if(!qText) return true;
  return String(q.title||'').toLowerCase().includes(qText)
      || (q.questions||[]).some(x=> String(x.text||'').toLowerCase().includes(qText));
}
function renderQuizLauncher(){
  const el = document.getElementById('quiz-launcher');
  if(!el) return;
  const list = quizzes.filter(q=> quizMatchesSearch(q, quizzesSearch))
    .sort((a,b)=> String(a.title||'').localeCompare(String(b.title||'')));
  el.innerHTML = `
    <div class="list-head" style="margin-top:26px;">
      <h2>แบบทดสอบ</h2>
      <button class="btn btn-primary btn-sm" onclick="openNewQuizForm()">+ เพิ่มแบบทดสอบ</button>
    </div>
    ${quizzes.length ? `<input type="text" class="search-input" id="quiz-search-input" placeholder="ค้นหาแบบทดสอบ..." value="${escapeHtml(quizzesSearch)}" oninput="setSearchQuizzes(this.value)">` : ''}
    ${quizzes.length && list.length===0 ? `<div class="empty"><p>ไม่พบแบบทดสอบที่ตรงกับที่ค้นหา</p></div>` : ''}
    ${quizzes.length===0 ? `
      <p style="color:var(--ink-soft); font-size:13.5px;">ยังไม่มีแบบทดสอบ — สร้างไว้ทดสอบตัวเองแล้วได้แต้มตามจำนวนข้อที่ตอบถูก</p>` : `
      <div class="cards">
        ${list.map(q=>`
          <div class="card">
            <div class="card-top">
              <p class="card-title">${escapeHtml(q.title || 'ไม่มีหัวข้อ')}
                ${q.pointsAwarded ? '<span class="kind-chip">ได้แต้มแล้ว</span>' : ''}</p>
              <span class="price-tag">${(q.questions||[]).length} ข้อ</span>
            </div>
            ${q.bestScore!=null ? `<p class="card-meta">คะแนนดีที่สุด ${q.bestScore}/${q.bestTotal}</p>` : ''}
            <div class="row-actions" style="margin-top:8px;">
              <button class="btn btn-primary btn-sm" onclick="startQuiz('${q.id}')">เริ่มทำ</button>
              <button class="btn btn-ghost btn-sm" onclick="quizzesState={mode:'detail', id:'${q.id}'}; renderQuizzes();">รายละเอียด</button>
            </div>
          </div>`).join('')}
      </div>`}`;
}

/* ---------------- Init ----------------
   loadAll() is kicked off by the PIN gate's unlock(), not here, so the
   Google sign-in popup never opens behind the lock screen. */
setDateLine();
